[package]
name = "bemtvi-mitsuami"
description = "bemtvi in a mitsuami application: the editor as a view an app mounts in its own layout, and the handle the app drives it with."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# mitsuami runs its tests itself (native UI must own the main thread).
[[test]]
name = "embed"
harness = false

[dependencies]
anyhow.workspace = true
rmpv.workspace = true
tokio.workspace = true
# The client without a toolkit (renderer, sessions, the IO thread); this crate is its
# mitsuami view.
bemtvi-gpu.workspace = true
# The view, its surface, input, dialogs and clipboard (see the root Cargo.toml).
mitsuami.workspace = true
bemtvi-rpc.workspace = true
bemtvi-view.workspace = true
# `ex_names::escape_file_arg`, for `EditorHandle::open`.
bemtvi-core.workspace = true
# `ConfigSource`, re-exported for `Editor::config_source`.
bemtvi-server = { workspace = true, features = ["native"] }

[dev-dependencies]
bemtvi-test-harness.workspace = true
# mitsuami's test kit: `tests/embed.rs` mounts the editor in a (headless) mitsuami app.
mitsuami-test.workspace = true
