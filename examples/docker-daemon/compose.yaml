# podman-compose / docker compose front-end for the nxvim remote daemon + web client.
#
#     # Build the wasm bundle once on the host (needs emcc + node):
#     crates/nxvim-edithost/build.sh
#
#     podman compose -f examples/docker-daemon/compose.yaml up --build
#     # or: docker compose -f examples/docker-daemon/compose.yaml up --build
#
# Then, from the repo root, either:
#     examples/docker-daemon/connect.sh        # native TUI client → daemon
#     examples/docker-daemon/connect-web.sh    # browser URL → daemon
services:
  nxvim-daemon:
    build:
      # Build context is the repo root — the Containerfile compiles the whole crate.
      context: ../..
      dockerfile: examples/docker-daemon/Containerfile
    image: nxvim-daemon
    container_name: nxvim-daemon
    ports:
      # QUIC is UDP. Published on ALL host interfaces (no 127.0.0.1 prefix) so the daemon
      # is reachable off-host — the per-launch token + TOFU cert are the auth gate. Drop
      # the bind back to "127.0.0.1:8765:8765/udp" if you only want local access.
      - "8765:8765/udp"

  nxvim-web:
    build:
      # Context is the edit-host crate dir (where the prebuilt web/ + dist/ live); the
      # dockerfile path is relative to that context.
      context: ../../crates/nxvim-edithost
      dockerfile: ../../examples/docker-daemon/Containerfile.web
    image: nxvim-web
    container_name: nxvim-web
    ports:
      # Plain HTTP, published on ALL host interfaces. NOTE: WebTransport needs a secure
      # context — that holds on http://localhost, but NOT when the page is reached over
      # this off-host binding by IP/hostname (you'd need HTTPS in front). For local use,
      # bind back to "127.0.0.1:8088:8088" and open http://localhost:8088.
      - "8089:8088"
