[package]
name = "nxvim-gui"
description = "Native (winit + wgpu) GUI client for nxvim (a thin RPC client; renders the server's View)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "nxvim-gui"
path = "src/main.rs"


[dependencies]
anyhow.workspace = true
# Real CLI parsing (derive), matching the `nxvim` (TUI) binary: `--help`/`--version`,
# unknown-flag rejection, and typed values come for free instead of hand-rolled scanning.
clap.workspace = true
rmpv.workspace = true
tokio.workspace = true
winit.workspace = true
wgpu.workspace = true
glyphon.workspace = true
# Direct dep only to turn on cosmic-text's `monospace_fallback` feature (see the
# workspace dep note); glyphon still owns the actual text-render types we use.
cosmic-text.workspace = true
# `unicode_script::Script` types the `Fallback::script_fallback` impl in render.rs;
# must be the same crate version cosmic-text (via glyphon) uses (see workspace dep).
unicode-script.workspace = true
# Cell-width accounting for the wide-glyph / emoji renderer (render.rs): how many
# grid cells a cluster occupies, matching the server's column model.
unicode-width.workspace = true
pollster.workspace = true
nxvim-rpc.workspace = true
nxvim-view.workspace = true
# Decoder for `'imagepreview'` windows: the GUI shares the local filesystem (like
# the TUI), so it decodes the image itself and uploads it as a wgpu texture (see
# src/images.rs). No ratatui-image here — the GUI paints pixels directly.
image.workspace = true
# The workspace dep is `default-features = false`, so re-enable `native`
# explicitly — the gui's main.rs uses native-gated server items
# (default_runtime/default_shada/ClipboardProvider). Without this the crate only
# builds when nxvim-server is also a build target (e.g. `cargo test --workspace`),
# which silently turns its default `native` on via feature unification.
nxvim-server = { workspace = true, features = ["native"] }
arboard.workspace = true
# Native open/save dialog for the `:eo`/`:wn`/… pickers, on all three desktop
# platforms (no GTK — see the rfd note in the workspace Cargo.toml).
rfd.workspace = true

# Windows host only: embeds the app icon into nxvim-gui.exe (see build.rs). Gated
# on the *host* (build scripts run on the host) — our CI builds Windows natively,
# so host == target == windows. Cross-compiling Windows from another host skips
# the embed rather than failing.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
