<!DOCTYPE html>
<!--
  The nxvim web client — fully client-side, no server.

  The editor itself (nxvim-core, compiled to WebAssembly) runs in this page. This
  file is the renderer + input layer: it sends keystrokes to the wasm editor as vim
  key-notation, reads the editor's `View` back as JSON and paints it as HTML/CSS,
  and handles file open/save with the browser's File System Access API — the
  in-browser analogue of the GUI's :eo / :wo dialog commands. Tailwind (Play CDN)
  styles the chrome; the character grid is a small custom stylesheet.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>nxvim — in your browser</title>
<!-- Tailwind compiled to a static, local stylesheet at build time (build.sh) — no
     runtime CDN, so no third-party script to trust and it works offline. -->
<link rel="stylesheet" href="./tailwind.css" />
<style>
  :root {
    --bg: #1e2127; --fg: #abb2bf; --gutter: #4b5263; --gutter-cur: #e5c07b;
    --sel: #3e4451; --search: #e5c07b; --status-bg: #2c313a; --status-fg: #9da5b4;
    --cursor: #61afef; --eob: #4b5263; --accent: #e5c07b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #grid {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    white-space: pre; position: relative; color: var(--fg); background: var(--bg);
    overflow: hidden; outline: none;
  }
  #grid .row { position: absolute; left: 0; height: var(--ch); line-height: var(--ch); }
  .win { position: absolute; overflow: hidden; }
  .gutter { color: var(--gutter); }
  .gutter-cur { color: var(--gutter-cur); }
  .eob { color: var(--eob); }
  .sel { background: var(--sel); }
  .search { background: var(--search); color: #1e2127; }
  .incsearch { background: #ffd866; color: #1e2127; }
  .statusline { background: var(--status-bg); color: var(--status-fg); }
  .statusline.focused { color: #e6e6e6; }
  .sep { background: #181a1f; color: var(--gutter); position: absolute; }
  /* Cursor shapes. Block reverses the cell; bar/underline are thin overlays. */
  .cur-block { background: var(--cursor); color: var(--bg); }
  .cur-bar { box-shadow: inset 2px 0 0 0 var(--cursor); }
  .cur-underline { box-shadow: inset 0 -2px 0 0 var(--cursor); }
  .cur-hollow { box-shadow: inset 0 0 0 1px var(--cursor); }
  /* Multi-cursor: placed cursors are reverse-video; the active one is amber. */
  .seccur { background: #d7dae0; color: #1e2127; }
  .cur-mc { background: var(--accent); color: #1e2127; font-weight: 700; }
  .cmdline { position: absolute; left: 0; height: var(--ch); line-height: var(--ch); color: var(--fg); }
  .panel { position: absolute; left: 0; background: #21252b; }
  .panel-title { background: #2c313a; color: var(--accent); }
  .panel-cur { background: var(--sel); }
  /* Server-styled (palette) rendering: used only when a frame carries a resolved
     colorscheme palette + per-cell decorations. The serverless build never emits
     those, so this path is currently dormant; kept for a palette-bearing frame. */
  /* Diagnostic underline — wavy, keeps the cell's syntax foreground (like the TUI's
     Undercurl). The squiggle color rides on an inline text-decoration-color. */
  .diag-underline { text-decoration: underline wavy; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  /* Inlay hints: dim + italic by default (LspInlayHint fallback); a palette style,
     when present, overrides the color inline. Virtual cells, never selectable. */
  .inlay { color: #5c6370; font-style: italic; }
  /* Completion popup (pmenu) + its optional documentation box. */
  .pmenu { position: absolute; background: #21252b; border: 1px solid #3e4451; z-index: 10; white-space: pre; }
  .pmenu .row { position: static; height: var(--ch); line-height: var(--ch); }
  .pmenu-sel { background: var(--sel); color: #e6e6e6; }
  .pmenu-doc { position: absolute; background: #21252b; border: 1px solid #3e4451; z-index: 10; white-space: pre; color: var(--status-fg); }
  .pmenu-doc .row { position: static; height: var(--ch); line-height: var(--ch); }
</style>
</head>
<body class="bg-[#1e2127] text-[#abb2bf]">
  <!-- Toolbar: discoverable open/save (also reachable as :eo / :wo). -->
  <div class="flex items-center gap-2 px-3 py-1.5 bg-[#181a1f] border-b border-[#2c313a] text-sm select-none">
    <span class="font-semibold text-[#e5c07b]">nxvim</span>
    <span id="subtitle" class="text-[#5c6370]">· runs entirely in your browser (WebAssembly)</span>
    <div class="flex-1"></div>
    <button id="btn-open" class="px-2.5 py-1 rounded bg-[#2c313a] hover:bg-[#3e4451] text-[#abb2bf]">Open file <span class="text-[#5c6370]">:eo</span></button>
    <button id="btn-save" class="px-2.5 py-1 rounded bg-[#2c313a] hover:bg-[#3e4451] text-[#abb2bf]">Save <span class="text-[#5c6370]">:w</span></button>
    <button id="btn-saveas" class="px-2.5 py-1 rounded bg-[#2c313a] hover:bg-[#3e4451] text-[#abb2bf]">Save as <span class="text-[#5c6370]">:wo</span></button>
  </div>
  <div id="grid" tabindex="0"></div>
  <!-- Non-secure-context / unsupported-browser notice. -->
  <div id="notice" class="hidden fixed bottom-3 left-3 right-3 mx-auto max-w-xl px-3 py-2 rounded bg-[#3a2a2a] text-[#e6b3b3] text-sm"></div>

  <!-- Hidden file input: the fallback open path for browsers without the File
       System Access API (Firefox/Safari). Save there falls back to a download. -->
  <input id="file-input" type="file" class="hidden" />

  <script type="module">
    import init, { WebEditor } from "./pkg/nxvim_web.js";
    import { createHighlighter, colorFor } from "./highlight.js";

    const FONT_PX = 15, LINE = 1.4;
    const gridEl = document.getElementById("grid");
    const noticeEl = document.getElementById("notice");
    const fileInput = document.getElementById("file-input");

    let editor = null;     // the client-side serverless editor (WebEditor)
    let view = null;
    let ts = null; // tree-sitter highlighter (loaded lazily by language)
    let cw = 9, ch = 21;
    let cols = 80, editorRows = 24; // editorRows = grid rows minus the command row
    // File System Access handles, keyed by the buffer's file name, so :w writes
    // back to the file the user opened. Falls back to download when unsupported.
    const handles = new Map();
    const hasFSAccess = typeof window.showOpenFilePicker === "function";

    function measureCell() {
      const probe = document.createElement("span");
      probe.style.cssText = `position:absolute;visibility:hidden;font-family:${getComputedStyle(gridEl).fontFamily};font-size:${FONT_PX}px;`;
      probe.textContent = "M".repeat(100);
      gridEl.appendChild(probe);
      cw = probe.getBoundingClientRect().width / 100;
      probe.remove();
      ch = Math.round(FONT_PX * LINE);
      gridEl.style.fontSize = FONT_PX + "px";
      gridEl.style.setProperty("--ch", ch + "px");
    }

    function layout() {
      const rect = gridEl.getBoundingClientRect();
      cols = Math.max(20, Math.floor(rect.width / cw));
      const totalRows = Math.max(4, Math.floor(rect.height / ch));
      editorRows = totalRows - 1; // reserve the command row, like the TUI client
    }

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => (c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;"));
    }

    // ---- input ----
    // The vim key-notation + paste encoding live in Rust (nxvim-view, the shared
    // client input layer), reached via editor.key()/editor.paste(). This page's only
    // job — like winit/crossterm in the native clients — is mapping a browser event
    // to the modifier flags plus a neutral key NAME that nxvim-view understands.
    const NAMED = {
      Escape: "Esc", Enter: "CR", Backspace: "BS", Tab: "Tab", Delete: "Del",
      ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down",
      Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
    };
    function keyName(e) {
      if (NAMED[e.key]) return NAMED[e.key];
      // With a Ctrl/Alt modifier, read e.code so the *base* letter survives — on
      // macOS, Option+c composes "ç" in e.key, but e.code stays "KeyC".
      if (e.ctrlKey || e.altKey) {
        let m = /^Key([A-Z])$/.exec(e.code);
        if (m) return e.shiftKey ? m[1] : m[1].toLowerCase();
        m = /^Digit(\d)$/.exec(e.code);
        if (m) return m[1];
      }
      if ([...e.key].length === 1) return e.key;
      return null;
    }

    function feed(notationStr) { sendInput(notationStr); }
    function refresh() { flushClipboard(); view = JSON.parse(editor.view_json()); applyView(); }

    // ---- input shims ----
    // Each gesture mutates the in-page editor and re-renders synchronously: the wasm
    // core resolves mappings/motions itself, so there's no idle-flush round-trip.
    function sendInput(notation) { editor.input(notation); refresh(); }
    function sendKey(ctrl, alt, shift, name) { editor.key(ctrl, alt, shift, name); refresh(); }
    function sendPaste(text) { editor.paste(text); refresh(); }
    function sendMouse(button, action, modifier, row, col) {
      editor.mouse(button, action, modifier, row, col, Date.now());
      refresh();
    }
    function sendCommand(cmd) { editor.command(cmd); refresh(); }
    function sendResize(w, h) { editor.resize(w, h); refresh(); }

    // ---- clipboard register ("+ / "*) ----
    // The editor (nxvim-core) reads/writes the clipboard register synchronously
    // through a cache; this page ferries that cache to and from the browser's async
    // navigator.clipboard. flushClipboard runs after every input (inside the gesture
    // that produced it, so writeText is allowed): if the last keystroke yanked to
    // "+, push it to the system clipboard.
    function flushClipboard() {
      if (!editor) return;
      const text = editor.take_clipboard_write();
      if (text != null && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {}); // best-effort
      }
    }
    // Pull the system clipboard into the editor's cache so a later "+p pastes what
    // was copied elsewhere. readText is async (and gated on focus/permission), so we
    // prime it when a register sequence begins (the `"` key) — by the time `+p`
    // arrives a couple keystrokes later it has usually resolved. A rejection
    // (no permission, unfocused, Firefox/Safari) just leaves the last known value.
    async function refreshSystemClipboard() {
      if (!editor || !navigator.clipboard || !navigator.clipboard.readText) return;
      try { editor.set_clipboard_text(await navigator.clipboard.readText()); }
      catch (_) { /* unavailable — keep the cached value */ }
    }
    // The highlighter loads grammars asynchronously; when the runtime or a grammar
    // becomes ready it asks for a repaint. Coalesce those into one frame.
    let tsPending = false;
    function tsRefresh() {
      if (tsPending) return;
      tsPending = true;
      requestAnimationFrame(() => { tsPending = false; if (editor) refresh(); });
    }

    // Syntax-highlight context for this frame: the focused buffer's per-line capture
    // spans, plus the file it belongs to. Returns null when there's nothing to
    // highlight (runtime not ready, unsupported file, or grammar still loading — in
    // which case the highlighter has kicked off the load and will call tsRefresh
    // when it's ready). Other windows showing the SAME file reuse this.
    //
    // The editor's effective filetype (`:set filetype=…`, `vim.treesitter.start`,
    // or the core extension table) wins; only when it resolves nothing do we fall
    // back to mapping the file name's extension ourselves. That ordering is what
    // lets `:set ft=rust` highlight a `.txt` — or an unnamed scratch buffer.
    function highlightContext() {
      if (!ts || !ts.isReady()) return null;
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      if (!fw) return null;
      const lang =
        ts.langForFiletype(fw.filetype) || (fw.unnamed ? null : ts.langForName(fw.file_name));
      if (!lang) return null;
      const spans = ts.spansForBuffer(lang, editor.buffer_text());
      return spans ? { file: fw.file_name, spans } : null;
    }

    // ---- render the View as HTML ----
    // serverStyled: a frame carried a resolved colorscheme palette + per-cell
    // decorations (highlights/diagnostics/inlay hints). We'd paint those directly
    // instead of running the in-page tree-sitter highlighter. Keyed purely on the
    // palette's presence — the serverless core never emits one, so this stays false
    // and the in-page highlighter path is taken; the palette path is kept dormant
    // for a future frame source that projects one.
    let serverStyled = false;

    // ---- smooth scrolling ----
    // A scroll command that moved the focused window's viewport more than a line
    // arrives with a `scroll` band on that window (see scroll_to_json): the slide's
    // endpoints plus a self-contained strip of rows — anchored at base_line —
    // covering everything visible during the slide. We render that strip once and
    // translate it sub-pixel against the client clock, true smooth scrolling the
    // static cell grid can't express. The band row for buffer line `base_line + i`
    // sits at y = (base_line + i − topF)·ch, topF being the fractionally
    // interpolated first visible line; mirrors the native GUI/TUI animators.
    let scrollAnim = null; // in-flight slide, or null
    let scrollRAF = 0;
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

    // Apply a freshly produced `view`: (re)arm or cancel the scroll slide, then
    // paint. Mirrors the native clients' arm_animation — a fresh gesture (re)arms;
    // a scroll-less view that merely repaints the in-flight slide's *destination* (a
    // delayed highlight reply) is left to play out rather than snapping; any other
    // scroll-less view is a real change that cancels the slide and paints statically.
    function applyView() {
      const w = focusedWindow();
      const s = w?.scroll;
      if (s && s.duration_ms > 0) { armScroll(w, s); return; }
      if (scrollAnim && repaintsDestination(w)) return; // let the slide finish
      cancelScroll();
      render();
    }

    // Whether `w` just repaints the destination the in-flight slide is heading to
    // (same first visible line and cursor line) — so a delayed repaint mustn't abort
    // it. `numbers[0]`/`cursor_line` are 1-based; the endpoints are 0-based.
    function repaintsDestination(w) {
      if (!w || !scrollAnim) return false;
      const a = scrollAnim;
      return w.numbers?.[0] === Math.round(a.to_top) + 1
        && w.cursor_line === Math.round(a.to_cursor) + 1;
    }

    function armScroll(w, s) {
      cancelScroll();
      scrollAnim = {
        from_top: s.from_top, to_top: s.to_top,
        from_cursor: s.from_cursor, to_cursor: s.to_cursor,
        duration: s.duration_ms, base_line: s.base_line,
        band: bandWindow(w, s), start: performance.now(), strip: null,
      };
      render(); // paints chrome + other windows + the focused band strip (sets .strip)
      scrollRAF = requestAnimationFrame(stepScroll);
    }

    // Linear progress 0→1 of slide `a` at clock `now`, clamped at BOTH ends. The
    // lower clamp matters: a rAF timestamp can predate `a.start` by a frame, and an
    // unclamped negative `t` eases to a negative offset — a one-frame upward flash
    // before the slide proper begins (mirrors the native animators' `clamp(0,1)`).
    function scrollProgress(a, now) {
      return Math.min(1, Math.max(0, (now - a.start) / a.duration));
    }

    // Drive one animation frame: just translate the pre-built strip (cheap, GPU
    // composited), no DOM rebuild. On completion, settle to the static destination.
    function stepScroll(now) {
      const a = scrollAnim;
      if (!a) return;
      const t = scrollProgress(a, now);
      if (a.strip) a.strip.style.transform = `translate3d(0, ${stripOffset(a, easeOutCubic(t))}px, 0)`;
      if (t < 1) { scrollRAF = requestAnimationFrame(stepScroll); return; }
      scrollAnim = null;
      scrollRAF = 0;
      render();
    }

    // Pixel y of band row 0 (buffer line base_line) within the window text area for
    // eased progress `e`: the fractional top line slides from_top→to_top, and
    // base_line ≤ both endpoints, so the offset is ≤ 0 (strip shifted up).
    function stripOffset(a, e) {
      const topF = a.from_top + (a.to_top - a.from_top) * e;
      return (a.base_line - topF) * ch;
    }

    // A synthetic window whose per-row arrays are the scroll band's, so the existing
    // row renderers paint the band rows unchanged. The band carries text, numbers,
    // selection (and server highlights); overlays it doesn't carry — search,
    // secondary cursors, diagnostics, inlay hints — are blanked for the brief slide.
    // The cursor is pinned to its destination buffer line so its cell rides the strip
    // to exactly where it settles.
    function bandWindow(w, s) {
      const n = s.lines.length;
      const blanks = Array.from({ length: n }, () => []);
      return Object.assign({}, w, {
        lines: s.lines,
        numbers: s.numbers,
        selection: s.selection,
        search: blanks,
        incsearch: Array.from({ length: n }, () => null),
        secondary_selection: blanks,
        secondary_cursors: [],
        highlights: s.highlights || [],
        diagnostics: [], diagnostics_virt: [], diagnostics_signs: [], inlay_hints: [],
        cursor_row: Math.round(s.to_cursor) - s.base_line,
      });
    }

    function cancelScroll() {
      if (scrollRAF) cancelAnimationFrame(scrollRAF);
      scrollRAF = 0;
      scrollAnim = null;
    }

    // The focused window's animated body: the band rendered once into an absolutely
    // positioned strip the rAF loop translates. Built with the same row renderers as
    // a static window, so syntax/selection/gutter match exactly; the strip lives
    // inside the window box (overflow:hidden), which clips it to the viewport.
    function renderScrollBand(box, w, rect, winSpans) {
      const a = scrollAnim;
      const band = a.band;
      const gutterW = w.number_width || 0;
      const strip = document.createElement("div");
      strip.className = "scroll-band";
      strip.style.cssText = `position:absolute;left:0;top:0;width:${rect.width * cw}px;will-change:transform;`;
      for (let i = 0; i < band.lines.length; i++) {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.style.top = i * ch + "px";
        rowEl.style.width = rect.width * cw + "px";
        if (serverStyled) {
          rowEl.innerHTML = renderLineServer(band, i, gutterW, rect);
        } else {
          const bufLine = band.numbers[i];
          const lineSpans = winSpans && bufLine != null ? winSpans[bufLine - 1] : null;
          rowEl.innerHTML = renderLine(band, i, gutterW, lineSpans);
        }
        strip.appendChild(rowEl);
      }
      const t = scrollProgress(a, performance.now());
      strip.style.transform = `translate3d(0, ${stripOffset(a, easeOutCubic(t))}px, 0)`;
      box.appendChild(strip);
      a.strip = strip;
    }

    function render() {
      if (!view) return;
      serverStyled = (view.styles?.length ?? 0) > 0;
      gridEl.innerHTML = "";
      if (serverStyled) applyChrome();
      const hasTabline = serverStyled
        ? (view.tabline_segments?.length || view.tabline.length)
        : view.tabline.length;
      const tablineRows = hasTabline ? 1 : 0;
      const cmdRow = editorRows; // command line sits just past the editor area
      // The in-page highlighter only feeds the local paint path.
      const hl = serverStyled ? null : highlightContext();

      if (tablineRows) {
        if (serverStyled && view.tabline_segments?.length) renderTablineSegments(0);
        else renderTabline(0);
      }
      for (const w of view.windows) if (!w.floating) renderWindow(w, tablineRows, hl);
      renderSeparators(tablineRows);
      for (const w of view.windows) if (w.floating) renderFloat(w, tablineRows, hl);
      if (serverStyled && view.global_status?.length) renderGlobalStatus(cmdRow - 1);
      if (view.panel) renderPanel(view.panel, cmdRow);
      if (serverStyled && view.pmenu) renderPmenu(view.pmenu, tablineRows);
      renderCommand(cmdRow);
    }

    // The window's rect, synthesizing the whole windows area for a null rect (the
    // legacy flat redraw / a single full-area window). Local frames always have one.
    function winRect(w) {
      return w.rect || { x: 0, y: 0, width: cols, height: editorRows };
    }

    function place(el, x, y, wCells, hCells) {
      el.style.left = x * cw + "px";
      el.style.top = y * ch + "px";
      if (wCells != null) el.style.width = wCells * cw + "px";
      if (hCells != null) el.style.height = hCells * ch + "px";
    }

    function renderWindow(w, tablineRows, hl) {
      const rect = winRect(w);
      const box = document.createElement("div");
      box.className = "win";
      place(box, rect.x, tablineRows + rect.y, rect.width, rect.height);
      gridEl.appendChild(box);

      const textRows = w.lines.length;
      const statusRows = Math.max(0, rect.height - textRows);
      const gutterW = w.number_width || 0;
      // This window shares the highlighted buffer iff it shows the same file (local only).
      const winSpans = hl && w.file_name === hl.file ? hl.spans : null;

      // The focused window animates a scroll slide: paint the band strip the rAF
      // loop translates instead of the static rows (status line still painted below).
      if (scrollAnim && w.focused) {
        renderScrollBand(box, w, rect, winSpans);
      } else {
        for (let r = 0; r < textRows; r++) {
          const rowEl = document.createElement("div");
          rowEl.className = "row";
          rowEl.style.top = r * ch + "px";
          rowEl.style.width = rect.width * cw + "px";
          if (serverStyled) {
            rowEl.innerHTML = renderLineServer(w, r, gutterW, rect);
          } else {
            // numbers[r] is the 1-based buffer line; spans are indexed 0-based.
            const bufLine = w.numbers[r];
            const lineSpans = winSpans && bufLine != null ? winSpans[bufLine - 1] : null;
            rowEl.innerHTML = renderLine(w, r, gutterW, lineSpans);
          }
          box.appendChild(rowEl);
        }
      }
      // The server projects its own status segments (per 'laststatus'); a window with
      // status_visible===false gave its bottom row to text, so paint none. Local mode
      // synthesizes a status line from the window fields.
      if (serverStyled) {
        if (statusRows > 0 && w.status_visible !== false) {
          renderStatusSegments(box, w.status || [], textRows, rect.width, w.focused);
        }
      } else if (statusRows > 0) {
        renderStatus(box, w, textRows);
      }
    }

    // One text row: gutter + content spans. Cells are built from the ORIGINAL line
    // (tabs expanded inline) so each carries the syntax color at its position; the
    // selection / search / cursor classes are layered on top, then equal-style cells
    // are coalesced into runs.
    function renderLine(w, row, gutterW, lineSpans) {
      const line = w.lines[row] ?? "";
      const isFiller = w.numbers[row] === null;
      let html = "";
      if (gutterW > 0) html += renderGutterCell(w, row, gutterW);
      if (isFiller) return html + `<span class="eob">${escapeHtml(line)}</span>`;

      const tabstop = w.tabstop || 8;
      // Per-UTF-16-column syntax colors for this line (or null). Indices match JS
      // string positions, which is what tree-sitter reports.
      const colors = lineSpans && ts ? ts.colorsForLine(lineSpans, line.length) : null;
      // Expand to display cells: one per code point, tabs → spaces (no color).
      const cells = [];
      let u16 = 0, col = 0;
      for (const cp of line) {
        if (cp === "\t") {
          const n = tabstop - (col % tabstop);
          for (let k = 0; k < n; k++) cells.push({ ch: " ", color: null });
          col += n;
        } else {
          cells.push({ ch: cp, color: colors ? colors[u16] : null });
          col += 1;
        }
        u16 += cp.length;
      }

      const leftcol = w.leftcol || 0;
      const isFocused = w.focused && !view.command_mode && !view.panel;
      const cursorCol = w.cursor_screen_col;
      const cursorRow = w.cursor_row;
      const sel = w.selection[row] || null;
      const search = w.search[row] || [];
      const inc = w.incsearch[row] || null;
      const secSel = w.secondary_selection[row] || [];
      // Secondary multi-cursor positions on this row (screen columns).
      const secCols = new Set((w.secondary_cursors || []).filter(([r]) => r === row).map(([, c]) => c));
      const inSpan = (sp, c) => c >= sp[0] && c < sp[1];
      // These classes set their own foreground (reverse-video cursor, match
      // contrast); don't let the inline syntax color override it on those cells.
      const COLOR_OWNED = new Set(["cur-block", "cur-mc", "seccur", "search", "incsearch"]);

      let run = "", runCls = "", runColor = "", out = "";
      const flush = () => {
        if (!run) return;
        const style = runColor ? ` style="color:${runColor}"` : "";
        out += `<span class="${runCls}"${style}>${escapeHtml(run)}</span>`;
        run = "";
      };
      for (let c = 0; c < cells.length; c++) {
        if (c < leftcol) continue;
        let cls = "";
        if (search.some((s) => inSpan(s, c))) cls = "search";
        if (inc && inSpan(inc, c)) cls = "incsearch";
        if ((sel && inSpan(sel, c)) || secSel.some((s) => inSpan(s, c))) cls = "sel";
        // Placed multi-cursors, then the primary cursor cell (which wins).
        if (secCols.has(c)) cls = "seccur";
        if (isFocused && row === cursorRow && c === cursorCol) cls = cursorClass();
        else if (!w.focused && row === cursorRow && c === cursorCol && !view.command_mode && !view.panel) cls = "cur-hollow";
        const color = COLOR_OWNED.has(cls) ? "" : (cells[c].color || "");
        if (cls !== runCls || color !== runColor) { flush(); runCls = cls; runColor = color; }
        run += cells[c].ch;
      }
      flush();
      // Cursor past end of line (e.g. empty line, or append): draw a cell.
      if (isFocused && row === cursorRow && cursorCol >= cells.length) {
        out += `<span class="${cursorClass()}"> </span>`;
      } else if (!w.focused && row === cursorRow && cursorCol >= cells.length && !view.command_mode && !view.panel) {
        out += `<span class="cur-hollow"> </span>`;
      }
      return html + out;
    }

    function cursorClass() {
      if (view.mode === "MULTICURSOR") return "cur-mc"; // active cursor in placement mode
      if (view.mode === "INSERT") return "cur-bar";
      if (view.mode === "REPLACE" || view.pending_replace) return "cur-underline";
      return "cur-block";
    }

    // ---- server-styled (remote) paint helpers ----
    // A resolved palette Style → an inline CSS string the renderer drops on a span.
    // Colors already arrive as `#rrggbb` strings (or null) from the wire.
    function styleToCss(s) {
      if (!s) return "";
      let fg = s.fg, bg = s.bg;
      if (s.reverse) { const t = fg; fg = bg || "var(--bg)"; bg = t || "var(--fg)"; }
      let css = "";
      if (fg) css += `color:${fg};`;
      if (bg) css += `background:${bg};`;
      if (s.bold) css += "font-weight:700;";
      if (s.italic) css += "font-style:italic;";
      if (s.strikethrough) css += "text-decoration:line-through;";
      else if (s.underline) css += "text-decoration:underline;";
      else if (s.undercurl) css += `text-decoration:underline wavy;${s.sp ? `text-decoration-color:${s.sp};` : ""}`;
      return css;
    }
    function paletteStyle(id) { return id == null ? null : (view.styles[id] || null); }
    // A chrome region Style → inline CSS (background/foreground), or "" when unstyled.
    function chromeCss(style) { return style ? styleToCss(style) : ""; }

    // Push the server's colorscheme into the CSS vars the existing chrome classes
    // (.gutter, .eob, .sel, .search, .statusline) already key on, plus #grid's own
    // bg/fg. Every region is nullable: a null leaves today's default in place.
    function applyChrome() {
      const c = view.chrome || {};
      const root = document.documentElement.style;
      if (c.normal?.bg) gridEl.style.background = c.normal.bg;
      if (c.normal?.fg) gridEl.style.color = c.normal.fg;
      const setVar = (name, color) => { if (color) root.setProperty(name, color); };
      setVar("--eob", c.end_of_buffer?.fg);
      setVar("--gutter", c.line_nr?.fg);
      setVar("--gutter-cur", c.cursor_line_nr?.fg);
      setVar("--status-bg", c.status_line?.bg);
      setVar("--status-fg", c.status_line?.fg);
      setVar("--sel", c.visual?.bg);
      setVar("--search", c.search?.bg);
    }

    // The base foreground (+ diagnostic underline) for one screen cell, from the
    // server's per-row highlight / diagnostic spans (both keyed on absolute screen
    // column). A span with a resolved `style_id` uses the palette; otherwise the
    // group falls back to the local theme (colorFor), so an un-themed group still
    // colors. The diagnostic squiggle is layered as inline text-decoration so it
    // survives whatever fg/bg the cell already carries.
    function cellBaseCss(col, hlSpans, diagSpans) {
      let css = "";
      for (const [s, e, group, id] of hlSpans) {
        if (col >= s && col < e) {
          if (id != null) css = styleToCss(paletteStyle(id));
          else { const fg = colorFor(group); if (fg) css = `color:${fg};`; }
          break;
        }
      }
      for (const [s, e, sev, id] of diagSpans) {
        if (col >= s && col < e) {
          const sp = (id != null && paletteStyle(id)?.sp) || severityColor(sev);
          css += `text-decoration:underline wavy;text-decoration-color:${sp};text-underline-offset:2px;`;
          break;
        }
      }
      return css;
    }
    // Diagnostic severity → squiggle/virt color when no palette style resolved.
    // 1=Error 2=Warn 3=Info 4=Hint (the LSP DiagnosticSeverity order the server uses).
    function severityColor(sev) {
      return sev === 1 ? "#e06c75" : sev === 2 ? "#e5c07b" : sev === 4 ? "#56b6c2" : "#61afef";
    }

    // One text row, server-styled. Mirrors the TUI's highlight_line: expand tabs to
    // screen cells, key every decoration on the ABSOLUTE screen column, splice each
    // inlay hint in before the glyph at its anchor column (pushing later glyphs
    // right), and move only the cursor by that splice. The base foreground is the
    // server's palette; selection / search / incsearch / cursor are layered as
    // classes, exactly like the local renderer.
    function renderLineServer(w, row, gutterW, rect) {
      const line = w.lines[row] ?? "";
      const isFiller = w.numbers[row] === null;
      let html = (gutterW > 0 || w.sign_column) ? renderGutterCell(w, row, gutterW) : "";
      if (isFiller) {
        const css = chromeCss(view.chrome?.end_of_buffer);
        return html + `<span class="eob"${css ? ` style="${css}"` : ""}>${escapeHtml(line)}</span>`;
      }

      const tabstop = w.tabstop || 8;
      const leftcol = w.leftcol || 0;
      const hints = w.inlay_hints?.[row] || [];   // [[hcol, text, id], …] sorted by col
      const hlSpans = w.highlights?.[row] || [];
      const diagSpans = w.diagnostics?.[row] || [];
      const sel = w.selection?.[row] || null;
      const secSel = w.secondary_selection?.[row] || [];
      const search = w.search?.[row] || [];
      const inc = w.incsearch?.[row] || null;
      const secCols = new Set((w.secondary_cursors || []).filter(([r]) => r === row).map(([, c]) => c));
      const inSpan = (sp, c) => c >= sp[0] && c < sp[1];

      // Expand tabs → screen cells (one char per screen column; width-1 per code
      // point, matching the local renderer — wide-char alignment is a known v1 gap).
      const expanded = [];
      let c0 = 0;
      for (const cp of line) {
        if (cp === "\t") { const n = tabstop - (c0 % tabstop); for (let k = 0; k < n; k++) expanded.push(" "); c0 += n; }
        else { expanded.push(cp); c0 += 1; }
      }

      // Build the painted-cell list: real glyphs (carrying their absolute column for
      // overlay lookup) with inlay-hint cells (abs = -1) spliced in at their anchor.
      const cells = [];
      let hi = 0;
      const emitHints = (anchor) => {
        while (hi < hints.length && hints[hi][0] <= anchor) {
          const [hcol, text, id] = hints[hi++];
          if (hcol < leftcol) continue; // scrolled off the left edge
          const css = id != null ? styleToCss(paletteStyle(id)) : "";
          for (const cp of text) cells.push({ ch: cp, abs: -1, base: css });
        }
      };
      for (let c = 0; c < expanded.length; c++) {
        emitHints(c); // hints anchored at/before this glyph go in first
        if (c >= leftcol) cells.push({ ch: expanded[c], abs: c, base: cellBaseCss(c, hlSpans, diagSpans) });
      }
      emitHints(Infinity); // trailing hints anchored at/past end-of-text

      const isFocused = w.focused && !view.command_mode && !view.panel;
      const cursorRow = w.cursor_row;
      // The cursor's painted column = its screen column shifted by the width of every
      // inlay hint spliced at or before it (leftcol ≤ hcol ≤ cursor col; a hint AT the
      // cursor col is inserted before the cursor glyph, so it counts). Mirrors the
      // TUI's inlay_cursor_shift.
      let inlayShift = 0;
      for (const [hcol, text] of hints) {
        if (hcol >= leftcol && hcol <= w.cursor_screen_col) inlayShift += [...text].length;
      }
      const cursorPainted = w.cursor_screen_col + inlayShift;

      // Overlay classes set their own foreground; don't let the palette fg override.
      const COLOR_OWNED = new Set(["cur-block", "cur-bar", "cur-underline", "cur-mc", "seccur", "search", "incsearch"]);
      let run = "", runCls = "", runStyle = "", out = "";
      const flush = () => {
        if (!run) return;
        out += `<span class="${runCls}"${runStyle ? ` style="${runStyle}"` : ""}>${escapeHtml(run)}</span>`;
        run = "";
      };
      let painted = leftcol; // absolute painted screen column of the next cell
      for (const cell of cells) {
        const a = cell.abs;
        let cls = "";
        if (a >= 0) {
          if (search.some((s) => inSpan(s, a))) cls = "search";
          if (inc && inSpan(inc, a)) cls = "incsearch";
          if ((sel && inSpan(sel, a)) || secSel.some((s) => inSpan(s, a))) cls = "sel";
          if (secCols.has(a)) cls = "seccur";
        } else {
          cls = "inlay"; // dim default; an inline palette style (cell.base) overrides
        }
        if (isFocused && cursorRow === row && painted === cursorPainted) cls = cursorClass();
        else if (!w.focused && cursorRow === row && painted === cursorPainted && !view.command_mode && !view.panel) cls = "cur-hollow";
        const style = (a < 0) ? cell.base : (COLOR_OWNED.has(cls) ? "" : cell.base);
        if (cls !== runCls || style !== runStyle) { flush(); runCls = cls; runStyle = style; }
        run += cell.ch;
        painted += 1;
      }
      flush();
      // Cursor past the painted text (empty line / append): draw a trailing cell.
      if (isFocused && cursorRow === row && cursorPainted >= painted) {
        out += `<span class="${cursorClass()}"> </span>`;
      } else if (!w.focused && cursorRow === row && cursorPainted >= painted && !view.command_mode && !view.panel) {
        out += `<span class="cur-hollow"> </span>`;
      }
      // Inline diagnostic virtual text after the line's end.
      const virt = w.diagnostics_virt?.[row];
      if (virt) {
        const [text, sev, id] = virt;
        const vcss = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
        out += `<span${vcss ? ` style="${vcss}"` : ""}> ${escapeHtml(text)}</span>`;
      }
      return html + out;
    }

    // Number gutter (mirrors the TUI's gutter_cell: absolute / relative / hybrid),
    // preceded — server-styled only — by a 2-cell diagnostic sign column when the
    // window reserves one (vim's signcolumn=auto once a buffer has a diagnostic).
    function renderGutterCell(w, row, width) {
      let html = "";
      if (serverStyled && w.sign_column) {
        const sign = w.diagnostics_signs?.[row]; // [glyph, severity, style_id] | null
        if (sign) {
          const [glyph, sev, id] = sign;
          const css = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
          html += `<span${css ? ` style="${css}"` : ""}>${escapeHtml((glyph + " ").slice(0, 2).padEnd(2))}</span>`;
        } else {
          html += `<span class="gutter">  </span>`;
        }
      }
      if (width <= 0) return html;
      const n = w.numbers[row];
      const cur = w.cursor_line;
      let cell, cls = "gutter";
      if (n === null || n === undefined) cell = " ".repeat(width);
      else if (w.number && w.relativenumber && n === cur) { cell = String(n).padEnd(width); cls = "gutter-cur"; }
      else {
        let v;
        if (!w.relativenumber) v = n;
        else if (n === cur) v = 0;
        else v = Math.abs(n - cur);
        cell = String(v).padStart(width - 1) + " ";
        if (n === cur) cls = "gutter-cur";
      }
      return html + `<span class="${cls}">${escapeHtml(cell)}</span>`;
    }

    // Paint a server status/tabline line from its rendered segments (`text` + a
    // resolved palette `style`, or null for the base look). The bar's own
    // background comes from the `.statusline` class (chrome-driven CSS var); each
    // segment overlays its style. An empty segment list falls back to a bare bar.
    function renderSegmentBar(segments, width, cls) {
      let html = "";
      for (const { text, style } of (segments || [])) {
        const css = styleToCss(style);
        html += `<span${css ? ` style="${css}"` : ""}>${escapeHtml(text)}</span>`;
      }
      const el = document.createElement("div");
      el.className = cls;
      el.style.width = width * cw + "px";
      el.innerHTML = html;
      return el;
    }
    function renderStatusSegments(box, segments, atRow, width, focused) {
      const el = renderSegmentBar(segments, width, "row statusline" + (focused ? " focused" : ""));
      el.style.top = atRow * ch + "px";
      box.appendChild(el);
    }
    // The global status line (laststatus=3): one full-width bar above the command row.
    function renderGlobalStatus(atRow) {
      const el = renderSegmentBar(view.global_status, cols, "row statusline focused");
      el.style.top = atRow * ch + "px";
      gridEl.appendChild(el);
    }
    function renderTablineSegments(y) {
      const el = renderSegmentBar(view.tabline_segments, cols, "row statusline");
      el.style.top = y * ch + "px";
      gridEl.appendChild(el);
    }

    // The completion popup (pmenu), positioned over the focused window's text in
    // screen cells. Mirrors the TUI's pmenu: a list of `[label, kind, detail]`
    // items, the selected row reverse-highlighted, scrolled to keep it in view.
    function renderPmenu(pmenu, tablineRows) {
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      const rect = fw ? winRect(fw) : { x: 0, y: 0 };
      const x = rect.x + pmenu.col;
      const y = tablineRows + rect.y + pmenu.row;
      const rows = Math.max(1, Math.min(pmenu.height, pmenu.items.length));
      const first = Math.max(0, Math.min(pmenu.selected - rows + 1, pmenu.items.length - rows));
      const start = pmenu.selected >= rows ? first : 0;
      const box = document.createElement("div");
      box.className = "pmenu";
      place(box, x, y, pmenu.width, rows);
      for (let i = 0; i < rows; i++) {
        const idx = start + i;
        const [label, , detail] = pmenu.items[idx] || ["", 0, ""];
        const left = String(label);
        const right = detail ? String(detail) : "";
        const pad = Math.max(1, pmenu.width - left.length - right.length);
        const text = (left + " ".repeat(pad) + right).slice(0, pmenu.width).padEnd(pmenu.width);
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (idx === pmenu.selected ? " pmenu-sel" : "");
        rowEl.style.width = pmenu.width * cw + "px";
        rowEl.textContent = text;
        box.appendChild(rowEl);
      }
      gridEl.appendChild(box);
      // Optional documentation box, drawn to the right of the popup.
      if (pmenu.doc && pmenu.doc.length) {
        const docW = Math.max(...pmenu.doc.map((l) => l.length), 1);
        const docBox = document.createElement("div");
        docBox.className = "pmenu-doc";
        place(docBox, x + pmenu.width, y, docW, pmenu.doc.length);
        for (const l of pmenu.doc) {
          const rowEl = document.createElement("div");
          rowEl.className = "row";
          rowEl.style.width = docW * cw + "px";
          rowEl.textContent = l;
          docBox.appendChild(rowEl);
        }
        gridEl.appendChild(docBox);
      }
    }

    // A synthesized status line (the core build has no %-format engine / Lua):
    // MODE  filename [+]            line,col
    function renderStatus(box, w, atRow) {
      const name = w.unnamed ? "[No Name]" : (w.file_name || "[No Name]");
      const mod = w.modified ? " [+]" : "";
      const left = `${name}${mod}`;
      const right = `${w.cursor_line},${w.cursor_col + 1}`;
      const width = winRect(w).width;
      const pad = Math.max(1, width - left.length - right.length - 1);
      const text = (" " + left + " ".repeat(pad) + right + " ").slice(0, width).padEnd(width);
      const el = document.createElement("div");
      el.className = "row statusline" + (w.focused ? " focused" : "");
      el.style.top = atRow * ch + "px";
      el.style.width = width * cw + "px";
      el.textContent = text;
      box.appendChild(el);
    }

    function renderSeparators(tablineRows) {
      for (const s of view.separators) {
        const el = document.createElement("div");
        el.className = "sep";
        if (s.vertical) {
          place(el, s.x, tablineRows + s.y, 1, s.length);
          el.textContent = Array(s.length).fill("│").join("\n");
          el.style.lineHeight = ch + "px";
        } else {
          place(el, s.x, tablineRows + s.y, s.length, 1);
          el.textContent = "─".repeat(s.length);
          el.style.lineHeight = ch + "px";
        }
        gridEl.appendChild(el);
      }
    }

    function renderFloat(w, tablineRows, hl) {
      // Floats need no server; without Lua they're rare, but render a bordered box.
      renderWindow(w, tablineRows, hl);
    }

    function renderTabline(y) {
      const el = document.createElement("div");
      el.className = "row statusline";
      el.style.top = y * ch + "px";
      el.style.width = cols * cw + "px";
      let s = "";
      view.tabline.forEach((t, i) => {
        const count = t.window_count > 1 ? t.window_count + " " : "";
        const mark = i === view.current_tab ? "▸" : " ";
        s += ` ${mark}${count}${t.label}${t.modified ? "+" : ""} `;
      });
      el.textContent = s;
      gridEl.appendChild(el);
    }

    function renderPanel(panel, cmdRow) {
      const borderRow = cmdRow - (panel.height + 1);
      const titleEl = document.createElement("div");
      titleEl.className = "row panel-title";
      titleEl.style.top = borderRow * ch + "px";
      titleEl.style.width = cols * cw + "px";
      titleEl.textContent = `─ ${panel.title} ` + "─".repeat(Math.max(0, cols - panel.title.length - 6)) + "[X]─";
      gridEl.appendChild(titleEl);
      const curEnd = panel.cursor_row + Math.max(1, panel.cursor_span);
      for (let r = 0; r < panel.height; r++) {
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (r >= panel.cursor_row && r < curEnd ? " panel-cur" : "");
        rowEl.style.top = (borderRow + 1 + r) * ch + "px";
        rowEl.style.width = cols * cw + "px";
        rowEl.textContent = panel.lines[r] ?? "";
        gridEl.appendChild(rowEl);
      }
    }

    function renderCommand(cmdRow) {
      const el = document.createElement("div");
      el.className = "cmdline";
      el.style.top = cmdRow * ch + "px";
      el.style.width = cols * cw + "px";
      if (view.command_mode) {
        const prompt = view.cmdline_prompt || view.cmdline_prefix;
        const text = prompt + view.cmdline;
        const curIdx = [...prompt].length + view.cmdline_cursor;
        const chars = [...text];
        let html = "";
        for (let i = 0; i < chars.length; i++) {
          html += i === curIdx ? `<span class="cur-block">${escapeHtml(chars[i])}</span>` : escapeHtml(chars[i]);
        }
        if (curIdx >= chars.length) html += `<span class="cur-block"> </span>`;
        el.innerHTML = html;
      } else {
        el.textContent = view.message || "";
      }
      gridEl.appendChild(el);
    }

    // ---- file open / save (the :eo / :wo family, via File System Access) ----
    function focusedWindow() { return (view.windows || []).find((w) => w.focused) || view.windows?.[0]; }

    async function openFile(splitVerb) {
      try {
        let name, contents, handle = null;
        if (hasFSAccess) {
          [handle] = await window.showOpenFilePicker();
          const file = await handle.getFile();
          name = file.name; contents = await file.text();
        } else {
          const picked = await pickViaInput();
          if (!picked) return;
          name = picked.name; contents = picked.text;
        }
        // Abort any half-typed command line, optionally split, then load.
        editor.input("<Esc>");
        if (splitVerb) editor.command(splitVerb);
        editor.load_file(name, contents);
        if (handle) handles.set(name, handle);
        refresh();
        gridEl.focus();
      } catch (err) {
        if (err && err.name !== "AbortError") notify("Open failed: " + err.message);
      }
    }

    async function saveFile(forceDialog) {
      const w = focusedWindow();
      const name = w && !w.unnamed ? w.file_name : "";
      const baseName = name ? name.split("/").pop() : "untitled.txt";
      const text = editor.buffer_text();
      try {
        if (hasFSAccess) {
          let handle = name ? handles.get(name) : null;
          if (!handle || forceDialog) {
            handle = await window.showSaveFilePicker({ suggestedName: baseName });
          }
          const writable = await handle.createWritable();
          await writable.write(text);
          await writable.close();
          const savedName = handle.name || baseName;
          handles.set(savedName, handle);
          editor.input("<Esc>");
          editor.mark_saved(savedName);
        } else {
          // Fallback: download the file (no write-back handle available).
          downloadText(baseName, text);
          editor.input("<Esc>");
          editor.mark_saved(baseName);
        }
        refresh();
        gridEl.focus();
      } catch (err) {
        if (err && err.name !== "AbortError") notify("Save failed: " + err.message);
      }
    }

    function pickViaInput() {
      return new Promise((resolve) => {
        fileInput.value = "";
        fileInput.onchange = async () => {
          const f = fileInput.files[0];
          if (!f) return resolve(null);
          resolve({ name: f.name, text: await f.text() });
        };
        fileInput.click();
      });
    }
    function downloadText(name, text) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      a.download = name; a.click();
      URL.revokeObjectURL(a.href);
    }
    function notify(msg) { noticeEl.textContent = msg; noticeEl.classList.remove("hidden"); setTimeout(() => noticeEl.classList.add("hidden"), 4000); }

    // The :eo / :wo command family — intercept <CR> in command mode (mirrors the
    // GUI's open_dialog_verb / save_dialog_needed), routing to the pickers.
    function maybeHandleCommand() {
      if (!view.command_mode || view.cmdline_prefix !== ":") return false;
      const cmd = view.cmdline.trim();
      const openVerb = { e: null, ed: null, edi: null, edit: null, eo: null, spo: "split", vso: "vsplit", no: "new", vno: "vnew" };
      if (cmd in openVerb) { openFile(openVerb[cmd]); return true; }
      const w = focusedWindow();
      if (cmd === "wo") { saveFile(true); return true; }
      if (cmd === "w" || cmd === "write") { saveFile(false); return true; }
      if (cmd === "x" || cmd === "wq") { saveFile(false); return true; } // no tab to close
      return false;
    }

    // ---- event wiring ----
    gridEl.addEventListener("keydown", (e) => {
      if (e.key === "F5" || e.key === "F12") return;
      if ((e.metaKey || e.ctrlKey) && (e.key === "v" || e.key === "V")) return; // paste event
      // Cmd/Ctrl+C with an active visual selection copies it to the system clipboard,
      // GUI-style: yank to "+, which the post-keystroke flush pushes to
      // navigator.clipboard.
      if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === "c" || e.key === "C") &&
          view && (view.mode === "VISUAL" || view.mode === "V-LINE")) {
        e.preventDefault();
        editor.input('"+y'); // yank the selection to the clipboard register
        refresh();
        return;
      }
      if (e.metaKey && !e.ctrlKey) return; // leave browser Cmd-shortcuts alone
      // Intercept Enter on a file command before it reaches the editor: the in-page
      // editor owns the (File System Access) filesystem, so :e/:w run here.
      if (e.key === "Enter" && view && maybeHandleCommand()) { e.preventDefault(); return; }
      const name = keyName(e);
      if (name === null) return;
      e.preventDefault();
      // Starting a register sequence (`"`) — prime the system clipboard so an
      // imminent "+p sees what was copied in another app (readText is async).
      if (name === '"') refreshSystemClipboard();
      sendKey(e.ctrlKey, e.altKey, e.shiftKey, name); // shared nxvim-view encoder
    });
    gridEl.addEventListener("paste", (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (text) sendPaste(text); // shared nxvim-view encoder
    });

    // Mouse. The editor (nxvim-core) owns the hit-test from a global screen cell back
    // to a window + buffer position, multi-click word/line selection, drag-select,
    // wheel scroll, and — in multi-cursor placement mode — toggling a cursor at the
    // click. So the page only forwards the raw cell, exactly as the TUI/GUI forward
    // nvim_input_mouse.
    const BTN = { 0: "left", 1: "middle", 2: "right" };
    let dragBtn = null;
    function cellAt(e) {
      const r = gridEl.getBoundingClientRect();
      return {
        col: Math.max(0, Math.floor((e.clientX - r.left) / cw)),
        row: Math.max(0, Math.floor((e.clientY - r.top) / ch)),
      };
    }
    function mods(e) { return (e.ctrlKey ? "C" : "") + (e.shiftKey ? "S" : "") + (e.altKey ? "A" : ""); }

    // Drag-select autoscroll. The editor scrolls one line per drag event it gets at
    // a window edge, so — like the TUI/GUI clients — while a left-drag is held in the
    // screen's top/bottom band we re-send the drag on a timer to keep scrolling (a
    // browser fires no mousemove while the pointer is still). cellAt lets the row run
    // off-grid; the editor clamps it internally.
    const AUTOSCROLL_MS = 40; // ~25 lines/sec, matching the native clients
    let autoscrollCell = null, autoscrollTimer = null;
    // The top row, or the bottom band (last text row + status + command rows).
    function inScrollZone(row) { return row <= 0 || row + 2 >= editorRows + 1; }
    function armAutoscroll(row, col) {
      if (dragBtn === "left" && inScrollZone(row)) {
        autoscrollCell = { row, col };
        if (!autoscrollTimer) autoscrollTimer = setInterval(autoscrollTick, AUTOSCROLL_MS);
      } else {
        disarmAutoscroll();
      }
    }
    function disarmAutoscroll() {
      if (autoscrollTimer) { clearInterval(autoscrollTimer); autoscrollTimer = null; }
      autoscrollCell = null;
    }
    function autoscrollTick() {
      if (!dragBtn || !autoscrollCell) { disarmAutoscroll(); return; }
      // No modifiers on the repeated drag, as the native clients do.
      sendMouse("left", "drag", "", autoscrollCell.row, autoscrollCell.col);
    }

    gridEl.addEventListener("mousedown", (e) => {
      gridEl.focus();
      const button = BTN[e.button];
      if (!button) return;
      e.preventDefault();
      disarmAutoscroll(); // safety: clear any stale pump from a missed mouseup
      const { row, col } = cellAt(e);
      if (button === "left") dragBtn = "left";
      sendMouse(button, "press", mods(e), row, col);
    });
    gridEl.addEventListener("mousemove", (e) => {
      if (!dragBtn) return;
      const { row, col } = cellAt(e);
      sendMouse(dragBtn, "drag", mods(e), row, col);
      // Arm/refresh (or disarm) the pump based on where the drag now sits.
      armAutoscroll(row, col);
    });
    window.addEventListener("mouseup", (e) => {
      if (!dragBtn) return;
      disarmAutoscroll();
      const { row, col } = cellAt(e);
      sendMouse(dragBtn, "release", mods(e), row, col);
      dragBtn = null;
    });
    // The browser fires many `wheel` events per physical scroll — a trackpad or a
    // hi-res mouse reports a burst of sub-line deltas — so a notch per raw event
    // scrolls a full `'mousescroll'` step each time and the view flies. The wasm core
    // (`WebEditor::wheel`, which the scroll tests cover) converts the delta to
    // whole-line notches, carrying the fractional remainder between events, exactly
    // like the GUI client.
    gridEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const { row, col } = cellAt(e);
      editor.wheel(e.deltaX, e.deltaY, e.deltaMode, cw, ch, mods(e), row, col, Date.now());
      refresh();
    }, { passive: false });
    gridEl.addEventListener("contextmenu", (e) => e.preventDefault());

    document.getElementById("btn-open").addEventListener("click", () => openFile(null));
    document.getElementById("btn-save").addEventListener("click", () => saveFile(false));
    document.getElementById("btn-saveas").addEventListener("click", () => saveFile(true));

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(doResize, 80);
    });
    function doResize() {
      layout();
      if (editor) sendResize(cols, editorRows);
    }

    // ---- boot ----
    function fitGrid() {
      const top = gridEl.getBoundingClientRect().top;
      gridEl.style.height = (window.innerHeight - top) + "px";
    }
    async function boot() {
      await init();
      fitGrid();
      measureCell();
      layout();
      bootLocal();
    }

    // The fully client-side editor: WebEditor + the in-page tree-sitter highlighter.
    function bootLocal() {
      editor = new WebEditor(cols, editorRows);
      // Tree-sitter highlighting: loads the runtime + each grammar lazily and asks
      // for a repaint (tsRefresh) as they become ready. Fully client-side.
      ts = createHighlighter({ onReady: tsRefresh });
      refresh();
      gridEl.focus();
      if (!hasFSAccess) {
        notify("This browser can't write files back directly (no File System Access API). Open still works; Save downloads a copy. For full local-file editing, use a Chromium browser.");
      }
      // Expose a tiny hook so automated tests can drive the file pipeline without a
      // native picker (which can't be scripted). Not used by the UI.
      window.__nxvim = {
        load: (name, text) => { editor.load_file(name, text); refresh(); },
        text: () => editor.buffer_text(),
        feed: (n) => feed(n),
        key: (ctrl, alt, shift, name) => { editor.key(ctrl, alt, shift, name); refresh(); },
        mouse: (button, action, modifier, row, col) => { editor.mouse(button, action, modifier, row, col, Date.now()); refresh(); },
        view: () => view,
        clipSeed: (t) => editor.set_clipboard_text(t),
        clipTake: () => editor.take_clipboard_write(),
      };
    }

    window.addEventListener("resize", fitGrid);
    boot();
  </script>
</body>
</html>
