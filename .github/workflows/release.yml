name: release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: read
        shell: bash
        run: |
          VERSION=$(grep -m1 -E '^version = ' Cargo.toml | sed -E 's/version = "([^"]*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.read.outputs.version }}"
          git push origin "v${{ steps.read.outputs.version }}"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.tag.outputs.version }}

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nxvim-${{ needs.tag.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum nxvim-* > SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/nxvim-${{ needs.tag.outputs.version }}-*"

      - name: Build release notes
        shell: bash
        run: |
          {
            git cliff --current --strip header
            echo
            echo "---"
            echo "Verify a download's provenance:"
            echo '```'
            echo "gh attestation verify <file> --repo davidrios/nxvim"
            echo '```'
          } > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.tag.outputs.version }}" dist/* \
            --title "v${{ needs.tag.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
