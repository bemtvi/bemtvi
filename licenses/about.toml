# cargo-about configuration: the Rust crates linked into bemtvi's shipped
# binaries, for THIRD-PARTY-LICENSES.txt. scripts/gen-licenses.sh runs it and
# adds the code that isn't a crate (vendored C, the colorschemes, the web
# build's JS and grammars).

# In order of preference: where a crate offers a choice (`MIT OR Apache-2.0`,
# `Apache-2.0 OR GPL-2.0-only`), the first accepted one is the license we
# take it under. A crate whose license isn't listed fails the generation.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MIT-0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "NCSA",
  "OpenSSL",
  "MPL-2.0",
]

# Every target a release ships, so one file covers every download.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-emscripten",
]

# Only what is linked: no build scripts' or tests' dependencies.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# `publish = false` crates are bemtvi's own (the edit-host, the test harness,
# bemtvi-regex). bemtvi-regex's vendored C is listed by gen-licenses.sh.
private = { ignore = true }
