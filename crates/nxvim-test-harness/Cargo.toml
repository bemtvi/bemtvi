[package]
name = "nxvim-test-harness"
description = "Shared black-box integration-test harness for nxvim: spawns a real server over an in-process RPC pipe and drives it the way a UI client does."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `atexit` (remove this run's temp root) + `kill(pid, 0)` (is the owner of a
# leftover root still alive?) — see `temp_root` / `sweep_stale_temp_roots`.
libc.workspace = true
nxvim-core.workspace = true
nxvim-rpc.workspace = true
# The harness uses `nxvim_server::{run, ServerInit}`, both gated behind the
# server's `native` feature. The workspace pins `nxvim-server` with
# `default-features = false` (so the wasm edit-host can opt out), which leaves
# `native` off when this crate is built in isolation (`cargo clippy -p
# nxvim-test-harness`) — those imports then fail to resolve. Request `native`
# explicitly here: a no-op for the real consumer builds (feature unification
# already turns it on) that also lets the harness compile/lint standalone.
nxvim-server = { workspace = true, features = ["native"] }
rmpv.workspace = true
tokio.workspace = true
