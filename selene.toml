# selene linting for bemtvi's first-party Lua (crates/bemtvi-lua/src/prelude/).
#
# std = base Lua 5.1 GLOBALS + bemtvi's own (incl. the 5.2+ stdlib bits PUC 5.4 adds),
# parsed with the Lua 5.4 GRAMMAR — see bemtvi.yml, which sets both and explains why
# they differ. The 5.4 grammar needs a selene built with it:
#
#     cargo install selene --features selene-lib/lua54
#
# The default build reports `unexpected character &` on 5.4 bitwise operators.
std = "lua51+bemtvi"

[rules]
# stylua deliberately collapses simple statements onto one line (the prelude's
# `if x then return end` / `for _, v in ... do f(v) end` idiom). Keeping this
# rule would fight the formatter, so allow it.
#multiple_statements = "allow"
# selene's arg-count check is imprecise when a local is reassigned to a
# different function before the call (fs.lua's `matches`), yielding false
# positives. Disable rather than contort the code.
mismatched_arg_count = "allow"
# The prelude has intentional branches that share a body under distinct
# conditions (keymap precedence, lsp hover filtering), each documented inline.
if_same_then_else = "allow"
