# Pre-commit hooks for bemtvi.
#
# Enable once per clone:  pre-commit install
# Run manually on demand:  pre-commit run --all-files
# Bypass in an emergency:  git commit --no-verify
#
# Install the runner with one of:  pipx install pre-commit | brew install pre-commit
# The Lua hooks need stylua + selene on PATH:
#     cargo install stylua
#     cargo install selene --features selene-lib/lua54
# selene's default build (and the brew one) parses Lua 5.1 syntax only, and reports
# every 5.4 bitwise operator in the prelude as `unexpected character &`; the feature
# compiles in the 5.4 grammar `bemtvi.yml` asks for.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust formatting (rustfmt)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint with clippy, treating warnings as errors
        # No `--all-features`: the `lua51` and `luajit` mlua backends are
        # mutually exclusive (mlua-sys `compile_error!`s if both are on), so
        # `--all-features` can't build. Lint the default backend (lua51); the
        # luajit build is covered separately via `--no-default-features
        # --features luajit` when needed.
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # --- First-party Lua ----------------------------------------------------
      # stylua covers the prelude AND examples/ — an example is read as much as it is
      # run, so it is held to the same shape as the API it demonstrates. A block that
      # is laid out by hand for a reason (a word list wrapped to four rows, a table
      # whose columns are aligned) opts out at the statement with a bare
      # `-- stylua: ignore`, reason on the comment line above it.
      #
      # An example's `init.lua`, its `test/` specs and any module tree under it are
      # code. A bare `.lua` in an example's ROOT is a sample BUFFER — a fixture the
      # reader opens and types at, whose shape is the demonstration (a line parked at
      # column 0 for `>>` to move, parentheses stacked for the rainbow colours) — so
      # the pattern below takes `<example>/init.lua` and anything one level deeper,
      # and leaves the fixtures alone. `.styluaignore` says the same for a bare
      # `stylua .`.
      #
      # selene stays on the prelude alone: the examples have never been lint-clean
      # (they demonstrate ignored returns, shadowing, `_G` writes), and turning that
      # into a commit gate is a separate cleanup, not a formatting one.
      #
      # The vendored neovim copies under src/vendor/nvim/ are never touched.
      # Config: stylua.toml / selene.toml + the bemtvi.yml selene std at the root.
      - id: stylua
        name: stylua
        description: Check Lua formatting (stylua)
        entry: stylua --check
        language: system
        types: [lua]
        files: ^(crates/bemtvi-lua/src/prelude/.*|examples/[^/]+/(init|.+/.+))\.lua$

      - id: selene
        name: selene
        description: Lint Lua, failing on warnings (selene)
        entry: selene
        language: system
        types: [lua]
        files: ^crates/bemtvi-lua/src/prelude/.*\.lua$
