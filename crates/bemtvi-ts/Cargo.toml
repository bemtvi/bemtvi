[package]
name = "bemtvi-ts"
description = "In-process treesitter for bemtvi: loads installable grammars and parses incrementally, exposing a synchronous highlight engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
ropey.workspace = true
bemtvi-core.workspace = true
tree-sitter.workspace = true
streaming-iterator.workspace = true
libloading.workspace = true
# `:TSInstall` grammar fetch + compile (src/install.rs).
ureq.workspace = true
serde_json.workspace = true
tar.workspace = true
flate2.workspace = true
xz2.workspace = true
zip.workspace = true
sha2.workspace = true

[dev-dependencies]
# Grammar fixtures for the hermetic engine tests (`tests/fixture/`): the crates'
# registry sources provide the C parser to compile and the bundled queries — no
# network, no `:TSInstall` (the same pattern as `crates/bemtvi/tests/syntax.rs`).
tree-sitter-rust.workspace = true
tree-sitter-md.workspace = true
