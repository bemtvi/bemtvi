[workspace]
resolver = "2"
members = [
    "crates/nxvim",
    "crates/nxvim-core",
    "crates/nxvim-rpc",
    "crates/nxvim-server",
    "crates/nxvim-lua",
    "crates/nxvim-tui",
    "crates/nxvim-ts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/davidrios/nxvim"
rust-version = "1.80"

[workspace.dependencies]
nxvim-core = { path = "crates/nxvim-core" }
nxvim-rpc = { path = "crates/nxvim-rpc" }
nxvim-server = { path = "crates/nxvim-server" }
nxvim-lua = { path = "crates/nxvim-lua" }
nxvim-tui = { path = "crates/nxvim-tui" }
nxvim-ts = { path = "crates/nxvim-ts" }

# Direct dependencies are pinned to exact versions (`=x.y.z`) for reproducible
# builds. Pre-release lines (ropey 2.0-beta, mlua 0.12-rc) are intentionally
# avoided in favor of the latest stable releases.
anyhow = "=1.0.102"
ropey = "=2.0.0-beta.1"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
ratatui = "=0.30.0"
tokio = { version = "=1.52.3", features = ["rt", "macros", "io-util", "io-std", "sync", "time", "process"] }
futures = "=0.3.32"
rmpv = "=1.3.1"
mlua = { version = "=0.11.6", features = ["lua51", "vendored"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.2"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
tree-sitter = "=0.26.9"
streaming-iterator = "=0.1.9"
libloading = "=0.8.9"
# Dev-only: a real grammar to compile into a test fixture (never linked into the
# editor — nxvim loads grammars dynamically at runtime).
tree-sitter-rust = "=0.24.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
