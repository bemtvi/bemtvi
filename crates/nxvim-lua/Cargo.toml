[package]
name = "nxvim-lua"
description = "Lua runtime and vim.* bindings for nxvim (Lua 5.1, LuaJIT-compatible)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The Lua backend (vendored PUC Lua 5.1) is baked into the shared `mlua` dep —
# no per-crate backend feature. LuaJIT is not supported (PUC-Lua-only, matching
# the wasm build).

[dependencies]
anyhow.workspace = true
mlua.workspace = true
# The real vim regexp engine backing `vim.fn.substitute` and `vim.regex` — vim's
# magic dialect including `\zs`/`\ze`, look-around and in-pattern back-references,
# which the previous RE2 translator could not represent.
nxvim-regex.workspace = true
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true

# The treesitter crate, with its `vim.treesitter` Lua binding enabled. nxvim-lua
# owns the Lua VM, so it installs the binding (`nxvim_ts::lua::install`) and
# selects the shared mlua backend (`lua51`/`luajit`) the binding links against.
#
# Gated off wasm: nxvim-ts pulls `libloading` (dynamic library loading), which has
# no wasm implementation, and the browser highlights in JS via web-tree-sitter
# anyway — so the `vim.treesitter` Rust binding is compiled out there (edit-host
# plan, Phase 4). The two call sites in `runtime.rs` are `cfg(not(wasm))`-gated to
# match.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nxvim-ts = { workspace = true, features = ["lua"] }
