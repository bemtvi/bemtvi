# selene standard library for nxvim's Lua prelude.
# Layers the globals nxvim injects on top of the base PUC Lua runtime so selene
# doesn't flag them as undefined / unscoped. `any: true` permits arbitrary field
# reads, writes, and calls (the `vim.*` API is open-ended).
#
# Two independent settings, and mixing them up is the whole subtlety here:
#
#   * `lua_versions: [lua54]` sets the **grammar** selene parses with — nxvim runs
#     PUC Lua 5.4, so the prelude may use its syntax (bitwise `&` `|` `~` `<<` `>>`,
#     floor division `//`, integer division semantics, goto labels). Without this
#     selene parses as 5.1 and reports a bare `parse_error` on `&`, which reads like
#     broken code rather than a lint setting.
#   * `base: lua51` sets the **globals**, and stays 5.1 on purpose: selene's bundled
#     5.2/5.3 stds are incomplete (no `coroutine.isyieldable`), while the 5.1 one is
#     complete AND still defines `unpack` / `loadstring` / `getfenv`, which the
#     prelude legitimately calls (nxvim's runtime keeps them, and `runtime.rs`
#     shims `loadstring`). The handful of 5.2+ stdlib names the prelude uses on top
#     of that are declared under `globals` below.
#
# The grammar needs a selene built with the matching feature — the default build
# has it compiled out and would report those parse errors regardless of this file:
#
#     cargo install selene --features selene-lib/lua54
#
# Referenced as `std = "lua51+nxvim"` from selene.toml — selene resolves the
# `nxvim` segment to this file (nxvim.yml, alongside selene.toml at the repo root).
base: lua51
name: nxvim
lua_versions:
  - lua54
globals:
  # The editor API root. Open-ended: vim.keymap.set, vim.api.*, vim.fn.*, etc.,
  # plus assignment of new submodules (vim.treesitter = require("vim.treesitter")).
  vim:
    any: true
  # nxvim's own canonical config/plugin API (prelude/nx.lua); the bounded `vim.*`
  # whitelist is aliases onto it. Open-ended like `vim`.
  nx:
    any: true
  # LuaJIT's bit library. neovim ships it; the prelude polyfills it on PUC 5.1
  # (stdlib.lua) and plugins reach for `bit` / `bit32`.
  bit:
    any: true
  bit32:
    any: true
  # LuaJIT introspection global, referenced for runtime feature detection.
  jit:
    any: true
  # Lua 5.2+ moved `unpack` to `table.unpack`; nxvim runs PUC 5.4, so the prelude
  # calls `table.unpack` directly (the `table` field isn't in selene's lua51 std).
  table.unpack:
    any: true
  # 5.3+ `table.move`; vim.split's trimempty shift uses it. Same reasoning:
  # not in selene's lua51 std, provided by nxvim's PUC 5.4.
  table.move:
    any: true
  # 5.2+ coroutine introspection; `nx.await` uses it to detect an enclosing
  # nx.async coroutine. Not in selene's lua51 std, so declare it here.
  coroutine.isyieldable:
    args: []
  # 5.3+ `utf8` library (present in nxvim's PUC 5.4); `nx.markdown.to_view` uses
  # `utf8.offset` for char→byte column conversion. Open-ended like `bit`.
  utf8:
    any: true
  # 5.2+ `package.config` (present in nxvim's PUC 5.4): its first line is the
  # platform's directory separator, which `nx.utils.is_windows` reads. Baked in at
  # Lua build time, so it is right in every build with no host round-trip — but it
  # is not in selene's lua51 std, so declare it here.
  package.config:
    property: read-only
