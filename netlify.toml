# Netlify configuration for the bemtvi wasm edit-host (crates/bemtvi-edithost) — the real
# in-browser editor: bemtvi-core + the PUC Lua 5.4 VM + the full server tick compiled to
# WebAssembly and driven in a Web Worker. Connect the repo once in the Netlify dashboard;
# thereafter every push to the production branch runs the build below and deploys it.
#
# This file configures the STANDARD editor site (e.g. bemtvi.netlify.app), whose base directory
# is the repo root. The python demo is a SEPARATE site (e.g. bemtvi-demo.netlify.app) — same repo,
# different build. Netlify resolves a netlify.toml relative to each site's *base directory*, and
# file-based [build] settings can't be overridden from the dashboard — so the demo can't reuse a
# blank base + UI build settings (this root [build] would win). Instead it gets its own
# crates/bemtvi-edithost/netlify.toml and sets its base directory there; see that file's header
# for the dashboard setup.
#
# The build compiles to wasm via emscripten (emcc) and vendors the tree-sitter grammars,
# then assembles a clean static publish root at crates/bemtvi-edithost/_site (the page's
# web/ and dist/ as siblings, with the cross-origin-isolation _headers at its root). All
# of that is generated here — gitignored, not committed.
[build]
  command = "bash crates/bemtvi-edithost/netlify-build.sh"
  publish = "crates/bemtvi-edithost/_site"

[build.environment]
  # Node (selected by Netlify) for the tree-sitter vendoring script build.sh runs in
  # the crate's treesitter/ tooling dir.
  NODE_VERSION = "24"
  # Rust toolchain version — read by netlify-build.sh, which installs/selects it via
  # rustup (Netlify's image has rustup but no default toolchain, and doesn't provision
  # RUST_VERSION itself). Must be >= 1.85 (the transitive rmpv dep needs edition2024).
  RUST_VERSION = "1.96.0"
  # Emscripten SDK version netlify-build.sh installs/activates for the emcc link step.
  # Pinned to match the local emcc this is built/tested with.
  EMSDK_VERSION = "6.0.0"

# The editor's relative imports only resolve when the document URL is under /web/
# (index.html loads ./worker.mjs; worker.mjs loads ../dist/eh.mjs), so send the bare
# root there — same as the dev server (web/serve.mjs).
[[redirects]]
  from = "/"
  to = "/web/"
  status = 302
