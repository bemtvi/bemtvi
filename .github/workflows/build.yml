name: build

on:
  workflow_call:
    inputs:
      version:
        description: "Version string used in archive names (e.g. 0.2.0 or edge)"
        required: true
        type: string
    secrets:
      MACOS_CERT_P12:
        required: false
      MACOS_CERT_PASSWORD:
        required: false
      MACOS_INSTALLER_CERT_P12:
        required: false
      MACOS_INSTALLER_CERT_PASSWORD:
        required: false
      AC_API_KEY_P8:
        required: false
      AC_API_KEY_ID:
        required: false
      AC_API_ISSUER_ID:
        required: false

jobs:
  build:
    name: ${{ matrix.kind }} ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── TUI (`nxvim`) ────────────────────────────────────────────────
          # Linux: static musl. macOS: stapled Developer ID Installer .pkg
          # (installs to /usr/local/bin). Windows: bare .exe in a zip.
          - { target: x86_64-unknown-linux-musl,  runner: ubuntu-latest,    os: linux,   kind: tui, suffix: x86_64-linux-musl,  ext: tar.gz }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm,  os: linux,   kind: tui, suffix: aarch64-linux-musl, ext: tar.gz }
          - { target: x86_64-apple-darwin,        runner: macos-15-intel,    os: macos,   kind: tui, suffix: x86_64-macos,        ext: pkg }
          - { target: aarch64-apple-darwin,       runner: macos-14,          os: macos,   kind: tui, suffix: aarch64-macos,       ext: pkg }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest,    os: windows, kind: tui, suffix: x86_64-windows,      ext: zip }
          # ── GUI (`nxvim-gui`, winit + wgpu) ──────────────────────────────
          # Linux: glibc (gnu) — the graphics stack won't link against static
          # musl, so the GUI ships dynamically linked (needs X11/Wayland at
          # runtime). macOS: signed + notarized + stapled .app inside a .dmg.
          # Windows: bare .exe in a zip.
          - { target: x86_64-unknown-linux-gnu,   runner: ubuntu-latest,    os: linux,   kind: gui, suffix: x86_64-linux,        ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-24.04-arm,  os: linux,   kind: gui, suffix: aarch64-linux,       ext: tar.gz }
          - { target: x86_64-apple-darwin,        runner: macos-15-intel,    os: macos,   kind: gui, suffix: x86_64-macos,        ext: dmg }
          - { target: aarch64-apple-darwin,       runner: macos-14,          os: macos,   kind: gui, suffix: aarch64-macos,       ext: dmg }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest,    os: windows, kind: gui, suffix: x86_64-windows,      ext: zip }
    steps:
      - uses: actions/checkout@v6

      - name: Compute build vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "gui" ]; then
            CRATE=nxvim-gui; BIN=nxvim-gui; PREFIX=nxvim-gui
          else
            CRATE=nxvim;     BIN=nxvim;     PREFIX=nxvim
          fi
          {
            echo "CRATE=$CRATE"
            echo "BIN=$BIN"
            echo "ASSET=$PREFIX-${{ inputs.version }}-${{ matrix.suffix }}.${{ matrix.ext }}"
          } >> "$GITHUB_ENV"
          # The Linux GUI ships a second asset alongside the bare-binary tarball:
          # a single-file AppImage (desktop-integrated, runs on old glibc).
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.kind }}" = "gui" ]; then
            echo "APPIMAGE_ASSET=$PREFIX-${{ inputs.version }}-${{ matrix.suffix }}.AppImage" >> "$GITHUB_ENV"
          fi
          # CFBundle / pkg versions must be numeric; "edge" (and any non-numeric
          # tag) falls back to 0.0.0.
          V="${{ inputs.version }}"
          case "$V" in
            ''|*[!0-9.]*) PKG_VERSION=0.0.0 ;;
            *)            PKG_VERSION="$V" ;;
          esac
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux, TUI)
        if: matrix.os == 'linux' && endsWith(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Configure musl C toolchain (Linux, TUI)
        if: matrix.os == 'linux' && endsWith(matrix.target, 'musl')
        shell: bash
        run: |
          TLOW=$(echo "${{ matrix.target }}" | tr '-' '_')
          TUP=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          {
            echo "CC_${TLOW}=musl-gcc"
            echo "CARGO_TARGET_${TUP}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"

      - name: Install GUI build deps (Linux, GUI)
        if: matrix.os == 'linux' && matrix.kind == 'gui'
        run: |
          sudo apt-get update
          # winit (X11 + Wayland) + wgpu/glyphon graphics stack. Most of these
          # are dlopen'd at runtime, but the -dev packages cover any -sys crate
          # that wants headers at build time.
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxcb1-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            librsvg2-bin  # rsvg-convert: rasterizes the app icon for the AppImage

      # Zig is the cross-linker cargo-zigbuild drives to pin the GUI's glibc
      # floor (see the Linux-GUI build step). Only the Linux GUI needs it.
      - name: Install Zig (Linux, GUI)
        if: matrix.os == 'linux' && matrix.kind == 'gui'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild (Linux, GUI)
        if: matrix.os == 'linux' && matrix.kind == 'gui'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.kind }}

      - name: Build
        if: ${{ !(matrix.os == 'linux' && matrix.kind == 'gui') }}
        shell: bash
        run: cargo build --release -p "$CRATE" --target ${{ matrix.target }}

      # Linux GUI: link against an old glibc (2.28 — Debian 10 / Ubuntu 18.04 /
      # RHEL 8) so the dynamically-linked binary runs on systems far older than
      # the runner's own glibc. cargo-zigbuild consumes the `.2.28` suffix to
      # retarget the linker only; Cargo still writes to target/<triple>/release,
      # so every downstream packaging path is unchanged.
      - name: Build with pinned glibc floor (Linux, GUI)
        if: matrix.os == 'linux' && matrix.kind == 'gui'
        shell: bash
        run: cargo zigbuild --release -p nxvim-gui --target ${{ matrix.target }}.2.28

      - name: Import signing certificates (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          import_p12() {
            local b64="$1" pw="$2" cert="$RUNNER_TEMP/imp.p12"
            [ -z "$b64" ] && return 0
            echo "$b64" | base64 --decode > "$cert"
            security import "$cert" -k "$KEYCHAIN" -P "$pw" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
            rm -f "$cert"
          }
          # Developer ID Application — signs the binary / .app (always required).
          import_p12 "$MACOS_CERT_P12" "$MACOS_CERT_PASSWORD"
          # Developer ID Installer — signs the .pkg (required for the macOS TUI).
          # Falls back to the application cert's password if no separate one set.
          import_p12 "$MACOS_INSTALLER_CERT_P12" "${MACOS_INSTALLER_CERT_PASSWORD:-$MACOS_CERT_PASSWORD}"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make the temp keychain searchable alongside the existing ones (word-splitting intended).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[\"[:space:]]//g')

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk '/Developer ID Installer/ {print $2; exit}')"
          if [ -z "$APP_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          {
            echo "SIGN_IDENTITY=$APP_IDENTITY"
            echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
            echo "SIGN_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Write hardened-runtime entitlements (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          # The default Lua backend is LuaJIT, which allocates executable memory
          # at runtime. Under the hardened runtime that needs these entitlements
          # or running compiled Lua crashes (notarization does NOT catch this —
          # it only checks the signature, not runtime JIT behavior).
          ENT="$RUNNER_TEMP/entitlements.plist"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict>
          </plist>
          PLIST
          echo "ENTITLEMENTS=$ENT" >> "$GITHUB_ENV"

      # ── macOS TUI: sign → installer .pkg → notarize → staple ──────────────
      - name: Build, sign, notarize & staple installer .pkg (macOS, TUI)
        if: matrix.os == 'macos' && matrix.kind == 'tui'
        shell: bash
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          # shellcheck disable=SC2154  # SIGN_*/INSTALLER_IDENTITY/ENTITLEMENTS arrive via $GITHUB_ENV
          set -euo pipefail
          if [ -z "${INSTALLER_IDENTITY:-}" ]; then
            echo "::error::No Developer ID Installer identity found — set the MACOS_INSTALLER_CERT_P12 / MACOS_INSTALLER_CERT_PASSWORD secrets (a .pkg cannot be notarized unsigned)"
            exit 1
          fi
          BIN="target/${{ matrix.target }}/release/nxvim"

          # 1. Hardened-runtime sign the binary (Developer ID Application).
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          # 2. Build the installer package (Developer ID Installer), → /usr/local/bin.
          ROOT="$RUNNER_TEMP/pkgroot"
          mkdir -p "$ROOT"
          cp "$BIN" "$ROOT/nxvim"
          mkdir -p dist
          pkgbuild --root "$ROOT" \
            --identifier com.davidrios.nxvim \
            --version "$PKG_VERSION" \
            --install-location /usr/local/bin \
            --keychain "$SIGN_KEYCHAIN" \
            --sign "$INSTALLER_IDENTITY" \
            "dist/$ASSET"

          # 3. Notarize the .pkg, then staple the ticket (a .pkg supports stapling).
          KEY="$RUNNER_TEMP/ac_api.p8"
          echo "$AC_API_KEY_P8" | base64 --decode > "$KEY"
          if ! OUT="$(xcrun notarytool submit "dist/$ASSET" --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait --timeout 30m 2>&1)"; then
            printf '%s\n' "$OUT"
            ID="$(printf '%s\n' "$OUT" | awk '/id:/{print $2; exit}')"
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" || true
            rm -f "$KEY"
            exit 1
          fi
          printf '%s\n' "$OUT"
          rm -f "$KEY"
          xcrun stapler staple "dist/$ASSET"

      # ── macOS GUI: build .app → sign → .dmg → notarize → staple ───────────
      - name: Build & sign .app (macOS, GUI)
        if: matrix.os == 'macos' && matrix.kind == 'gui'
        shell: bash
        run: |
          # shellcheck disable=SC2154  # SIGN_*/ENTITLEMENTS arrive via $GITHUB_ENV
          set -euo pipefail
          APP="$RUNNER_TEMP/nxvim.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/nxvim-gui" "$APP/Contents/MacOS/nxvim-gui"

          # Build the .icns app icon from the same source SVG as the AppImage.
          # macOS does not mask app icons (unlike iOS), so the SVG's own rounded
          # square is the final shape. rsvg-convert (librsvg) renders each grid
          # size; iconutil packs the .iconset. Generated before codesign so it is
          # sealed into the bundle.
          brew install --quiet librsvg
          SVG=crates/nxvim-gui/assets/nxvim.svg
          ICONSET="$RUNNER_TEMP/nxvim.iconset"
          mkdir -p "$ICONSET"
          render() { rsvg-convert -w "$1" -h "$1" "$SVG" -o "$ICONSET/$2"; }
          render 16   icon_16x16.png
          render 32   icon_16x16@2x.png
          render 32   icon_32x32.png
          render 64   icon_32x32@2x.png
          render 128  icon_128x128.png
          render 256  icon_128x128@2x.png
          render 256  icon_256x256.png
          render 512  icon_256x256@2x.png
          render 512  icon_512x512.png
          render 1024 icon_512x512@2x.png
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/nxvim.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>nxvim</string>
            <key>CFBundleDisplayName</key><string>nxvim</string>
            <key>CFBundleIdentifier</key><string>com.davidrios.nxvim.gui</string>
            <key>CFBundleExecutable</key><string>nxvim-gui</string>
            <key>CFBundleIconFile</key><string>nxvim</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleVersion</key><string>$PKG_VERSION</string>
            <key>CFBundleShortVersionString</key><string>$PKG_VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          # Sign inner executable first, then the bundle (hardened runtime + JIT
          # entitlements for LuaJIT).
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$APP/Contents/MacOS/nxvim-gui"
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Package, notarize & staple .dmg (macOS, GUI)
        if: matrix.os == 'macos' && matrix.kind == 'gui'
        shell: bash
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          # shellcheck disable=SC2154  # SIGN_* arrive via $GITHUB_ENV
          set -euo pipefail
          APP="$RUNNER_TEMP/nxvim.app"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" dist
          cp -R "$APP" "$STAGE/nxvim.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "nxvim" -srcfolder "$STAGE" -ov -format UDZO "dist/$ASSET"
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "dist/$ASSET"

          # Notarize the .dmg container, then staple so a browser download (which
          # gets quarantined) opens offline on first launch.
          KEY="$RUNNER_TEMP/ac_api.p8"
          echo "$AC_API_KEY_P8" | base64 --decode > "$KEY"
          if ! OUT="$(xcrun notarytool submit "dist/$ASSET" --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" --wait --timeout 30m 2>&1)"; then
            printf '%s\n' "$OUT"
            ID="$(printf '%s\n' "$OUT" | awk '/id:/{print $2; exit}')"
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" || true
            rm -f "$KEY"
            exit 1
          fi
          printf '%s\n' "$OUT"
          rm -f "$KEY"
          xcrun stapler staple "dist/$ASSET"

      # ── Linux: plain tarball of the binary (musl TUI or glibc GUI) ────────
      # The GUI ships this raw-binary tarball *and* an AppImage (next step); the
      # tarball is what distro packagers / Nix users want.
      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/$ASSET" -C "target/${{ matrix.target }}/release" "$BIN"

      # ── Linux GUI: single-file, desktop-integrated AppImage ──────────────
      - name: Build AppImage (Linux, GUI)
        if: matrix.os == 'linux' && matrix.kind == 'gui'
        shell: bash
        env:
          # GitHub runners have no FUSE; run the AppImage tooling by self-extracting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-*)  ARCH=x86_64 ;;
            aarch64-*) ARCH=aarch64 ;;
            *) echo "::error::unsupported AppImage arch for ${{ matrix.target }}"; exit 1 ;;
          esac
          export ARCH
          export PATH="$PWD:$PATH"  # let linuxdeploy find its sibling plugin

          # linuxdeploy bundles the app's direct dependencies, but the community
          # excludelist it applies deliberately omits the GPU/driver and core
          # display libs (libGL, libEGL, libvulkan, libdrm, libwayland-*, libxcb,
          # libxkbcommon, glibc). That is exactly what the wgpu/winit GUI needs:
          # wgpu must dlopen the *host's* Vulkan/GL drivers at runtime — bundling
          # mesa would break on NVIDIA and any mismatched driver stack.
          for tool in linuxdeploy linuxdeploy-plugin-appimage; do
            f="${tool}-${ARCH}.AppImage"
            curl -fsSLo "$f" \
              "https://github.com/linuxdeploy/${tool}/releases/download/continuous/${f}"
            chmod +x "$f"
          done

          # Rasterize the source SVG to the 256×256 PNG linuxdeploy installs into
          # the AppDir hicolor theme (stem must match the .desktop Icon= key).
          rsvg-convert -w 256 -h 256 crates/nxvim-gui/assets/nxvim.svg -o nxvim.png

          mkdir -p dist
          OUTPUT="dist/$APPIMAGE_ASSET" VERSION="$PKG_VERSION" \
            "./linuxdeploy-${ARCH}.AppImage" \
              --appdir AppDir \
              --executable "target/${{ matrix.target }}/release/nxvim-gui" \
              --desktop-file crates/nxvim-gui/assets/nxvim.desktop \
              --icon-file nxvim.png \
              --output appimage
          test -f "dist/$APPIMAGE_ASSET"

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/${env:BIN}.exe" -DestinationPath "dist/${env:ASSET}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

      - name: Upload AppImage artifact (Linux, GUI)
        if: matrix.os == 'linux' && matrix.kind == 'gui'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE_ASSET }}
          path: dist/${{ env.APPIMAGE_ASSET }}
          if-no-files-found: error

  # ── Edit-host: the editor compiled to WebAssembly (nxvim-edithost) ───────
  # A self-contained static site — download the tarball, extract, and serve with any
  # static host (the bundled web/serve.mjs sets the required cross-origin-isolation
  # headers; _headers covers Netlify / Cloudflare Pages). This is the same publish
  # layout the Netlify deploy ships, assembled by the shared package-site.sh. Links C
  # (vendored Lua + vim-regex), so it needs Emscripten's `emcc` linker on top of the
  # Rust→wasm toolchain; Node vendors the tree-sitter highlighter assets + msgpack.
  edithost:
    name: edit-host wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/nxvim-edithost
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # emcc — the final linker build.sh invokes by hand to combine the Rust staticlib
      # with the vendored C archives. Pin to the EMSDK_VERSION netlify.toml uses so the
      # release tarball matches the deployed site.
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.0
          actions-cache-folder: emsdk-cache

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nxvim-edithost
          shared-key: edithost-wasm

      # Vendor @msgpack/msgpack into web/vendor/ (build.sh copies it from here) so the
      # tarball ships daemon mode — the browser↔daemon WebTransport RPC client. Skip
      # Playwright's browser download: the verifiers don't run in this job.
      - name: Vendor web deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: cd web && npm install

      # build.sh: cargo (wasm32-unknown-emscripten) → emcc link → dist/eh.{mjs,wasm},
      # and generates+copies the web-tree-sitter highlighter assets into web/vendor/.
      - name: Build wasm edit-host
        run: ./build.sh

      # Assemble the static publish root (web/ + dist/ siblings, _headers, serve.mjs, a
      # serving README), then tar it. The asset name matches the `nxvim-*` glob the
      # edge/release publish jobs download, so it joins the GitHub release automatically.
      - name: Package site tarball
        run: |
          set -euo pipefail
          ./package-site.sh _site
          mkdir -p dist
          tar -czf "dist/nxvim-edithost-${{ inputs.version }}.tar.gz" -C _site .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nxvim-edithost-${{ inputs.version }}.tar.gz
          path: crates/nxvim-edithost/dist/nxvim-edithost-${{ inputs.version }}.tar.gz
          if-no-files-found: error
