[package]
name = "nxvim"
description = "A neovim-compatible modal editor, written in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nxvim"
path = "src/main.rs"

# Lua backend, threaded down to nxvim-lua. Default is vendored PUC Lua 5.1;
# `--no-default-features --features luajit` builds the binary on LuaJIT.
# nxvim-server inherits `default-features = false` from [workspace.dependencies].
[features]
default = ["lua51"]
lua51 = ["nxvim-server/lua51"]
luajit = ["nxvim-server/luajit"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
nxvim-server.workspace = true
nxvim-tui.workspace = true
nxvim-lsp.workspace = true

[dev-dependencies]
ratatui.workspace = true
portable-pty.workspace = true
vt100.workspace = true
tree-sitter-rust.workspace = true
serde_json.workspace = true
# The integration tests speak the msgpack-RPC wire directly to drive the server.
nxvim-rpc.workspace = true
rmpv.workspace = true
