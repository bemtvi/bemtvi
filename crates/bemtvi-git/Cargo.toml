[package]
name = "bemtvi-git"
description = "In-process git for bemtvi via gix: the native executor behind the async btv.git.* Lua API (discover/head/show/diff/status, and clone/checkout/pull/submodule)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# gix feature set (default-features off, so we opt in explicitly): `sha1` is
# mandatory — git's object hashing; without it gix-hash's `Kind` enum has no
# variants and won't compile. `max-performance-safe` gets the pure-Rust parallel +
# fast-zlib backends (no unsafe/C). Read verbs need `status`/`dirwalk`/`blob-diff`/
# `revision`; Phase-2 clone/fetch/pull need `blocking-network-client` + a
# bundled-TLS http transport (rust-tls, no system OpenSSL); checkout needs
# `worktree-mutation`.
gix = { workspace = true, features = [
    "sha1",
    "max-performance-safe",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "status",
    "dirwalk",
    "blob-diff",
    "revision",
    "worktree-mutation",
] }
# gix sub-crates for the hand-rolled `reset --hard` (checkout / ff-pull worktree
# update): build a fresh index from the target tree, then write it over the worktree.
# gix has no high-level reset, and its internal `gix_worktree_state::checkout` isn't
# re-exported — so we call it directly, at the exact versions gix 0.86 uses.
gix-index.workspace = true
gix-worktree-state.workspace = true
# The typed GitJob / GitValue / GitError this executor runs (wasm-safe plain data,
# defined in bemtvi-lua so the Lua bridge and the daemon wire codec share them).
bemtvi-lua.workspace = true
