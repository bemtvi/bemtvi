# ⚠️⚠️⚠  TEMPORARY — CONCEPT-VALIDATION DEMO ONLY — DELETE ME  ⚠️⚠️⚠
#
# This crate exists to PROVE ONE THING: the real editor core *plus the Lua VM*
# compile to wasm (emscripten) and run together — feed vim keys, exec Lua, read
# buffer lines back. It is NOT the edit-host. It hand-wires a throwaway minimal
# sync tick (editor.input + lua.eval + drain take_commands) instead of reusing
# nxvim-server's real glue. It has NO autocmds, NO mirrors (Lua can't *read* the
# buffer), NO redraw, NO async/timers/fs/proc. Do not build on it.
#
# It validates Phase 4 of docs/plans/2026-06-09-edit-host-and-browser-lua.md.
# The real edit-host is a separate, later effort (see that plan). When that lands,
# delete this whole directory and its workspace `exclude` entry.
#
# Like crates/nxvim-web, this is EXCLUDED from the workspace (it targets
# wasm32-unknown-emscripten and pulls the C-heavy lua51 backend), so it can't
# inherit [workspace.package]/[workspace.dependencies] — fields are spelled out.
[package]
name = "nxvim-edithost-demo"
description = "TEMPORARY throwaway: proves nxvim-core + nxvim-lua run together in wasm (emscripten). Delete once the real edit-host lands."
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# staticlib: cargo archives all Rust+C objects into a .a; build.sh hands it to
# `emcc` for the final link (full control over the JS glue + exported symbols).
[lib]
crate-type = ["staticlib"]

[dependencies]
# The editor model (pure, synchronous). Default features → no vim-regex, so the
# core stays C-free; the only C in this build comes via nxvim-lua below.
nxvim-core = { path = "../nxvim-core" }
# The Lua VM + vim.* bindings. The backend (vendored PUC Lua 5.1) comes from the
# shared mlua dep — the only backend nxvim supports, and the one wasm requires.
nxvim-lua = { path = "../nxvim-lua" }
# Render a Lua eval result back to the harness as a string.
rmpv = "=1.3.1"

# Small-ish artifact. LTO is OFF on purpose: Rust LTO emits LLVM bitcode objects
# into the staticlib, which the `emcc` final link would then need `-flto` to read —
# an avoidable failure mode for a throwaway demo. Plain wasm objects just link.
[profile.release]
opt-level = "s"
lto = false
