# mdBook configuration for "The bemtvi Book".
#
# The book is GENERATED FROM SOURCE: run `python3 book/gen/generate.py` before
# building to (re)create src/SUMMARY.md, the imported docs chapters, and the
# auto-extracted btv.* API reference under src/api/. Those files are git-ignored;
# the prelude and the committed curated chapters are the source of truth.
#
#   python3 book/gen/generate.py && mdbook serve book   # local preview

[book]
title = "The bemtvi Book"
authors = ["David Rios"]
description = "Guide and btv.* API reference for bemtvi, a modal vim-style editor."
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/davidrios/bemtvi"
default-theme = "navy"
preferred-dark-theme = "navy"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
