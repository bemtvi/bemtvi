# The wasm edit-host (Phase 5 of
# docs/plans/2026-06-09-edit-host-and-browser-lua.md): the reusable synchronous
# `EditHost` tick (bemtvi-core + the PUC Lua 5.4 VM + the `vim.*` bindings + the full
# server glue — autocmds, mirrors, redraw projection) compiled to
# `wasm32-unknown-emscripten`, driven behind a wasm `HostEffects` (`WasmEffects`,
# src/lib.rs) inside a Web Worker (web/worker.mjs).
#
# This crate is EXCLUDED from the workspace (it targets wasm32-unknown-emscripten and
# pulls the C-heavy lua54 backend + vim-regex), so it can't inherit [workspace.package]
# / [workspace.dependencies] — fields are spelled out.
[package]
name = "bemtvi-edithost"
description = "The wasm (emscripten) edit-host: bemtvi's synchronous EditHost tick (core + Lua) behind a wasm HostEffects, for the browser Web Worker."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/bemtvi/bemtvi"
publish = false

# staticlib: cargo archives all Rust+C objects into a .a; build.sh hands it to
# `emcc` for the final link (full control over the JS glue + exported symbols).
[lib]
crate-type = ["staticlib"]

[dependencies]
# The reusable synchronous edit-host tick. `default-features = false` drops the
# default `native` feature (the whole async/transport tree + its non-emscripten
# deps); the Lua backend (PUC lua54) comes from the shared mlua dep. This pulls
# bemtvi-core (with vim-regex, which compiles under emscripten) and bemtvi-lua
# transitively, so the feature set is unified across the build.
bemtvi-server = { path = "../bemtvi-server", default-features = false }
# The editor model + the Lua runtime, named directly to construct the `EditHost`.
# Feature flags must match bemtvi-server's wasm tree (vim-regex on) so cargo
# unifies them rather than building a conflicting second copy.
bemtvi-core = { path = "../bemtvi-core", features = ["vim-regex", "serde"] }
bemtvi-lua = { path = "../bemtvi-lua" }
# The LSP leg (Phase 6e): the synchronous `SyncLspClient` + its `WireOp` queue, plus
# the protocol types (`ServerKey`/`ServerSpawn`/`LspNotify`/`LspRequest`/`ReqToken`/
# `LspEvent`) the wasm `HostEffects` LSP methods name. `default-features = false` drops
# the async manager/transport tree (tokio + async-lsp, neither emscripten-capable),
# matching bemtvi-server's wasm tree so cargo unifies to one no-native bemtvi-lsp copy.
bemtvi-lsp = { path = "../bemtvi-lsp", default-features = false }
# Name the `rmpv::Value` the `HostEffects::notify` redraw frames arrive as. Pinned to
# the workspace version so the type matches bemtvi-server's.
rmpv = "=1.3.1"
# Serialize the captured redraw frame (rmpv) to JSON for the JS/UI side. Pure Rust,
# wasm-clean; pinned to the workspace version.
serde_json = "=1.0.150"

# Small-ish artifact. LTO is OFF on purpose: Rust LTO emits LLVM bitcode objects into
# the staticlib, which the `emcc` final link would then need `-flto` to read — an
# avoidable failure mode. Plain wasm objects just link.
[profile.release]
opt-level = "s"
lto = false
