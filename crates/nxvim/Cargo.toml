[package]
name = "nxvim"
description = "A neovim-compatible modal editor, written in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nxvim"
path = "src/main.rs"

# Lua backend, threaded down to nxvim-lua. Default is LuaJIT;
# `--no-default-features --features lua51` builds the binary on vendored PUC Lua 5.1.
# nxvim-server inherits `default-features = false` from [workspace.dependencies].
[features]
default = ["luajit"]
# Backend toggle threaded to nxvim-server and, for tests, the shared harness, so
# a `--no-default-features --features lua51` build keeps a single backend.
lua51 = ["nxvim-server/lua51", "nxvim-test-harness/lua51"]
luajit = ["nxvim-server/luajit", "nxvim-test-harness/luajit"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
nxvim-server.workspace = true
nxvim-tui.workspace = true
nxvim-lsp.workspace = true

[dev-dependencies]
ratatui.workspace = true
portable-pty.workspace = true
vt100.workspace = true
tree-sitter-rust.workspace = true
serde_json.workspace = true
# The integration tests speak the msgpack-RPC wire directly to drive the server.
nxvim-rpc.workspace = true
# The screen/syntax/lsp tests build a `View` from a redraw and paint it.
nxvim-view.workspace = true
rmpv.workspace = true
# Shared black-box test harness (backend threaded via this crate's features).
nxvim-test-harness.workspace = true
