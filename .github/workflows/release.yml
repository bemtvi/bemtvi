name: release

# A release is a signed tag pushed by the maintainer (`git tag -s vX.Y.Z`):
# CLAUDE.md → Releasing. The notes are written by hand in
# docs/release-notes/vX.Y.Z.md; nothing here generates them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag, the version and the notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "bemtvi") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi
          # The edit-host is outside the workspace and keeps its own version.
          edithost=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path crates/bemtvi-edithost/Cargo.toml \
            | jq -r '.packages[] | select(.name == "bemtvi-edithost") | .version')
          if [ "$edithost" != "$version" ]; then
            echo "::error::bemtvi-edithost is at $edithost, the workspace at $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Releases come from signed, annotated tags only. GitHub checks the
      # signature against the keys on the tagger's account; a lightweight tag
      # has no tag object to sign and fails here too.
      - name: The tag is signed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(jq -r .object.type <<<"$ref")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; tag with \`git tag -s\`"
            exit 1
          fi
          verification=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification)
          if [ "$(jq -r .verified <<<"$verification")" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME isn't a verified signed tag ($(jq -r .reason <<<"$verification"))"
            exit 1
          fi

      - name: The release has its notes
        shell: bash
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty; write the release notes before tagging"
            exit 1
          fi

  # fmt, clippy, the integration suites and the example specs. Nothing is
  # built for release until they pass.
  test:
    needs: check
    uses: ./.github/workflows/test.yml

  build:
    needs: [check, test]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.version }}
    # Forward only the macOS signing/notarization secrets build.yml declares —
    # not `inherit` (which would expose every repo secret to the build, within
    # one careless `${{ secrets.* }}` of the third-party tooling the Linux GUI
    # AppImage job downloads). These are referenced only by macOS-gated steps.
    secrets:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Full history, for the previous tag the Full Changelog line compares to.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bemtvi-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum bemtvi-* > SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/bemtvi-*"

      # The site link, the hand-written notes, how to verify a download, and
      # the Full Changelog line (from the previous release, when there is one).
      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "[bemtvi.github.io/bemtvi](https://bemtvi.github.io/bemtvi/)"
            echo
            cat "docs/release-notes/$GITHUB_REF_NAME.md"
            echo
            echo "---"
            echo
            echo "Verify a download ([docs/verifying-downloads.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/verifying-downloads.md)):"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            else
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
            fi
          } > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
