[package]
name = "nxvim-lua"
description = "Lua runtime and vim.* bindings for nxvim (PUC Lua 5.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The Lua backend (vendored PUC Lua 5.4) is baked into the shared `mlua` dep —
# no per-crate backend feature. LuaJIT is not supported (PUC-Lua-only, matching
# the wasm build).

[dependencies]
anyhow.workspace = true
# The editor core, for the pure `nxvim_core::markdown` renderer behind
# `nx.markdown.render`. Pure Rust, wasm-safe — no editor state is touched (the
# renderer is a string→data transform), so this is a plain library edge.
nxvim-core.workspace = true
# Decode `nx.fs.read_text` through the multi-encoding seam (pure Rust, wasm-safe).
encoding_rs.workspace = true
# URL query-string + component percent-encoding for `nx.http` (query params / form
# bodies). The canonical `rust-url` crates — pure Rust, wasm-safe — so the encoding is
# an established lib, not a bespoke Lua implementation. See `prelude/http.lua`.
form_urlencoded.workspace = true
percent-encoding.workspace = true
# CSPRNG for `nx._uuid()` — the workspace session-namespace generator. Pure Rust,
# wasm-safe (emscripten backend).
getrandom.workspace = true
# Hash digests backing the `nx.hash.*` utilities (sha1 / sha256 / sha512 / md5).
# All RustCrypto, pure Rust and wasm-safe, sharing the `digest = 0.10` traits.
md-5.workspace = true
mlua.workspace = true
sha1.workspace = true
sha2.workspace = true
# The PCRE engine for `nx.buf.search` (the `regexsyntax=pcre` dialect) — the same
# `regex` crate the core search uses, so the two agree. Pure Rust, wasm-safe.
regex.workspace = true
# The real vim regexp engine backing `vim.fn.substitute` and `vim.regex` — vim's
# magic dialect including `\zs`/`\ze`, look-around and in-pattern back-references,
# which the previous RE2 translator could not represent. Also the `vim` dialect of
# `nx.buf.search`.
nxvim-regex.workspace = true
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true
# Cell-width table backing `nx.str.width` (the native display-width helper) — the
# same `unicode-width` crate `nxvim_core::unicode::display_width` measures with,
# so Lua layout code and the core renderer agree. Pure Rust, wasm-safe.
unicode-width.workspace = true

# The treesitter crate (the native highlight `Engine` + grammar/data-dir helpers
# nxvim-lua references). There is no Lua parser binding anymore — `nx.treesitter`
# is config/query control, not a tree-walking API — so no extra feature is needed.
#
# Gated off wasm: nxvim-ts pulls `libloading` (dynamic library loading), which has
# no wasm implementation, and the browser highlights in JS via web-tree-sitter
# anyway — so it is compiled out there (edit-host plan, Phase 4).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nxvim-ts = { workspace = true }
