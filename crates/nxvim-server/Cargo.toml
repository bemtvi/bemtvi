[package]
name = "nxvim-server"
description = "Headless async editor server for nxvim (owns the core model, hosts the API and Lua)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The Lua backend (PUC lua54) is baked into the shared `mlua` dep — no backend
# feature to select here. The dep inherits `default-features = false` from
# [workspace.dependencies] so `--no-default-features` (the wasm build) drops
# `native` below; the Lua VM is unaffected either way.
[features]
default = ["native"]
# The native-transport surface (Phase 5, the wasm edit-host seam). Default-on, so
# every native binary and the test suite are unchanged; turning it *off*
# (`--no-default-features`) compiles only the synchronous
# `EditHost` tick — the wasm build's subset. It gates the whole async/transport
# tree (the `run`/daemon/QUIC loop, the event-loop actor, the inbound translator,
# the msgpack wire, the redb shada store) plus the not-yet-portable LSP + native
# treesitter, and drops the deps those pull (none of which target
# `wasm32-unknown-emscripten`). See docs/plans/2026-06-09-edit-host-and-browser-lua.md
# → Phase 5-proper, slice 5a.
native = [
    "dep:tokio",
    "dep:wtransport",
    "dep:getrandom",
    "dep:redb",
    "dep:rmp-serde",
    "dep:serde",
    "dep:notify",
    "dep:nxvim-rpc",
    # nxvim-lsp is a non-optional dep (its wasm-safe data + sync client are used by
    # the always-on lsp/ consumer subtree); the `native` feature turns on its async
    # surface (the tokio + async-lsp manager/transport) for the desktop build.
    "nxvim-lsp/native",
    "dep:nxvim-ts",
    "dep:portable-pty",
    "dep:ureq",
    "dep:axum",
    "dep:form_urlencoded",
]

[dependencies]
anyhow.workspace = true
rmpv.workspace = true
# JSON values for LSP config payloads (the `serde_json::Value` carried by `LspOp`).
serde_json.workspace = true
# The terminal-job emulator (`:terminal`): decodes a child's raw PTY bytes into a
# screen grid the editor mirrors as buffer lines + per-cell colors. Pure Rust (no
# C, no I/O), so it compiles to wasm and stays a *non-optional* dep shared by both
# the native and edit-host builds — only the byte transport differs per build. See
# `terminal.rs` and docs/plans/2026-06-14-terminal-in-buffer.md.
vt100.workspace = true
tokio = { workspace = true, optional = true }
# The native daemon transport: WebTransport/QUIC listener + client (Open Decision
# #2). `quic.rs` mints the bearer token + self-signed cert here and feeds a bidi
# stream's halves into the transport-agnostic `connect_daemon` / `run_daemon_io`.
wtransport = { workspace = true, optional = true }
# CSPRNG for the daemon's launch-minted bearer token (`quic.rs`).
getrandom = { workspace = true, optional = true }
# Persistence (shada): the per-instance redb store + its msgpack value encoding.
# See `shada.rs` and docs/plans/2026-06-11-shada-persistence.md.
redb = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# Native filesystem watching backing `vim.uv.fs_event` (driven from the event-loop
# actor in evloop.rs).
notify = { workspace = true, optional = true }
# The native PTY transport for `:terminal` (Phase 3): spawns the local
# pseudo-terminal the terminal-job buffer mirrors. Native-only — the browser has no
# local PTY (it runs the child on the daemon over WebTransport, Phase 7), so it's
# gated under the `native` feature alongside the rest of the async/transport tree.
portable-pty = { workspace = true, optional = true }
# `vim-regex` pulls the real vim regexp engine into the core's `:s`/`/` search
# (`:set regexsyntax=vim`). Enabled here so the whole host workspace — and the
# integration tests — build it in via feature unification. The C compiles under
# emscripten too, so it stays on for the wasm `nxvim-edithost` build.
# `serde` derives the persistence snapshot (`PersistState` / `SessionState`) so the
# shada store can serialize the workspace session directly (see `shada.rs`).
nxvim-core = { workspace = true, features = ["vim-regex", "serde"] }
nxvim-rpc = { workspace = true, optional = true }
nxvim-lua.workspace = true
nxvim-lsp.workspace = true
# In-process treesitter: the server constructs the engine and installs it on the
# editor, which owns and queries it synchronously (no worker process). Native only
# — it shells out to a C compiler at `:TSInstall` and `dlopen`s the grammar, neither
# of which exists in the browser (wasm highlighting is JS-side, in `nxvim-edithost`).
nxvim-ts = { workspace = true, optional = true }
# The blocking HTTP client backing `nx.http.fetch` (native / daemon). Runs on the
# event-loop actor's `spawn_blocking` pool — off the editor tick — over its bundled
# rustls TLS (the same client `nxvim-ts` uses for `:TSInstall`). Native-only: the
# browser build routes `nx.http` to the daemon `http_op` leg or its own `fetch()`.
ureq = { workspace = true, optional = true }
# The `nx.http.mount` listener (`httpmount.rs`) — inbound HTTP, the twin of `ureq`'s
# outbound. Native-only: a browser tab cannot bind a TCP port, so the wasm build
# reaches the same mount contract through a Service Worker. Optional + `native`-gated
# so the edit-host never compiles it.
axum = { workspace = true, optional = true }
# Decoding inbound query strings for `nx.http.mount` handlers (`httpmount.rs`) — the
# same canonical `rust-url` serializer `nx.http`'s outbound `query`/`form` encoding
# uses, read in reverse. No bespoke query parser.
form_urlencoded = { workspace = true, optional = true }

[dev-dependencies]
# Shared black-box test harness. The single Lua backend (PUC lua54) comes from
# the shared `mlua` dep, so the harness's nxvim-server dependency resolves to the
# same backend as the crate under test.
nxvim-test-harness.workspace = true
# The treesitter engine, for the (ignored) progressive-highlight test that installs
# a real grammar into a temp data dir. It is a feature-gated *runtime* dep above; a
# dev-dep makes its `install` reachable from the integration tests unconditionally.
nxvim-ts.workspace = true
# The rust grammar's C sources + bundled highlights query, so the tree-sitter
# text-object e2e can compile a real parser into a temp data dir *hermetically* (no
# network `:TSInstall`), the same fixture pattern nxvim-ts's engine tests use.
tree-sitter-rust.workspace = true
