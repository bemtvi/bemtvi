[package]
name = "bemtvi-tui"
description = "Async terminal UI client for bemtvi (a thin RPC client; renders the server's grid)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
rmpv.workspace = true
tokio.workspace = true
futures.workspace = true
crossterm.workspace = true
ratatui.workspace = true
# In-terminal image rendering for `'imagepreview'` (see `images.rs`).
ratatui-image.workspace = true
image.workspace = true
unicode-width.workspace = true
bemtvi-rpc.workspace = true
bemtvi-view.workspace = true

# `poll(2)` on stdin for the graphics-protocol probe in `images.rs` — waiting for
# a query reply without consuming (or leaking a reader on) stdin is unix-specific.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# A real pty for `tests/signal_restore.rs`: the fatal-signal terminal restore can
# only be observed from outside, on the tty the killed process leaves behind.
[dev-dependencies]
portable-pty.workspace = true
