[package]
name = "nxvim-server"
description = "Headless async editor server for nxvim (owns the core model, hosts the API and Lua)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Lua-backend selection threaded through to nxvim-lua. The dep inherits
# `default-features = false` from [workspace.dependencies], which is what lets
# `--no-default-features` at the top turn luajit off so lua51 isn't enabled
# alongside it.
[features]
default = ["luajit"]
# The backend toggle is threaded into the test harness too (a dev-dependency),
# so a `--no-default-features --features lua51` test run doesn't drag luajit back
# in through the harness alongside lua51 (which breaks mlua-sys).
lua51 = ["nxvim-lua/lua51", "nxvim-test-harness/lua51"]
luajit = ["nxvim-lua/luajit", "nxvim-test-harness/luajit"]

[dependencies]
anyhow.workspace = true
rmpv.workspace = true
tokio.workspace = true
# Native filesystem watching backing `vim.uv.fs_event` (driven from the event-loop
# actor in evloop.rs).
notify.workspace = true
nxvim-core.workspace = true
nxvim-rpc.workspace = true
nxvim-lua.workspace = true
nxvim-lsp.workspace = true
# In-process treesitter: the server constructs the engine and installs it on the
# editor, which owns and queries it synchronously (no worker process).
nxvim-ts.workspace = true

[dev-dependencies]
# Shared black-box test harness. Backend features are threaded in via this
# crate's own lua51/luajit features (above) so the harness's nxvim-server
# dependency resolves to the same single backend as the crate under test.
nxvim-test-harness.workspace = true
