[package]
name = "nxvim"
description = "A modal, vim-style editor, written in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "nxvim"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
# Re-enable `native` explicitly (the workspace dep is `default-features = false`):
# this binary depends on native-gated server items, so it must not rely on feature
# unification from a `--workspace` build to turn `native` on.
nxvim-server = { workspace = true, features = ["native"] }
nxvim-tui.workspace = true
nxvim-lsp.workspace = true
# The `--test-plugin` runner drives an embedded server as an RPC client (the same
# msgpack wire a UI uses), so the transport + value type are runtime deps, not just
# test deps.
nxvim-rpc.workspace = true
rmpv.workspace = true

[dev-dependencies]
ratatui.workspace = true
portable-pty.workspace = true
vt100.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-md.workspace = true
serde_json.workspace = true
# The integration tests speak the msgpack-RPC wire directly to drive the server.
nxvim-rpc.workspace = true
# The screen/syntax/lsp tests build a `View` from a redraw and paint it.
nxvim-view.workspace = true
rmpv.workspace = true
# Shared black-box test harness (backend threaded via this crate's features).
nxvim-test-harness.workspace = true
