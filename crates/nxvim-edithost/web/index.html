      return css;
    }
    function severityColor(sev) {
      return sev === 1 ? "#e06c75" : sev === 2 ? "#e5c07b" : sev === 4 ? "#56b6c2" : "#61afef";
    }
    function renderLineServer(w, row, gutterW, rect) {
      const line = w.lines[row] ?? "";
      const isFiller = w.numbers[row] === null;
      let html = (gutterW > 0 || w.sign_column) ? renderGutterCell(w, row, gutterW) : "";
      if (isFiller) {
        const css = chromeCss(view.chrome?.end_of_buffer);
        return html + `<span class="eob"${css ? ` style="${css}"` : ""}>${escapeHtml(line)}</span>`;
      }
      const tabstop = w.tabstop || 8;
      const leftcol = w.leftcol || 0;
      const hints = w.inlay_hints?.[row] || [];
      const hlSpans = w.highlights?.[row] || [];
      const diagSpans = w.diagnostics?.[row] || [];
      const sel = w.selection?.[row] || null;
      const secSel = w.secondary_selection?.[row] || [];
      const search = w.search?.[row] || [];
      const inc = w.incsearch?.[row] || null;
      const secCols = new Set((w.secondary_cursors || []).filter(([r]) => r === row).map(([, c]) => c));
      const inSpan = (sp, c) => c >= sp[0] && c < sp[1];

      const expanded = [];
      let c0 = 0;
      for (const cp of line) {
        if (cp === "\t") { const n = tabstop - (c0 % tabstop); for (let k = 0; k < n; k++) expanded.push(" "); c0 += n; }
        else { expanded.push(cp); c0 += 1; }
      }

      const cells = [];
      let hi = 0;
      const emitHints = (anchor) => {
        while (hi < hints.length && hints[hi][0] <= anchor) {
          const [hcol, text, id] = hints[hi++];
          if (hcol < leftcol) continue;
          const css = id != null ? styleToCss(paletteStyle(id)) : "";
          for (const cp of text) cells.push({ ch: cp, abs: -1, base: css });
        }
      };
      for (let c = 0; c < expanded.length; c++) {
        emitHints(c);
        if (c >= leftcol) cells.push({ ch: expanded[c], abs: c, base: cellBaseCss(c, hlSpans, diagSpans) });
      }
      emitHints(Infinity);

      const isFocused = w.focused && !view.command_mode;
      const cursorRow = w.cursor_row;
      let inlayShift = 0;
      for (const [hcol, text] of hints) {
        if (hcol >= leftcol && hcol <= w.cursor_screen_col) inlayShift += [...text].length;
      }
      const cursorPainted = w.cursor_screen_col + inlayShift;

      const COLOR_OWNED = new Set(["cur-block", "cur-bar", "cur-underline", "cur-mc", "seccur", "search", "incsearch"]);
      let run = "", runCls = "", runStyle = "", out = "";
      const flush = () => {
        if (!run) return;
        out += `<span class="${runCls}"${runStyle ? ` style="${runStyle}"` : ""}>${escapeHtml(run)}</span>`;
        run = "";
      };
      let painted = leftcol;
      for (const cell of cells) {
        const a = cell.abs;
        let cls = "";
        if (a >= 0) {
          if (search.some((s) => inSpan(s, a))) cls = "search";
          if (inc && inSpan(inc, a)) cls = "incsearch";
          if ((sel && inSpan(sel, a)) || secSel.some((s) => inSpan(s, a))) cls = "sel";
          if (secCols.has(a)) cls = "seccur";
        } else {
          cls = "inlay";
        }
        if (isFocused && cursorRow === row && painted === cursorPainted) cls = cursorClass();
        else if (!w.focused && cursorRow === row && painted === cursorPainted && !view.command_mode) cls = "cur-hollow";
        const style = (a < 0) ? cell.base : (COLOR_OWNED.has(cls) ? "" : cell.base);
        if (cls !== runCls || style !== runStyle) { flush(); runCls = cls; runStyle = style; }
        run += cell.ch;
        painted += 1;
      }
      flush();
      if (isFocused && cursorRow === row && cursorPainted >= painted) {
        out += `<span class="${cursorClass()}"> </span>`;
      } else if (!w.focused && cursorRow === row && cursorPainted >= painted && !view.command_mode) {
        out += `<span class="cur-hollow"> </span>`;
      }
      const virt = w.diagnostics_virt?.[row];
      if (virt) {
        const [text, sev, id] = virt;
        const vcss = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
        out += `<span${vcss ? ` style="${vcss}"` : ""}> ${escapeHtml(text)}</span>`;
      }
      return html + out;
    }

    function renderGutterCell(w, row, width) {
      let html = "";
      if (serverStyled && w.sign_column) {
        const sign = w.diagnostics_signs?.[row];
        if (sign) {
          const [glyph, sev, id] = sign;
          const css = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
          html += `<span${css ? ` style="${css}"` : ""}>${escapeHtml((glyph + " ").slice(0, 2).padEnd(2))}</span>`;
        } else {
          html += `<span class="gutter">  </span>`;
        }
      }
      if (width <= 0) return html;
      // Blank the number on a soft-wrap continuation row (vim shows it on the line's
      // first row only); `numbers` still carries the line there.
      const n = w.continuation?.[row] ? null : w.numbers[row];
      const cur = w.cursor_line;
      let cell, cls = "gutter";
      if (n === null || n === undefined) cell = " ".repeat(width);
      else if (w.number && w.relativenumber && n === cur) { cell = String(n).padEnd(width); cls = "gutter-cur"; }
      else {
        let v;
        if (!w.relativenumber) v = n;
        else if (n === cur) v = 0;
        else v = Math.abs(n - cur);
        cell = String(v).padStart(width - 1) + " ";
        if (n === cur) cls = "gutter-cur";
      }
      return html + `<span class="${cls}">${escapeHtml(cell)}</span>`;
    }

    function renderSegmentBar(segments, width, cls) {
      let html = "";
      for (const { text, style } of (segments || [])) {
        const css = styleToCss(style);
        html += `<span${css ? ` style="${css}"` : ""}>${escapeHtml(text)}</span>`;
      }
      const el = document.createElement("div");
      el.className = cls;
      el.style.width = width * cw + "px";
      el.innerHTML = html;
      return el;
    }
    function renderStatusSegments(box, segments, atRow, width, focused) {
      const el = renderSegmentBar(segments, width, "row statusline" + (focused ? " focused" : ""));
      el.style.top = atRow * ch + "px";
      box.appendChild(el);
    }
    function renderGlobalStatus(atRow) {
      const el = renderSegmentBar(view.global_status, cols, "row statusline focused");
      el.style.top = atRow * ch + "px";
      gridEl.appendChild(el);
    }
    function renderTablineSegments(y) {
      const el = renderSegmentBar(view.tabline_segments, cols, "row statusline");
      el.style.top = y * ch + "px";
      gridEl.appendChild(el);
    }

    function renderPmenu(pmenu, tablineRows) {
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      const rect = fw ? winRect(fw) : { x: 0, y: 0 };
      const o = regionOrigin(fw ? fw.region : "main", tablineRows);
      const x = o.x + rect.x + pmenu.col;
      const y = o.y + rect.y + pmenu.row;
      const rows = Math.max(1, Math.min(pmenu.height, pmenu.items.length));
      const first = Math.max(0, Math.min(pmenu.selected - rows + 1, pmenu.items.length - rows));
      const start = pmenu.selected >= rows ? first : 0;
      const box = document.createElement("div");
      box.className = "pmenu";
      place(box, x, y, pmenu.width, rows);
      for (let i = 0; i < rows; i++) {
        const idx = start + i;
        const [label, , detail] = pmenu.items[idx] || ["", 0, ""];
        const left = String(label);
        const right = detail ? String(detail) : "";
        const pad = Math.max(1, pmenu.width - left.length - right.length);
        const text = (left + " ".repeat(pad) + right).slice(0, pmenu.width).padEnd(pmenu.width);
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (idx === pmenu.selected ? " pmenu-sel" : "");
        rowEl.style.width = pmenu.width * cw + "px";
        rowEl.textContent = text;
        box.appendChild(rowEl);
      }
      gridEl.appendChild(box);
      if (pmenu.doc && pmenu.doc.length) {
        const docW = Math.max(...pmenu.doc.map((l) => l.length), 1);
        const docBox = document.createElement("div");
        docBox.className = "pmenu-doc";
        place(docBox, x + pmenu.width, y, docW, pmenu.doc.length);
        for (const l of pmenu.doc) {
          const rowEl = document.createElement("div");
          rowEl.className = "row";
          rowEl.style.width = docW * cw + "px";
          rowEl.textContent = l;
          docBox.appendChild(rowEl);
        }
        gridEl.appendChild(docBox);
      }
    }

    // The nx.ui.float content float: a bordered box of plain content lines (LSP
    // hover / signature help) — the list-less sibling of the menu. Server-placed
    // geometry (text-area-relative `row`/`col`), no list / selection / scrolling
    // (the server already windowed the lines to `height`).
    function renderContentFloat(float, tablineRows) {
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      const rect = fw ? winRect(fw) : { x: 0, y: 0 };
      const x = rect.x + float.col;
      const y = tablineRows + rect.y + float.row;
      const box = document.createElement("div");
      box.className = "pmenu";
      // Drop the 1px border rule for a borderless float (the "none" keyword).
      if (!float.border || float.border === "none") box.style.border = "0";
      place(box, x, y, float.width, float.height);
      const lines = float.lines || [];
      for (let i = 0; i < float.height; i++) {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.style.width = float.width * cw + "px";
        // Each line is a chunk run `[[text, style_id], …]`: paint each chunk in its
        // palette style (a styled which-key colours keys vs. descriptions and dims
        // unavailable rows), clip to the box width, and pad the rest so the popup
        // background fills the row. A plain caller's single un-styled chunk has a
        // null id and renders in the default popup color.
        let used = 0;
        for (const [text, id] of (lines[i] || [])) {
          if (used >= float.width) break;
          const shown = String(text ?? "").slice(0, float.width - used);
          if (!shown) continue;
          used += shown.length;
          const span = document.createElement("span");
          const css = id != null ? styleToCss(paletteStyle(id)) : "";
          if (css) span.style.cssText = css;
          span.textContent = shown;
          rowEl.appendChild(span);
        }
        if (used < float.width) {
          rowEl.appendChild(document.createTextNode(" ".repeat(float.width - used)));
        }
        box.appendChild(rowEl);
      }
      gridEl.appendChild(box);
    }

    // The nx.ui.select menu: a bordered float-list under the cursor, reusing the
    // popup's look. Items are plain labels (no kind/detail/doc), and the
    // highlighted row gets the selection style.
    function renderMenu(menu, tablineRows, cmdRow) {
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      const rect = fw ? winRect(fw) : { x: 0, y: 0 };
      const x = rect.x + menu.col;
      // A picker carries a prompt query (even when empty); a nx.ui.select does not.
      const hasPrompt = menu.query !== null && menu.query !== undefined;
      const promptRows = hasPrompt ? 1 : 0;
      // A preview pane (Phase 3) splits the box into a list column (left) + a 1-col
      // separator + a preview column (right). The list keeps `width - previewW - 1`.
      const hasPreview = menu.preview != null;
      const previewW = hasPreview ? Math.max(1, Math.min(menu.preview.width, menu.width - 2)) : 0;
      const listW = hasPreview ? Math.max(1, menu.width - previewW - 1) : menu.width;
      // Render the FULL box height (`menu.height` is the fixed picker size), padding
      // empty rows past the item count so the box doesn't shrink to its content.
      const listRows = Math.max(1, menu.height - promptRows);
      const boxRows = listRows + promptRows;
      // The cmdline wildmenu floats *above* the command line: anchor its BOTTOM to the
      // command-line row so it kisses the input — covering the status line in between,
      // exactly as the cell-grid clients grow it up from `cmd_area`. Every other menu
      // sits where the server placed it (text-area row `menu.row`). `cmdShift` is the
      // resulting vertical offset, reused below so the docs sidebar tracks the box.
      const serverY = tablineRows + rect.y + menu.row;
      const y = menu.cmdline ? Math.max(tablineRows, cmdRow - boxRows) : serverY;
      const cmdShift = y - serverY;
      // A noselect completion popup (`selected_active === false`) highlights no row
      // and scrolls from the top.
      const selActive = menu.selected_active !== false;
      const first = Math.max(0, Math.min(menu.selected - listRows + 1, menu.items.length - listRows));
      const start = selActive && menu.selected >= listRows ? first : 0;
      const box = document.createElement("div");
      box.className = "pmenu";
      // The completion popup omits its top border so it sits flush with the line
      // below the cursor (the web border is a 1px rule, so unlike the cell-grid
      // clients no left-shift is needed — content already sits at `menu.col`).
      if (menu.border_top === false) box.style.borderTopWidth = "0";
      place(box, x, y, menu.width, boxRows);
      if (hasPrompt) {
        const text = ("> " + menu.query).slice(0, listW).padEnd(listW);
        const promptEl = document.createElement("div");
        promptEl.className = "row pmenu-prompt";
        promptEl.style.width = listW * cw + "px";
        promptEl.style.fontWeight = "bold";
        promptEl.textContent = text;
        box.appendChild(promptEl);
      }
      const listEls = [];
      for (let i = 0; i < listRows; i++) {
        const idx = start + i;
        const label = String(menu.items[idx] ?? "");
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (selActive && idx === menu.selected ? " pmenu-sel" : "");
        rowEl.style.width = listW * cw + "px";
        // Bold + accent the matched characters (the fuzzy match), per the server's
        // char-based spans; plain text when this picker/select has no spans.
        const spans = (menu.match_spans && menu.match_spans[idx]) || [];
        const chars = [...label].slice(0, listW);
        if (spans.length === 0) {
          rowEl.textContent = chars.join("").padEnd(listW);
        } else {
          chars.forEach((chr, ci) => {
            const matched = spans.some(([s, e]) => ci >= s && ci < e);
            if (matched) {
              const m = document.createElement("span");
              m.className = "pmenu-match";
              m.textContent = chr;
              rowEl.appendChild(m);
            } else {
              rowEl.appendChild(document.createTextNode(chr));
            }
          });
          const pad = listW - chars.length;
          if (pad > 0) rowEl.appendChild(document.createTextNode(" ".repeat(pad)));
        }
        listEls.push(rowEl);
      }
      // The cmdline wildmenu floats above its input, so flip the list to keep the best
      // match (row 0) at the BOTTOM, nearest the command cursor — the mirror of a
      // below-cursor completion popup (matches the cell-grid clients).
      if (menu.cmdline) listEls.reverse();
      for (const el of listEls) box.appendChild(el);
      gridEl.appendChild(box);

      // The preview column: a separate panel to the right of the list, with a header
      // row (the file path) and the windowed file lines, the match line (`loc`)
      // background-highlighted. Plain text in Phase 3a (no syntax colours yet).
      if (hasPreview) {
        const pv = menu.preview;
        const pre = document.createElement("div");
        pre.className = "pmenu";
        pre.style.borderLeftWidth = "1px";
        place(pre, x + listW + 1, y, previewW, listRows + promptRows);
        const header = document.createElement("div");
        header.className = "row pmenu-sel";
        header.style.width = previewW * cw + "px";
        header.textContent = String(pv.title ?? "").slice(0, previewW).padEnd(previewW);
        pre.appendChild(header);
        const lines = pv.lines || [];
        const loc = pv.loc; // [row, col] (relative to lines[0]) or null
        for (let i = 0; i < menu.height - 1; i++) {
          const rowEl = document.createElement("div");
          const isLoc = loc && loc[0] === i;
          rowEl.className = "row" + (isLoc ? " pmenu-sel" : "");
          rowEl.style.width = previewW * cw + "px";
          // Colour each char by its tree-sitter span (Phase 3b) via the same
          // `cellBaseCss` the window text uses (no diagnostics in a preview); empty
          // highlights (no grammar / wasm engine) render plain.
          const hlSpans = (pv.highlights && pv.highlights[i]) || [];
          const chars = [...String(lines[i] ?? "")].slice(0, previewW);
          chars.forEach((chr, ci) => {
            const css = cellBaseCss(ci, hlSpans, []);
            if (css) {
              const sp = document.createElement("span");
              sp.setAttribute("style", css);
              sp.textContent = chr;
              rowEl.appendChild(sp);
            } else {
              rowEl.appendChild(document.createTextNode(chr));
            }
          });
          const pad = previewW - chars.length;
          if (pad > 0) rowEl.appendChild(document.createTextNode(" ".repeat(pad)));
          pre.appendChild(rowEl);
        }
        gridEl.appendChild(pre);
      }

      // The docs sidebar (cmdline-completion Phase 3 / insert-completion docs): a
      // separate bordered float beside the box with the highlighted row's docs. The
      // server placed it (right of the box, flipping left for room) and bottom-aligned
      // it; geometry is text-area-absolute (the same `rect`-relative convention the box
      // uses), so it renders directly — the wildmenu is text-area-placed here, not
      // grown from a `cmd_area` like the cell-grid clients.
      if (menu.docs) {
        const d = menu.docs;
        const docBox = document.createElement("div");
        docBox.className = "pmenu-doc";
        place(docBox, rect.x + d.col, tablineRows + rect.y + d.row + cmdShift, d.width, d.height);
        for (const l of d.lines) {
          const rowEl = document.createElement("div");
          rowEl.className = "row";
          rowEl.style.width = d.width * cw + "px";
          rowEl.textContent = String(l ?? "").slice(0, d.width).padEnd(d.width);
          docBox.appendChild(rowEl);
        }
        gridEl.appendChild(docBox);
      }
    }

    // A synthesized status line (the wasm build emits no %-format statusline segments
    // for laststatus modes 1/2): MODE  filename [+]            line,col
    function renderStatus(box, w, atRow) {
      const name = w.unnamed ? "[No Name]" : (w.file_name || "[No Name]");
      const mod = w.modified ? " [+]" : "";
      const modeTag = view.mode ? view.mode + "  " : "";
      const left = `${modeTag}${name}${mod}`;
      const right = `${w.cursor_line},${w.cursor_col + 1}`;
      const width = winRect(w).width;
      const pad = Math.max(1, width - left.length - right.length - 1);
      const text = (" " + left + " ".repeat(pad) + right + " ").slice(0, width).padEnd(width);
      const el = document.createElement("div");
      el.className = "row statusline" + (w.focused ? " focused" : "");
      el.style.top = atRow * ch + "px";
      el.style.width = width * cw + "px";
      el.textContent = text;
      box.appendChild(el);
    }

    function renderSeparators(tablineRows) {
      for (const s of view.separators) {
        const o = regionOrigin(s.region, tablineRows);
        const el = document.createElement("div");
        el.className = "sep";
        if (s.vertical) {
          place(el, o.x + s.x, o.y + s.y, 1, s.length);
          el.textContent = Array(s.length).fill("│").join("\n");
          el.style.lineHeight = ch + "px";
        } else {
          place(el, o.x + s.x, o.y + s.y, s.length, 1);
          el.textContent = "─".repeat(s.length);
          el.style.lineHeight = ch + "px";
        }
        gridEl.appendChild(el);
      }
      // The border line between each open dock and the main area.
      const g = dockGeo(tablineRows);
      const sepLine = (x, y, wCells, hCells, glyph, vertical) => {
        const el = document.createElement("div");
        el.className = "sep";
        place(el, x, y, wCells, hCells);
        el.textContent = vertical ? Array(hCells).fill(glyph).join("\n") : glyph.repeat(wCells);
        el.style.lineHeight = ch + "px";
        gridEl.appendChild(el);
      };
      // Heavy box-drawing glyphs (━/┃) mark a permanent dock edge, distinct from
      // the light (─/│) borders between ordinary window splits drawn above.
      if (g.dt > 0) sepLine(0, g.dt, cols, 1, "━", false);
      if (g.db > 0) sepLine(0, g.midY + g.midH + g.globalStatusRows, cols, 1, "━", false);
      if (g.dl > 0) sepLine(g.dl, g.midY, 1, g.midH, "┃", true);
      if (g.dr > 0) sepLine(cols - g.dr - 1, g.midY, 1, g.midH, "┃", true);
    }
    function renderFloat(w, tablineRows, jsHl) {
      renderWindow(w, tablineRows, jsHl);
    }
    // Paint tabline cells (` ▸{count}{label}{+} `, the active cell marked) for a
    // `{ tabs, current }` at cell (x, y) spanning `width` cells, preceded by an
    // optional `title` label (the nx.dock dock title). Shared by the global (main)
    // tabline and each dock's own tabline.
    function renderTabCells(tabs, current, x, y, width, title) {
      const el = document.createElement("div");
      el.className = "row statusline";
      el.style.left = x * cw + "px";
      el.style.top = y * ch + "px";
      el.style.width = width * cw + "px";
      let s = title ? ` ${title} ` : "";
      tabs.forEach((t, i) => {
        const count = t.window_count > 1 ? t.window_count + " " : "";
        const mark = i === current ? "▸" : " ";
        s += ` ${mark}${count}${t.label}${t.modified ? "+" : ""} `;
      });
      el.textContent = s;
      gridEl.appendChild(el);
    }
    function renderTabline(y) {
      renderTabCells(view.tabline, view.current_tab, 0, y, cols, "");
    }
    // Each open dock paints its own tabline into its band's first row.
    function renderDockTablines(tablineRows) {
      const g = dockGeo(tablineRows);
      const bottomY = g.midY + g.midH + g.globalStatusRows + (g.bottomBand - g.db);
      const docks = [
        ["dock_top", 0, 0, cols],
        ["dock_bottom", 0, bottomY, cols],
        ["dock_left", 0, g.midY, g.dl],
        ["dock_right", cols - g.dr, g.midY, g.dr],
      ];
      for (const [region, x, y, width] of docks) {
        if (!dockTl(region, g)) continue;
        const rt = regionTabs(region);
        renderTabCells(rt.tabs, rt.current, x, y, width, rt.title || "");
      }
    }
    function renderCommand(cmdRow) {
      const el = document.createElement("div");
      el.className = "cmdline";
      el.style.top = cmdRow * ch + "px";
      el.style.width = cols * cw + "px";
      if (view.command_mode) {
        const prompt = view.cmdline_prompt || view.cmdline_prefix;
        const text = prompt + view.cmdline;
        const curIdx = [...prompt].length + view.cmdline_cursor;
        const chars = [...text];
        let html = "";
        for (let i = 0; i < chars.length; i++) {
          html += i === curIdx ? `<span class="cur-block">${escapeHtml(chars[i])}</span>` : escapeHtml(chars[i]);
        }
        if (curIdx >= chars.length) html += `<span class="cur-block"> </span>`;
        el.innerHTML = html;
      } else if (view.message) {
        el.textContent = view.message;
      } else if (view.hidden_docks && view.hidden_docks.length) {
        // Idle row: collapsed (hidden) docks shown as `▸{label}` chips — the only
        // hint a hidden dock exists; a click re-shows it (core's hidden_chip_at maps
        // the cell). Geometry mirrors the core hit-test: from col 0, space-separated.
        el.textContent = view.hidden_docks.map((l) => "▸" + l).join(" ");
      } else {
        el.textContent = "";
      }
      gridEl.appendChild(el);
    }
    function focusedWindow() { return (view.windows || []).find((w) => w.focused) || view.windows?.[0]; }
    function promptStr(frame) {
      return frame.cmdline_prompt && frame.cmdline_prompt.length ? frame.cmdline_prompt : frame.cmdline_prefix || "";
    }

    // ============================================================================
    // Keyboard → vim key-notation. Unlike nxvim-web (which has the shared nxvim-view
    // encoder as a synchronous FFI call), the Worker tick only takes vim notation, so
    // we encode the browser event to notation here and feed it.
    // ============================================================================
    const SPECIAL = {
      Enter: "CR", Escape: "Esc", Backspace: "BS", Tab: "Tab", Delete: "Del",
      ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down",
      Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
    };
    function keyToNotation(e) {
      let base = SPECIAL[e.key];
      const isSpecial = !!base;
      if (!base) {
        // With a Ctrl/Alt modifier read e.code so the BASE letter survives composition.
        if ((e.ctrlKey || e.altKey) && /^Key[A-Z]$/.test(e.code)) {
          const m = e.code.slice(3);
          base = e.shiftKey ? m : m.toLowerCase();
        } else if ((e.ctrlKey || e.altKey) && /^Digit\d$/.test(e.code)) {
          base = e.code.slice(5);
        } else if (e.key === " ") base = "Space";
        else if (e.key.length === 1) base = e.key === "<" ? "lt" : e.key;
        else return null; // bare modifier / unhandled key
      }
      const mods = [];
      if (e.ctrlKey) mods.push("C");
      // Shift is a standalone modifier only for *special* keys (`<S-Tab>`, `<S-Up>`);
      // for printable keys it's already folded into the character (Shift+a → "A"), and
      // a Ctrl/Alt+letter combo carries it via the capitalized base above — so without
      // this, Shift+Tab collapsed to a plain `<Tab>` and never sent the back-cycle.
      if (e.shiftKey && isSpecial) mods.push("S");
      if (e.altKey) mods.push("A");
      if (e.metaKey) mods.push("D");
      if (mods.length === 0) {
        if (isSpecial || base === "Space" || base === "lt") return `<${base}>`;
        return base;
      }
      return `<${mods.join("-")}-${base}>`;
    }

    // ============================================================================
    // Native file picker — the `:eo` / `:wo` / … family (mirrors nxvim-gui's rfd dialogs,
    // adapted to the browser's File System Access API). `<CR>` over one of these `:`
    // command lines opens the OS picker instead of running the command verbatim, then
    // drives the real open/save with the picked handle. The handle (not a path) is the
    // capability, so we register it under the file's name and `bind` that name; the
    // editor's off-tick read/write for the name then routes to the handle (worker.mjs).
    // ============================================================================

    // The base verb to run after the *open* picker, or null — ports nxvim-gui's
    // `open_dialog_verb`: the `…o` family + bare `:e`/`:edit` (an alias of `:eo`).
    function openDialogVerb(cmd) {
      switch (cmd) {
        case "e": case "ed": case "edi": case "edit": case "eo": return "e";
        case "spo": return "sp";
        case "vso": return "vs";
        case "tabeo": return "tabe";
        case "newo": return "new";
        case "vnewo": return "vnew";
        default: return null;
      }
    }
    // Whether `<CR>` should pop the *save* picker: `:wo` always, or a bare `:w`/`:write` on
    // an unnamed buffer (no file to write to). Ports nxvim-gui's `save_dialog_needed`.
    function saveDialogNeeded(cmd, unnamed) {
      if (cmd === "wo") return true;
      return unnamed && (cmd === "w" || cmd === "wr" || cmd === "wri" || cmd === "writ" || cmd === "write");
    }
    // Whether `<CR>` should pop the *Lua-source* picker: a bare `:luafile`/`:source`/`:luao`
    // (no path argument — the browser has no path the user could type, the picker supplies it).
    // The browser twin of `:luafile <file>`: pick a real local `.lua` and run it through the
    // live effects path, so the `examples/*/init.lua` configs can be loaded without a server.
    function luaDialogNeeded(cmd) {
      return cmd === "luafile" || cmd === "luao" || cmd === "source" || cmd === "so";
    }
    function focusedView() {
      const f = latest.frame;
      if (!f) return null;
      return (f.windows || []).find((w) => w.focused) || f.windows?.[0] || null;
    }
    function pickerUnavailable(what) {
      flashStatus(`${what}: this browser has no File System Access API (try Chrome/Edge)`, "#e06c75");
    }
    // Run an ex command by feeding `:<cmd><CR>` as key notation (the Worker tick takes
    // notation via nvim_input, not a direct nvim_command — so the `:` and `<CR>` are
    // required). A literal `<` in a filename would be read as notation, so escape it.
    function runExCommand(cmd) {
      return feedOp(`:${cmd.replace(/</g, "<lt>")}<CR>`);
    }

    // Decide *synchronously* (so the picker call stays inside the keystroke's user gesture)
    // whether `<CR>` over the current `:` command line should pop a file picker. Returns
    // true if it handled the `<CR>` (the caller then skips feeding it). Only `:`-prefixed.
    function tryFilePickerIntercept() {
      const f = latest.frame;
      if (!f || !f.command_mode) return false;
      const prefix = f.cmdline_prompt || f.cmdline_prefix || "";
      if (prefix !== ":") return false;
      const cmd = (f.cmdline || "").trim();
      const verb = openDialogVerb(cmd);
      if (verb) { startOpenPicker(verb); return true; }
      if (luaDialogNeeded(cmd)) { startLuaPicker(); return true; }
      const fw = focusedView();
      if (saveDialogNeeded(cmd, fw ? fw.unnamed : true)) { startSavePicker(fw); return true; }
      return false;
    }

    // Decide *synchronously* whether `<CR>` over a `:connect nxvim://…` command line should
    // dial a daemon instead of running an ex-command (there is none — the editor core knows
    // nothing of `:connect`). The browser twin of nxvim-gui's client-side `:connect`
    // interception: the UI owns the daemon transport, so it handles the command here and asks
    // the Worker to re-point the off-tick fs/watch seam onto the wire (`connectOp`). Only the
    // daemon's own `nxvim://` scheme is accepted; anything else is rejected loudly (fail loud,
    // matching nxvim-gui rejecting a mistyped `nvim://`). Returns true if it handled the `<CR>`.
    function tryConnectIntercept() {
      const f = latest.frame;
      if (!f || !f.command_mode) return false;
      const prefix = f.cmdline_prompt || f.cmdline_prefix || "";
      if (prefix !== ":") return false;
      const parts = (f.cmdline || "").trim().split(/\s+/);
      if (parts[0] !== "connect" && parts[0] !== "Connect") return false;
      feedOp("<Esc>"); // dismiss the command line regardless of the argument's validity
      const arg = parts[1] || "";
      if (!arg.startsWith("nxvim://")) {
        flashStatus(":connect needs an nxvim:// daemon URI", "#e06c75");
        return true;
      }
      connectOp(arg);
      flashStatus("connecting to daemon…");
      return true;
    }

    // Pop the open picker, then `:<verb> <name>` the chosen file. `<Esc>` first so the
    // half-typed `:eo` command line clears even if the user cancels the picker.
    function startOpenPicker(verb) {
      feedOp("<Esc>");
      if (!fsApiAvailable) { pickerUnavailable("open"); return; }
      self.showOpenFilePicker({ multiple: false }).then(async ([handle]) => {
        // Request write access up front (within the picker's activation) so a later bare
        // `:w` to this handle needs no fresh gesture; read-only is fine if declined.
        try { await handle.requestPermission?.({ mode: "readwrite" }); } catch {}
        const path = handle.name;
        fsHandles.set(path, handle);
        bindOp(path);
        runExCommand(`${verb} ${path}`);
      }).catch((e) => { if (e?.name !== "AbortError") flashStatus("open failed: " + (e?.message || e), "#e06c75"); });
    }

    // Pop the save picker, then `:w <name>` the buffer to the chosen file. nxvim's
    // `:w <path>` both writes *and* renames the buffer to that path, so the buffer becomes
    // bound to the real file and future bare `:w`s write straight back to it.
    function startSavePicker(fw) {
      feedOp("<Esc>");
      if (!fsApiAvailable) { pickerUnavailable("save"); return; }
      const opts = {};
      if (fw && !fw.unnamed && fw.file_name) opts.suggestedName = fw.file_name.split("/").pop();
      self.showSaveFilePicker(opts).then((handle) => {
        const path = handle.name;
        fsHandles.set(path, handle);
        bindOp(path);
        runExCommand(`w ${path}`);
      }).catch((e) => { if (e?.name !== "AbortError") flashStatus("save failed: " + (e?.message || e), "#e06c75"); });
    }

    // Pop the open picker for a `.lua` file, then run it through the live effects path
    // (`execLuaOp`), exactly as a `:lua` chunk from the keystroke tick would — the browser
    // twin of `:luafile <file>`. Unlike `startOpenPicker`, the file is *executed*, not opened
    // into a buffer, and the handle is not bound (no buffer references it). This is how the
    // `examples/*/init.lua` configs are loaded without a server; a single self-contained file
    // (its `require`s of further modules won't resolve — the browser runtimepath is empty),
    // and it runs *after* boot, so autocmds it registers fire only on subsequent events, not
    // retroactively for the already-open buffer.
    function startLuaPicker() {
      feedOp("<Esc>"); // clear the half-typed `:luafile` command line, even on cancel
      if (!fsApiAvailable) { pickerUnavailable("source"); return; }
      const opts = {
        multiple: false,
        types: [{ description: "Lua", accept: { "text/x-lua": [".lua"] } }],
      };
      self.showOpenFilePicker(opts).then(async ([handle]) => {
        const res = await realFsRead(handle); // { kind: 0, bytes } | { kind: 3, text }
        if (res.kind !== 0 || !res.bytes) {
          flashStatus(`source ${handle.name}: ${res.text || "read failed"}`, "#e06c75");
          return;
        }
        const code = new TextDecoder().decode(res.bytes); // Lua source is UTF-8
        // execLuaOp resolves with { frame, lines, result }; result is "ok:…" / "err:…".
        const rendered = (await execLuaOp(code))?.result;
        if (typeof rendered === "string" && rendered.startsWith("err:")) {
          flashStatus(`source ${handle.name}: ${rendered.slice(4)}`, "#e06c75");
        } else {
          flashStatus(`sourced ${handle.name}`, "#98c379");
        }
      }).catch((e) => { if (e?.name !== "AbortError") flashStatus("source failed: " + (e?.message || e), "#e06c75"); });
    }

    // Read a bound file's real bytes for the Worker (off-tick `:e`): { kind, bytes } where
    // kind 0 = file contents (RAW bytes, so the Worker's encoding seam decodes them — never
    // `.text()`, which would mangle non-UTF-8), 3 = error (per eh_fs_read_complete's contract).
    async function realFsRead(handle) {
      try {
        const file = await handle.getFile();
        return { kind: 0, bytes: new Uint8Array(await file.arrayBuffer()) };
      } catch (e) { return { kind: 3, text: String(e?.message || e) }; }
    }
    // Write the Worker's snapshot bytes to a bound file (off-tick `:w`): { ok, size, error }.
    async function realFsWrite(handle, bytes) {
      try {
        if (handle.requestPermission) {
          const perm = await handle.requestPermission({ mode: "readwrite" });
          if (perm !== "granted") return { ok: false, error: "write permission denied" };
        }
        const w = await handle.createWritable();
        await w.write(bytes);
        await w.close();
        return { ok: true, size: bytes.byteLength };
      } catch (e) { return { ok: false, error: String(e?.message || e) }; }
    }

    kbdEl.addEventListener("keydown", (e) => {
      if (e.key === "F5" || e.key === "F12") return;
      if (e.metaKey && !e.ctrlKey) return; // leave browser Cmd-shortcuts alone
      const n = keyToNotation(e);
      if (n == null) return;
      e.preventDefault();
      // `<CR>` over a `:connect nxvim://…` command line dials a daemon instead of feeding the
      // key (a client affordance — the editor core has no `:connect`).
      if (n === "<CR>" && tryConnectIntercept()) return;
      // `<CR>` over a `:eo`/`:wo`/… command line opens the native picker instead of feeding
      // the key (the picker must fire synchronously here to keep the user gesture).
      if (n === "<CR>" && tryFilePickerIntercept()) return;
      feedOp(n);
    });

    // ============================================================================
    // Mouse. Core owns the hit-test from a global screen cell to a window + buffer
    // position, multi-click word/line selection, drag-select, and wheel scroll — the
    // page only forwards the raw cell, exactly as the TUI/GUI forward nvim_input_mouse.
    // ============================================================================
    const BTN = { 0: "left", 1: "middle", 2: "right" };
    let dragBtn = null;
    // Cell of the last drag (seeded by the press), so within-cell pointer motion is
    // coalesced away: the core works in cells, and a same-cell drag right after a
    // press would spuriously enter Visual mode. The browser fires `mousemove` for
    // every sub-cell pixel (a click that wobbles, a touchpad tap-and-move), so
    // without this every casual click drops into VISUAL. Mirrors nxvim-gui's
    // `last_drag_cell` coalescing (see crates/nxvim-gui/src/lib.rs `mouse_drag`).
    let lastDragCell = null;
    function cellAt(e) {
      const r = gridEl.getBoundingClientRect();
      return {
        col: Math.max(0, Math.floor((e.clientX - r.left) / cw)),
        row: Math.max(0, Math.floor((e.clientY - r.top) / ch)),
      };
    }
    function mods(e) { return (e.ctrlKey ? "C" : "") + (e.shiftKey ? "S" : "") + (e.altKey ? "A" : ""); }

    // Whether the cell (row, col) is over a draggable separator — a window-split
    // divider, a status row above one, or a dock band edge — and which way it
    // resizes ("col"/"row"/null). Mirrors nxvim-view's `resize_handle_at` (and the
    // server's hit-test) on the client `view`, so a hover shows a resize cursor
    // without a round-trip. Reuses the same `dockGeo`/`regionOrigin` the renderer
    // uses to place the regions, run backwards from a cell.
    function resizeHandleAt(row, col) {
      if (!view || !view.windows) return null;
      const hasTabline = serverStyled
        ? (view.tabline_segments?.length || view.tabline.length)
        : view.tabline.length;
      const tablineRows = hasTabline ? 1 : 0;
      const g = dockGeo(tablineRows);
      const res = (n) => (n > 0 ? n + 1 : 0);
      // Dock band edges sit between a dock and the main area.
      const inMid = row >= g.midY && row < g.midY + g.midH;
      if (g.dl > 0 && inMid && col === g.dl) return "col";
      if (g.dr > 0 && inMid && col === cols - res(g.dr)) return "col";
      if (g.dt > 0 && col < cols && row === g.dt) return "row";
      if (g.db > 0 && col < cols && row === editorRows - res(g.db)) return "row";
      // Split separators (and the status row one cell above a horizontal one).
      for (const s of (view.separators || [])) {
        const o = regionOrigin(s.region, tablineRows);
        if (s.vertical) {
          if (col === o.x + s.x && row >= o.y + s.y && row < o.y + s.y + s.length) return "col";
        } else {
          const sy = o.y + s.y;
          const inX = col >= o.x + s.x && col < o.x + s.x + s.length;
          if (inX && (row === sy || row + 1 === sy)) return "row";
        }
      }
      return null;
    }
    // Set the grid's hover cursor from the cell under the pointer (left as-is while
    // a drag is in progress — that keeps the cursor it grabbed with).
    function updateResizeCursor(e) {
      const { row, col } = cellAt(e);
      const h = resizeHandleAt(row, col);
      gridEl.style.cursor = h === "col" ? "col-resize" : h === "row" ? "row-resize" : "";
    }

    // Drag-select autoscroll: re-send the held drag on a timer while it sits in the
    // top/bottom band, since the browser fires no mousemove while the pointer is still.
    const AUTOSCROLL_MS = 40;
    let autoscrollCell = null, autoscrollTimer = null;
    function inScrollZone(row) { return row <= 0 || row + 2 >= editorRows + 1; }
    function armAutoscroll(row, col) {
      if (dragBtn === "left" && inScrollZone(row)) {
        autoscrollCell = { row, col };
        if (!autoscrollTimer) autoscrollTimer = setInterval(autoscrollTick, AUTOSCROLL_MS);
      } else {
        disarmAutoscroll();
      }
    }
    function disarmAutoscroll() {
      if (autoscrollTimer) { clearInterval(autoscrollTimer); autoscrollTimer = null; }
      autoscrollCell = null;
    }
    function autoscrollTick() {
      if (!dragBtn || !autoscrollCell) { disarmAutoscroll(); return; }
      mouseOp("left", "drag", "", autoscrollCell.row, autoscrollCell.col);
    }

    gridEl.addEventListener("mousedown", (e) => {
      focusInput();
      const button = BTN[e.button];
      if (!button) return;
      e.preventDefault();
      disarmAutoscroll();
      const { row, col } = cellAt(e);
      if (button === "left") { dragBtn = "left"; lastDragCell = { row, col }; }
      mouseOp(button, "press", mods(e), row, col);
    });
    gridEl.addEventListener("mousemove", (e) => {
      if (!dragBtn) { updateResizeCursor(e); return; }
      const { row, col } = cellAt(e);
      // Only a drag into a *new* cell is meaningful; within-cell jitter is noise and
      // must not emit a drag (which the core would read as the start of a selection).
      if (lastDragCell && lastDragCell.row === row && lastDragCell.col === col) return;
      lastDragCell = { row, col };
      mouseOp(dragBtn, "drag", mods(e), row, col);
      armAutoscroll(row, col);
    });
    window.addEventListener("mouseup", (e) => {
      if (!dragBtn) return;
      disarmAutoscroll();
      const { row, col } = cellAt(e);
      mouseOp(dragBtn, "release", mods(e), row, col);
      dragBtn = null;
      lastDragCell = null;
    });
    // Release the drag latch if focus is stolen mid-press. A `mousedown` arms `dragBtn`; the
    // matching `mouseup` clears it — but if the OS clipboard-read permission chip, an alert, or
    // an alt-tab grabs focus in between, that `mouseup` never reaches the page and the button
    // stays latched, so every later `mousemove` re-enters Visual ("the button is stuck down").
    // Clearing on `blur` (and `release` the core's drag) makes the latch self-healing.
    window.addEventListener("blur", () => {
      if (!dragBtn) return;
      disarmAutoscroll();
      if (lastDragCell) mouseOp(dragBtn, "release", "", lastDragCell.row, lastDragCell.col);
      dragBtn = null;
      lastDragCell = null;
    });

    // Wheel → whole-line notches. The browser fires many sub-line wheel events per
    // physical scroll; accumulate the fractional remainder so a slow drag still scrolls
    // one row at a time and a flung wheel doesn't fly. Mirrors WebEditor::wheel /
    // nxvim-gui's drain_notches; emitted as nvim_input_mouse wheel gestures.
    let wheelAccumX = 0, wheelAccumY = 0;
    function drainNotches(amount, axis) {
      if (axis === "y") { wheelAccumY += amount; const w = Math.trunc(wheelAccumY); wheelAccumY -= w; return w; }
      wheelAccumX += amount; const w = Math.trunc(wheelAccumX); wheelAccumX -= w; return w;
    }
    gridEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const { row, col } = cellAt(e);
      const m = mods(e);
      let lx, ly;
      if (e.deltaMode === 1) { lx = e.deltaX; ly = e.deltaY; }                       // line units
      else if (e.deltaMode === 2) { lx = e.deltaX * Math.max(1, cols); ly = e.deltaY * Math.max(1, editorRows); } // page
      else { lx = e.deltaX / Math.max(1, cw); ly = e.deltaY / Math.max(1, ch); }     // pixels
      const MAX = 10;
      const vn = drainNotches(ly, "y");
      if (vn !== 0) { const a = vn > 0 ? "down" : "up"; for (let i = 0; i < Math.min(Math.abs(vn), MAX); i++) mouseOp("wheel", a, m, row, col); }
      const hn = drainNotches(lx, "x");
      if (hn !== 0) { const a = hn > 0 ? "right" : "left"; for (let i = 0; i < Math.min(Math.abs(hn), MAX); i++) mouseOp("wheel", a, m, row, col); }
    }, { passive: false });
    gridEl.addEventListener("contextmenu", (e) => e.preventDefault());

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { layout(); attachOp(cols, editorRows); }, 80);
    });

    // Persist cross-session (shada) state when the tab is hidden/closed. Best-effort: an
    // async OPFS write may not finish on a hard close, but the Worker's debounced checkpoint
    // already captured the bulk during editing — this mainly stamps the exit cursor (`'0`).
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") requestShadaFlush();
      else refreshClipboard(); // tab re-shown — pick up a copy made while we were away
    });
    // Refresh the `"+`/`"*` read mirror whenever the editor (re)gains focus — switching back
    // from another app/tab is the moment an external copy needs to become visible to `"+p`.
    window.addEventListener("focus", refreshClipboard);
    kbdEl.addEventListener("focus", refreshClipboard);
    // The OS paste gesture (Cmd/Ctrl+V, Edit▸Paste, middle-click) lands on the editable input
    // proxy (a plain <div> never gets `paste` in Firefox) — the direct, no-permission-chip path
    // to paste, so the user never has to coax the clipboard awake. Re-focus afterwards in case
    // the gesture (e.g. the Edit menu) moved focus away, and clear any text the browser slipped
    // into the textarea before `onPaste`'s preventDefault could fire.
    kbdEl.addEventListener("paste", (e) => { onPaste(e); kbdEl.value = ""; focusInput(); });

    // ============================================================================
    // Boot: measure, create the highlighter, then let the Worker's "ready" attach.
    // ============================================================================
    measureCell();
    layout();
    ts = createHighlighter ? createHighlighter({ onReady: tsRefresh }) : null;

    // The automation hook (Playwright / verify.mjs). `feed`/`mouse`/`execLua`/`attach`
    // resolve once the Worker has ticked and the frame rendered; `lines`/`frame`/`cursor`
    // read the latest rendered state synchronously.
    window.__nxvim = {
      ready: readyPromise,
      sab: useSAB,
      feed: (notation) => feedOp(notation),
      type: (notation) => feedOp(notation),
      // Press Enter *through* the client-side interceptions (the keydown path), so a
      // `:connect nxvim://…` dials a daemon and a `:eo`/`:wo`/… command line pops the picker.
      // Plain `feed("<CR>")` bypasses both.
      pressEnter: () =>
        tryConnectIntercept()
          ? Promise.resolve({ intercepted: "connect" })
          : tryFilePickerIntercept()
            ? Promise.resolve({ intercepted: true })
            : feedOp("<CR>"),
      // Flush cross-session (shada) state to OPFS now (resolves when written) — the tab-hide
      // path, exposed for tests so they can persist + reload without racing the debounce.
      shadaFlush: () => requestShadaFlush(),
      // Re-read the OS clipboard into the `"+`/`"*` mirror now (resolves once pushed). The
      // focus/visibility triggers do this in normal use; exposed so a test can prime an
      // external copy deterministically before a `"+p`.
      clipboardRefresh: () => refreshClipboard(),
      mouse: (button, action, modifier, row, col) => mouseOp(button, action, modifier, row | 0, col | 0),
      // Cell size in CSS px, so a test can drive *real* DOM mouse events (the
      // mousedown/mousemove/mouseup path, not the `mouse` hook) at sub-cell precision.
      cellMetrics: () => ({ cw, ch }),
      execLua: (code) => execLuaOp(code),
      attach: (c, r) => attachOp(c, r),
      lines: () => latest.lines,
      frame: () => latest.frame,
      cursor: () => {
        const fw = (latest.frame?.windows || []).find((w) => w.focused);
        return fw ? { row: fw.cursor_row, col: fw.cursor_col, screenCol: fw.cursor_screen_col } : null;
      },
      mode: () => latest.frame?.mode_label ?? "",
      cmdline: () => (latest.frame?.command_mode ? promptStr(latest.frame) + latest.frame.cmdline : ""),
      message: () => latest.frame?.message ?? "",
    };
  </script>
</body>
</html>
