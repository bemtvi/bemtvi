<!doctype html>
<!--
  nxvim — wasm edit-host (the in-browser editor, Phase 5/6).

  The editor core + Lua + OPFS filesystem run in a Web Worker (worker.mjs, the single
  `!Send` thread). THIS file is the renderer + input layer: it ferries keystrokes and
  mouse gestures to the Worker as vim key-notation / nvim_input_mouse, reads the `redraw`
  frame the Worker posts back (the server's own `View` projection), and paints it as
  HTML/CSS — the same DOM renderer the serverless `nxvim-web` build uses, adapted to the
  Worker's async transport. Syntax highlighting is layered client-side via web-tree-sitter
  (highlight.js), since the wasm build omits the native treesitter engine. Transport is a
  SharedArrayBuffer park (slice 5d) when the page is cross-origin isolated, else
  postMessage (slice 5c); both expose the same feed/mouse/execLua/attach ops + the
  `window.__nxvim` automation hook.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>nxvim — wasm edit-host</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #1e2127; --fg: #abb2bf; --gutter: #4b5263; --gutter-cur: #e5c07b;
    --sel: #3e4451; --search: #e5c07b; --status-bg: #2c313a; --status-fg: #9da5b4;
    --cursor: #61afef; --eob: #4b5263; --accent: #e5c07b; --cursorline: #2c313a;
    --colorcolumn: #2c313a;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #grid {
    position: absolute; inset: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Symbols Nerd Font Mono", monospace;
    white-space: pre; color: var(--fg); background: var(--bg); overflow: hidden; outline: none;
  }
  #grid .row { position: absolute; left: 0; height: var(--ch); line-height: var(--ch); }
  /* `'colorcolumn'`: a thin vertical ruler down the text body, painted behind the
     text rows (which draw on top) so glyphs sit over the tint — the column analogue
     of the per-row `--cursorline` tint. */
  .colorcolumn { position: absolute; top: 0; background: var(--colorcolumn); }
  .win { position: absolute; overflow: hidden; }
  /* A floating window's opaque chrome box (blocks the tiled windows beneath). */
  .float-win { background: #21252b; }
  .gutter { color: var(--gutter); }
  .gutter-cur { color: var(--gutter-cur); }
  .eob { color: var(--eob); }
  .sel { background: var(--sel); }
  .search { background: var(--search); color: #1e2127; }
  .incsearch { background: #ffd866; color: #1e2127; }
  .statusline { background: var(--status-bg); color: var(--status-fg); }
  .statusline.focused { color: #e6e6e6; }
  /* A status / tabline bar paints in two stacked layers — all segment backgrounds
     first, then all glyph text on top — so an over-wide glyph (a powerline separator,
     a Nerd icon) overhangs into its neighbour like it should, instead of being
     overpainted by the next segment's opaque background (the GUI's bg-then-fg passes). */
  .sl-layer { position: absolute; left: 0; top: 0; height: 100%; white-space: pre; }
  /* The split/dock separator: the `WinSeparator` glyph (`--win-sep`, falling back to
     the gutter colour) on the editor background (`--bg`) so the cell tracks the theme
     rather than a hardcoded dark strip that stays dark under a light colorscheme. */
  .sep { background: var(--bg, #181a1f); color: var(--win-sep, var(--gutter)); position: absolute; }
  /* Cursor shapes. Block reverses the cell; bar/underline are thin overlays. */
  .cur-block { background: var(--cursor); color: var(--bg); }
  .cur-bar { box-shadow: inset 2px 0 0 0 var(--cursor); }
  .cur-underline { box-shadow: inset 0 -2px 0 0 var(--cursor); }
  /* Multi-cursor: placed cursors are reverse-video; the active one is amber. */
  .seccur { background: #d7dae0; color: #1e2127; }
  .cur-mc { background: var(--accent); color: #1e2127; font-weight: 700; }
  .cmdline { position: absolute; left: 0; height: var(--ch); line-height: var(--ch); color: var(--fg); }
  .diag-underline { text-decoration: underline wavy; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .inlay { color: #5c6370; font-style: italic; }
  .pmenu { position: absolute; background: #21252b; z-index: 10; white-space: pre; }
  /* The opaque chrome box behind a popup, carrying its box-drawing glyph border. */
  .popup-chrome { position: absolute; background: #21252b; z-index: 10; white-space: pre; }
  /* `#grid`-scoped so these beat `#grid .row` (line above), whose `position:absolute`
     would otherwise win on ID specificity and collapse every popup row to the box top
     (`top:auto`) — leaving the items overlaid instead of stacked down the float. */
  #grid .pmenu .row { position: static; height: var(--ch); line-height: var(--ch); }
  /* Box-drawing border glyphs + title for content floats (nx.ui.float). */
  .float-border { color: #5c6370; }
  .float-title { color: var(--fg); }
  .pmenu-sel { background: var(--sel); color: #e6e6e6; }
  .pmenu-match { color: #e5c07b; font-weight: bold; }
  .pmenu-prompt { color: #abb2bf; }
  /* The right-aligned completion kind column ("Snippet", "Function", …): dimmed so
     it recedes behind the label. Overridden inline when the theme carries a fg. */
  .pmenu-kind { opacity: 0.6; }
  .pmenu-doc { position: absolute; background: #21252b; z-index: 10; white-space: pre; color: var(--status-fg); }
  #grid .pmenu-doc .row { position: static; height: var(--ch); line-height: var(--ch); }
  /* A tiny boot/transport indicator, hidden shortly after the first frame. */
  #status { position: fixed; right: 6px; bottom: 4px; font-size: 11px; opacity: .4;
            color: #5c6370; pointer-events: none; z-index: 5; }
  /* Input proxy. The grid is a non-editable <div>, and Firefox only fires
     `paste`/`copy`/`cut` on an *editable* focused element — so the real keyboard + clipboard
     target is this always-focused textarea (the xterm.js "helper textarea" pattern).
     `positionImeProxy` parks it over the cursor cell each frame so a macOS / CJK IME
     composition popup (and the press-and-hold accent menu) anchors to the cursor — both
     follow the focused element's caret. It must be VISIBLE to the OS text-input system to
     get a real caret rect, so it can't use `opacity:0`/`z-index:-1`: an invisible or
     grid-occluded element makes Chrome suppress the IME popup and fall the accent menu back
     to the viewport origin (the top-left bug). Instead it sits ABOVE the grid and is hidden
     by transparent text/caret/background; `pointer-events:none` keeps it from stealing the
     mouse. Font metrics match the grid so the caret rect is one cell tall. `position:
     absolute` (NOT `fixed`): Chrome miscomputes the IME / accent-menu anchor rect for a
     `fixed` element and pins the popup near the viewport origin, while Firefox handles it —
     real editors (CodeMirror/ProseMirror) all use absolute. The page never scrolls (body is
     `overflow:hidden;height:100%`), so absolute coords equal the viewport coords
     `positionImeProxy` reads from `getBoundingClientRect`. */
  #kbd { position: absolute; top: 0; left: 0; width: 1px; height: 1px; padding: 0; margin: 0;
         border: 0; outline: none; resize: none; overflow: hidden; z-index: 50;
         pointer-events: none; background: transparent; color: transparent;
         caret-color: transparent; white-space: pre; font-size: 15px; line-height: 21px;
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Symbols Nerd Font Mono", monospace; }
  /* EditContext host (Chrome IME path). Its CSS position is irrelevant — the IME caret is
     placed from the bounds we report via `updateSelectionBounds`, not the element's layout —
     so it just needs to be focusable and out of the way. */
  #ime { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0;
         pointer-events: none; overflow: hidden; outline: none; }
</style>
</head>
<body>
  <div id="grid" tabindex="0"></div>
  <textarea id="kbd" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>
  <div id="status">booting…</div>

  <script type="module">
    // Syntax highlighting is optional: highlight.js statically imports the
    // web-tree-sitter vendor assets (built by build.sh → npm run build:treesitter).
    // When those aren't present the import fails — degrade to plain (un-highlighted)
    // rendering rather than breaking the whole page.
    let createHighlighter = null, colorFor = () => null, setHlTheme = () => {};
    try {
      ({ createHighlighter, colorFor, setHlTheme } = await import("./highlight.js"));
    } catch (e) {
      console.warn("nxvim: syntax highlighting unavailable (tree-sitter vendor not built):", e);
    }

    const FONT_PX = 15, LINE = 1.4;
    const gridEl = document.getElementById("grid");
    // The element that owns keyboard + clipboard focus. Focus it — never the grid — so
    // Firefox delivers `paste` events and every browser routes keydown here. It's invisible
    // to the user: the renderer draws its own cursor from the view, not from browser focus.
    const kbdEl = document.getElementById("kbd");

    // IME caret tracking. The OS positions the IME candidate window and the macOS
    // press-and-hold accent menu at the *focused element's* caret. Parking a hidden textarea
    // over the drawn cursor is enough for Firefox (it re-queries the textarea's layout live),
    // but NOT for Chrome: Chrome reports caret bounds to the OS only when the text/selection
    // changes, not when the element is moved by CSS, so the popup stays pinned to the
    // textarea's focus-time origin (top-left). The EditContext API is the supported fix for
    // an editor that draws its own cursor — it lets us report the caret bounds explicitly
    // (`updateSelectionBounds`), independent of where the host element sits. When available
    // (Chrome 121+), route focus + keys to a bare <div> carrying an EditContext; Firefox
    // lacks EditContext and keeps using the textarea. `imeEl` is whichever owns focus.
    let editCtx = null;
    let imeEl = kbdEl;
    if ("EditContext" in window) {
      const ed = document.createElement("div");
      ed.id = "ime";
      ed.tabIndex = -1;
      ed.setAttribute("aria-hidden", "true");
      document.body.appendChild(ed);
      editCtx = new EditContext();
      ed.editContext = editCtx;
      imeEl = ed;
    }
    const focusInput = () => imeEl.focus();
    const statusEl = document.getElementById("status");

    let view = null;          // the latest redraw frame (the server's View map)
    let bufferText = "";      // the focused buffer's full text, for the highlighter
    // The full text of each *visible* buffer, keyed by file name, so a window that
    // isn't focused (e.g. the code window beneath an open `:messages` / panel split)
    // still gets highlighted — the Worker only ships the focused buffer's text, so we
    // remember the others here and pruned to what's on screen (see `setFrame`).
    const textByFile = new Map();
    let ts = null;            // tree-sitter highlighter (loaded lazily by language)
    let cw = 9, ch = 21;
    let cols = 80, editorRows = 24; // editorRows = grid rows minus the command row

    // ============================================================================
    // Cell metrics + grid size. The core lays windows out in `editorRows` (the
    // windows area); the command/message line is THIS client's own extra row, so we
    // attach `editorRows` and paint the command line at row `editorRows`. (Matching
    // the TUI client and core's `relayout`, which excludes the command row.)
    // ============================================================================
    function measureCell() {
      const probe = document.createElement("span");
      probe.style.cssText = `position:absolute;visibility:hidden;font-family:${getComputedStyle(gridEl).fontFamily};font-size:${FONT_PX}px;`;
      probe.textContent = "M".repeat(100);
      gridEl.appendChild(probe);
      cw = probe.getBoundingClientRect().width / 100;
      probe.remove();
      ch = Math.round(FONT_PX * LINE);
      gridEl.style.fontSize = FONT_PX + "px";
      gridEl.style.setProperty("--ch", ch + "px");
    }
    function layout() {
      const rect = gridEl.getBoundingClientRect();
      cols = Math.max(20, Math.floor(rect.width / cw));
      const totalRows = Math.max(4, Math.floor(rect.height / ch));
      editorRows = totalRows - 1; // reserve the command row, like the TUI client
    }
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => (c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;"));
    }

    // Shorten `s` to at most `width` chars, keeping its head and tail and dropping the
    // middle behind a single `…` when it won't fit — so a too-long preview path shows
    // both its root and its filename instead of just the start. Codepoint-based (the
    // `[...s]` spread) to match the server / native clients, not UTF-16 `.slice`.
    function elideMiddle(s, width) {
      const chars = [...s];
      if (chars.length <= width) return s;
      if (width <= 1) return chars.slice(0, width).join("");
      const keep = width - 1; // one column for the `…`
      const front = keep >> 1; // favour the tail (filename) with the larger half
      const back = keep - front;
      return chars.slice(0, front).join("") + "…" + chars.slice(chars.length - back).join("");
    }

    // Truncate a picker row `label` to `width` columns while keeping the file name (the
    // path tail) visible: when a path overflows the row, drop whole leading directory
    // components behind a single `…` so the file name survives, instead of the head-cut
    // that would hide the very thing you scan for. `spans` (matched-char char ranges)
    // are remapped onto the returned string so highlights stay aligned. A row that fits
    // is returned unchanged; a non-path row (no `/`) keeps its HEAD — the identifier you
    // scan for — behind a trailing `…`, so a truncated completion candidate reads as
    // truncated. Mirrors the native clients' `elide_keep_tail`; codepoint-based to match
    // the server's char columns.
    function elideKeepTail(label, spans, width) {
      const chars = [...label];
      const n = chars.length;
      if (n <= width || width === 0) return [label, spans];
      if (label.indexOf("/") === -1) {
        // Head-priority: keep the first `width - 1` chars, spend the last column on the
        // `…`, and clip the spans to what survives.
        const keep = width - 1;
        const out = chars.slice(0, keep).join("") + "…";
        const clipped = [];
        for (const [s, e] of spans) {
          const ne = Math.min(e, keep);
          if (s < ne) clipped.push([s, ne]);
        }
        return [out, clipped];
      }
      // Reserve one column for the leading `…`; keep at most the last `width - 1` chars.
      const drop = n - (width - 1);
      // Prefer a clean cut just after a path separator — the smallest `/`-boundary at or
      // past `drop` keeps the most directory context that still fits. None ⇒ raw cut.
      let cut = drop;
      for (let i = drop; i < n; i++) {
        if (chars[i - 1] === "/") { cut = i; break; }
      }
      const out = "…" + chars.slice(cut).join("");
      // Remap spans: original index `i` (≥ cut) renders at display index `i - cut + 1`
      // (the `…` occupies index 0). A span wholly inside the dropped prefix vanishes.
      const shift = cut - 1;
      const remapped = [];
      for (const [s, e] of spans) {
        const ns = Math.max(s, cut) - shift;
        const ne = Math.min(e, n) - shift;
        if (ns < ne) remapped.push([ns, ne]);
      }
      return [out, remapped];
    }

    // The shared head-column width for a frame of two-column picker rows: the widest
    // visible head, capped at 40% of the list so a long path can never squeeze the body
    // out. Mirrors the native clients' `row_head_col`.
    function rowHeadCol(maxHead, width) {
      return Math.max(1, Math.min(maxHead, Math.max(1, Math.floor((width * 2) / 5))));
    }

    // Fit one picker row into `width` cells honoring an optional two-column `layout`
    // — `[head, matchStart, matchEnd]` char offsets into the label: the length of the
    // location column (`src/foo.rs:12:5: `) and the source's own match. The head is
    // padded (or `…`-elided keeping its tail) to `headCol` so bodies align, and the
    // body is windowed around the match so a hit far into a long line stays on screen;
    // the match joins `spans` so it highlights like a fuzzy hit. No layout ⇒ plain
    // `elideKeepTail`. Mirrors the native clients' `fit_row`.
    function fitRow(label, spans, width, layout, headCol) {
      if (!layout) return elideKeepTail(label, spans, width);
      if (width === 0) return ["", []];
      const [matchStart, matchEnd] = [layout[1], layout[2]];
      const chars = [...label];
      const n = chars.length;
      const head = Math.min(layout[0], n);
      // Each chunk maps a run of source chars onto the output: `[outStart, srcStart,
      // len]`. The `…` markers and the head padding map to nothing, so a span over
      // dropped chars simply vanishes.
      let out = "";
      let used = 0;
      const chunks = [];
      const take = (src, len) => {
        chunks.push([used, src, len]);
        out += chars.slice(src, src + len).join("");
        used += len;
      };
      // Head column: the whole head when it fits, else its tail behind a `…`.
      const hc = Math.min(Math.max(headCol, 1), width);
      if (head <= hc) {
        take(0, head);
      } else {
        const drop = head - (hc - 1);
        let cut = drop;
        for (let i = drop; i < head; i++) {
          if (chars[i - 1] === "/") { cut = i; break; }
        }
        out += "…";
        used += 1;
        take(cut, head - cut);
      }
      if (head > 0 && head < n && used < hc) {
        out += " ".repeat(hc - used);
        used = hc;
      }
      // Body column: the rest of the row, windowed so the match stays visible.
      const bw = Math.max(0, width - used);
      if (bw > 0 && head < n) {
        const blen = n - head;
        const f = Math.min(Math.max(matchStart, head), n) - head;
        if (blen <= bw) {
          take(head, blen);
        } else {
          const lead = Math.min(Math.floor(bw / 5), f);
          const start = Math.min(f - lead, blen - (bw - 1));
          if (start === 0) {
            take(head, bw);
          } else {
            out += "…";
            used += 1;
            take(head + start, bw - 1);
          }
        }
      }
      const all = matchEnd > matchStart ? [...spans, [matchStart, matchEnd]] : spans;
      const remapped = [];
      for (const [s, e] of all) {
        for (const [outStart, srcStart, len] of chunks) {
          const ns = Math.max(s, srcStart);
          const ne = Math.min(e, srcStart + len);
          if (ns < ne) remapped.push([ns - srcStart + outStart, ne - srcStart + outStart]);
        }
      }
      return [out, remapped];
    }

    // Display width of a Unicode code point in screen cells (0 / 1 / 2), matching the
    // server EXACTLY. The server lays columns out with `unicode-width` (UAX #11), so the
    // DOM renderer must agree codepoint-for-codepoint or the cursor / selection / search /
    // highlight columns the server ships land on the wrong cell. These tables are GENERATED
    // from the same `unicode-width` crate version the server links (0.2.2) — see
    // `crates/nxvim-core/examples/dump_width.rs`; regenerate if that dep bumps. Control
    // chars never reach here: the server substitutes them into the line as `^X` / `<xx>`
    // ASCII tokens. WIDE_RANGES = width 2 (East Asian Wide / Fullwidth + emoji); ZERO_RANGES
    // = width 0 (combining marks, joiners, variation selectors, zero-width spaces).
    const WIDE_RANGES = [
      [0x1100, 0x115f], [0x17a4, 0x17a4], [0x231a, 0x231b], [0x2329, 0x232a], [0x23e9, 0x23ec], [0x23f0, 0x23f0],
      [0x23f3, 0x23f3], [0x25fd, 0x25fe], [0x2614, 0x2615], [0x2630, 0x2637], [0x2648, 0x2653], [0x267f, 0x267f],
      [0x268a, 0x268f], [0x2693, 0x2693], [0x26a1, 0x26a1], [0x26aa, 0x26ab], [0x26bd, 0x26be], [0x26c4, 0x26c5],
      [0x26ce, 0x26ce], [0x26d4, 0x26d4], [0x26ea, 0x26ea], [0x26f2, 0x26f3], [0x26f5, 0x26f5], [0x26fa, 0x26fa],
      [0x26fd, 0x26fd], [0x2705, 0x2705], [0x270a, 0x270b], [0x2728, 0x2728], [0x274c, 0x274c], [0x274e, 0x274e],
      [0x2753, 0x2755], [0x2757, 0x2757], [0x2795, 0x2797], [0x27b0, 0x27b0], [0x27bf, 0x27bf], [0x2b1b, 0x2b1c],
      [0x2b50, 0x2b50], [0x2b55, 0x2b55], [0x2e80, 0x2e99], [0x2e9b, 0x2ef3], [0x2f00, 0x2fd5], [0x2ff0, 0x3029],
      [0x3030, 0x303e], [0x3041, 0x3096], [0x309b, 0x30ff], [0x3105, 0x312f], [0x3131, 0x3163], [0x3165, 0x318e],
      [0x3190, 0x31e5], [0x31ef, 0x321e], [0x3220, 0x3247], [0x3250, 0xa48c], [0xa490, 0xa4c6], [0xa960, 0xa97c],
      [0xac00, 0xd7a3], [0xf900, 0xfaff], [0xfe10, 0xfe19], [0xfe30, 0xfe52], [0xfe54, 0xfe66], [0xfe68, 0xfe6b],
      [0xff01, 0xff60], [0xffe0, 0xffe6], [0x16fe0, 0x16fe3], [0x16ff2, 0x16ff6], [0x17000, 0x18cd5], [0x18cff, 0x18d1e],
      [0x18d80, 0x18df2], [0x1aff0, 0x1aff3], [0x1aff5, 0x1affb], [0x1affd, 0x1affe], [0x1b000, 0x1b122], [0x1b132, 0x1b132],
      [0x1b150, 0x1b152], [0x1b155, 0x1b155], [0x1b164, 0x1b167], [0x1b170, 0x1b2fb], [0x1d300, 0x1d356], [0x1d360, 0x1d376],
      [0x1f004, 0x1f004], [0x1f0cf, 0x1f0cf], [0x1f18e, 0x1f18e], [0x1f191, 0x1f19a], [0x1f200, 0x1f202], [0x1f210, 0x1f23b],
      [0x1f240, 0x1f248], [0x1f250, 0x1f251], [0x1f260, 0x1f265], [0x1f300, 0x1f320], [0x1f32d, 0x1f335], [0x1f337, 0x1f37c],
      [0x1f37e, 0x1f393], [0x1f3a0, 0x1f3ca], [0x1f3cf, 0x1f3d3], [0x1f3e0, 0x1f3f0], [0x1f3f4, 0x1f3f4], [0x1f3f8, 0x1f43e],
      [0x1f440, 0x1f440], [0x1f442, 0x1f4fc], [0x1f4ff, 0x1f53d], [0x1f54b, 0x1f54e], [0x1f550, 0x1f567], [0x1f57a, 0x1f57a],
      [0x1f595, 0x1f596], [0x1f5a4, 0x1f5a4], [0x1f5fb, 0x1f64f], [0x1f680, 0x1f6c5], [0x1f6cc, 0x1f6cc], [0x1f6d0, 0x1f6d2],
      [0x1f6d5, 0x1f6d8], [0x1f6dc, 0x1f6df], [0x1f6eb, 0x1f6ec], [0x1f6f4, 0x1f6fc], [0x1f7e0, 0x1f7eb], [0x1f7f0, 0x1f7f0],
      [0x1f90c, 0x1f93a], [0x1f93c, 0x1f945], [0x1f947, 0x1f9ff], [0x1fa70, 0x1fa7c], [0x1fa80, 0x1fa8a], [0x1fa8e, 0x1fac6],
      [0x1fac8, 0x1fac8], [0x1facd, 0x1fadc], [0x1fadf, 0x1faea], [0x1faef, 0x1faf8], [0x20000, 0x2fffd], [0x30000, 0x3fffd],
    ];

      wrU32(wp + 1, reqId);
      wrU32(wp + 5, payload.length);
      for (let i = 0; i < payload.length; i++) data[(wp + 9 + i) % dataCap] = payload[i];
      Atomics.store(ctrl, WRITE, (wp + 9 + payload.length) >>> 0);
      Atomics.add(ctrl, SEQ, 1);
      Atomics.notify(ctrl, SEQ, 1);
      return reqId;
    }
    const enc = (s) => new TextEncoder().encode(s);

    // The transport-agnostic ops the renderer + hook call.
    function feedOp(notation) {
      if (useSAB) return new Promise((r) => pendingAcks.set(pushFrame(0, enc(notation)), r));
      return sendMsg("feed", { notation });
    }
    function execLuaOp(code) {
      if (useSAB) return new Promise((r) => pendingResults.set(pushFrame(1, enc(code)), r));
      return sendMsg("exec_lua", { code });
    }
    function attachOp(c, r) {
      if (useSAB) {
        const payload = new Uint8Array(8);
        new DataView(payload.buffer).setUint32(0, c, true);
        new DataView(payload.buffer).setUint32(4, r, true);
        return new Promise((res) => pendingAcks.set(pushFrame(2, payload), res));
      }
      return sendMsg("attach", { cols: c, rows: r });
    }
    // A mouse gesture (nvim_input_mouse strings + a 0-based global screen cell).
    function mouseOp(button, action, modifier, row, col) {
      if (useSAB) {
        const payload = enc(JSON.stringify({ b: button, a: action, m: modifier, r: row, c: col }));
        return new Promise((res) => pendingAcks.set(pushFrame(3, payload), res));
      }
      return sendMsg("input_mouse", { button, action, modifier, row, col });
    }
    function sendMsg(type, extra) {
      const id = nextReqId++;
      return new Promise((resolve) => {
        pendingMsg.set(id, resolve);
        worker.postMessage({ id, type, ...extra });
      });
    }
    // Tell the Worker a path resolves to a real-FS handle. It must reach the Worker before
    // the `:e`/`:w` that references it: a ring frame under SAB (ordered with the feeds in
    // the same channel), a message under 5c (FIFO with the feed messages). Fire-and-forget.
    function bindOp(path) {
      if (useSAB) pushFrame(4, enc(path));
      else worker.postMessage({ type: "bind", path });
    }
    // Ask the Worker to dial a daemon at runtime (`:connect nxvim://…`) and re-point the
    // off-tick fs/watch seam from OPFS onto the wire — a ring frame under SAB (ordered after
    // the `<Esc>` feed that dismissed the command line), a message under 5c. Fire-and-forget;
    // the Worker reports the outcome with a `connected` message (flashed below). Ring type 7
    // (type 6 is `:TSInstall`'s `tsInstallResultOp` — keep these distinct).
    function connectOp(uri) {
      if (useSAB) pushFrame(7, enc(uri));
      else worker.postMessage({ type: "connect", uri });
    }
    // Ask the Worker to persist cross-session (shada) state now, with the exit cursor — a
    // ring frame under SAB, a message under 5c. Resolves when the Worker reports the write
    // (the `shada_written` message). Used on tab-hide and by the automation hook.
    const shadaWrittenWaiters = [];
    function requestShadaFlush() {
      if (useSAB) pushFrame(5, new Uint8Array(0));
      else worker.postMessage({ type: "shada_flush" });
      return new Promise((res) => shadaWrittenWaiters.push(res));
    }
    // Report a `:TSInstall` outcome back to the Worker (so the core echoes + records it) — a
    // ring type-6 frame under SAB, a message under 5c, matching `bind`/`shada_flush`.
    function tsInstallResultOp(lang, ok, msg) {
      if (useSAB) pushFrame(6, enc(JSON.stringify({ lang, ok, msg })));
      else worker.postMessage({ type: "ts_install_result", lang, ok, msg });
    }
    // Push the OS clipboard's text into the Worker's `"+`/`"*` read mirror — a ring type-8
    // frame under SAB (ordered with the feeds, so it lands before a following `"+p`), a
    // message under 5c. Fire-and-forget.
    function clipboardPushOp(text) {
      if (useSAB) pushFrame(8, enc(text));
      else worker.postMessage({ type: "clipboard_push", text });
    }

    // ---- nx.http.mount: the Service Worker relay ---------------------------
    //
    // A tab cannot bind a port, so where the native build runs a listener the web build runs
    // a Service Worker (nx-sw.js) that intercepts `/plugin/*` on this origin. The SW is a
    // third context and cannot reach the Worker that holds the wasm, so the window is the
    // relay: SW → here → the ring → the editor → back.
    //
    // The request rides a ring frame rather than a postMessage because the SAB run loop parks
    // on `Atomics.wait`; only the ring's SEQ bump can wake it. That is the whole reason this
    // path exists in this shape.
    const httpPorts = new Map(); // req_id → the MessagePort the SW is parked on
    let nextHttpReqId = 1;
    let swReady = null;          // memoized: one registration for every mount

    // Register the SW and resolve with the origin mounts are served from. Rejects loudly —
    // a plugin must learn its mount cannot be served rather than get a URL that would 404.
    function ensureServiceWorker() {
      if (swReady) return swReady;
      swReady = (async () => {
        if (!("serviceWorker" in navigator)) {
          throw new Error("this browser has no Service Worker support");
        }
        if (!self.isSecureContext) {
          // The real constraint, and a common own-goal: a plain http:// origin that is not
          // localhost gets no Service Worker at all, so mounts genuinely cannot be served.
          throw new Error("nx.http.mount needs a secure context (https:// or localhost)");
        }
        // Scope "/" so the SW covers /plugin/* even though this page is served from /web/.
        // Requires `Service-Worker-Allowed: /` on the script response (see serve.mjs).
        // Registered from the ROOT path, not from /web/ beside this page: a SW's scope
        // cannot rise above the path it was served from, and mounts live at /plugin/*.
        await navigator.serviceWorker.register("/nx-sw.js", { scope: "/" });
        await navigator.serviceWorker.ready;
        // `ready` means "there is an active worker", NOT "it controls this page" — on a first
        // visit the page loaded uncontrolled. The SW's clients.claim() fixes that, but until
        // it lands a mount fetch would bypass the SW and 404, so wait for it.
        if (!navigator.serviceWorker.controller) {
          await new Promise((res) =>
            navigator.serviceWorker.addEventListener("controllerchange", res, { once: true })
          );
        }
        return location.origin;
      })();
      return swReady;
    }

    // Answer the Worker's mount publication with the origin (or why there is none).
    function httpMountResultOp(id, ok, text) {
      const json = JSON.stringify({ id, ok, text });
      if (useSAB) pushFrame(10, enc(json));
      else worker.postMessage({ type: "http_mount_result", json });
    }

    // The SW hands each intercepted request here, with a MessagePort to answer on.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", (ev) => {
        const msg = ev.data;
        // "Are you the editor?" — answer yes. This is how the SW finds the window to relay
        // to WITHOUT guessing from focus: only a tab running this handler replies, so a tab
        // that is merely loading a mount page is never mistaken for the editor.
        if (msg && msg.type === "nx-edithost-probe" && ev.ports && ev.ports[0]) {
          ev.ports[0].postMessage({ nxEdithost: true });
          return;
        }
        if (!msg || msg.type !== "nx-http-request") return;
        const port = ev.ports && ev.ports[0];
        if (!port) return;
        const reqId = nextHttpReqId++;
        httpPorts.set(reqId, port);
        const json = JSON.stringify({ req_id: reqId, ...msg.request });
        if (useSAB) pushFrame(9, enc(json));
        else worker.postMessage({ type: "nx_http_request", json });
      });
    }
    // Refresh the editor's `"+`/`"*` read mirror from `navigator.clipboard`. The editor's
    // synchronous register read can't await the (async, Window-only) clipboard, so we push its
    // contents *ahead* of a paste — on focus / tab-return, when the document is focused and
    // clipboard-read permission holds — so a `"+p` sees a copy made in another app. (Not on a
    // plain click: `readText()` raises the browser's native "Paste" permission chip, which on
    // every click both nagged the user and stole focus mid-press → a stuck drag.) A copy
    // made *inside* nxvim needs no refresh: the yank already updated the mirror (and wrote out
    // to the OS clipboard). Best-effort: no permission / not focused leaves the mirror as-is.
    let clipboardRefreshing = false;
    async function refreshClipboard() {
      if (clipboardRefreshing || !navigator.clipboard?.readText) return;
      clipboardRefreshing = true;
      try { clipboardPushOp(await navigator.clipboard.readText()); }
      catch { /* permission denied / not focused / empty — keep the existing mirror */ }
      finally { clipboardRefreshing = false; }
    }
    // Encode a raw clipboard string as one key-notation feed (the JS twin of
    // nxvim-view's `encode_paste`): escape the chars special to the notation parser so
    // the text inserts verbatim — `<`→`<lt>`, tab→`<Tab>`, newline→`<CR>` (CRLF folds to
    // one). Used to type a paste into Insert/cmdline/terminal mode in a single feed.
    function encodePaste(text) {
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === "<") out += "<lt>";
        else if (c === "\t") out += "<Tab>";
        else if (c === "\n") out += "<CR>";
        else if (c === "\r") { out += "<CR>"; if (text[i + 1] === "\n") i++; }
        else out += c;
      }
      return out;
    }
    // Modes where a paste is "typed in" (insert literally) rather than dropped via the
    // `"+` register paste (`"+p`) that Normal/Visual want.
    const PASTE_INSERTS = new Set(["INSERT", "REPLACE", "COMMAND", "TERMINAL"]);
    // Handle the OS paste gesture — Cmd/Ctrl+V, the Edit▸Paste menu, or middle-click.
    // The browser hands us the clipboard text synchronously in the event, with NO
    // permission chip (the gesture itself is the grant), so this is the friendly path:
    // it Just Works on load with no click-out-and-back dance to coax `readText()`. We
    // refresh the `"+`/`"*` mirror (ordered ahead of the feed, so a later manual `"+p`
    // is fresh too), then apply the paste in the current mode: typed-in for
    // Insert/cmdline/terminal, `"+p` for Normal/Visual (which also replaces a selection).
    function onPaste(e) {
      const text = e.clipboardData?.getData("text/plain");
      if (!text) return;
      e.preventDefault();
      clipboardPushOp(text);
      const mode = latest.frame?.mode_label ?? "";
      if (PASTE_INSERTS.has(mode)) feedOp(encodePaste(text));
      else feedOp('"+p');
    }

    let statusHideTimer = null;
    // Briefly show a transient message in the corner indicator (picker errors, etc.).
    function flashStatus(text, color = "#e5c07b") {
      clearTimeout(statusHideTimer);
      statusEl.style.display = "";
      statusEl.style.opacity = "1";
      statusEl.style.color = color;
      statusEl.textContent = text;
      statusHideTimer = setTimeout(() => { statusEl.style.display = "none"; }, 4000);
    }
    worker.onmessage = async (ev) => {
      const msg = ev.data;
      // `nx.http.mount` published a route: ensure the Service Worker, then report the origin
      // it will be served from — or why it cannot be, which rejects the plugin's promise.
      if (msg.type === "nx-http-mount") {
        ensureServiceWorker().then(
          (origin) => httpMountResultOp(msg.id, true, origin),
          (e) => httpMountResultOp(msg.id, false, String((e && e.message) || e))
        );
        return;
      }
      // A mount handler answered: hand the reply to the SW's parked fetch, closing the loop.
      if (msg.type === "nx-http-reply") {
        for (const r of msg.replies || []) {
          const port = httpPorts.get(r.req_id);
          if (!port) continue; // already answered / timed out SW-side
          httpPorts.delete(r.req_id);
          port.postMessage({ status: r.status, headers: r.headers, body: r.body });
        }
        return;
      }
      // `mount:close()`: the editor already dropped the route (a later request 404s from
      // Rust), so there is nothing window-side to forget — the ports are per-request.
      if (msg.type === "nx-http-unmount") return;
      // Real-FS picker plumbing: the Worker routes a bound path's read/write here (its
      // handle is UI-side) and we fulfill it against the real file, then report back.
      if (msg.type === "fs_read") {
        const handle = fsHandles.get(msg.path);
        const res = handle
          ? await realFsRead(handle)
          : { kind: 3, text: `no file handle for ${msg.path}` };
        // Transfer the file bytes (kind 0) so they cross zero-copy; dir/new/error send text.
        const reply = { type: "fs_read_result", buffer: msg.buffer, path: msg.path, kind: res.kind, text: res.text, bytes: res.bytes };
        worker.postMessage(reply, res.bytes ? [res.bytes.buffer] : []);
        return;
      }
      if (msg.type === "fs_write") {
        const handle = fsHandles.get(msg.path);
        const res = handle
          ? await realFsWrite(handle, msg.bytes)
          : { ok: false, error: `no file handle for ${msg.path}` };
        worker.postMessage({ type: "fs_write_result", seq: msg.seq, ok: res.ok, size: res.size || 0, error: res.error || "" });
        return;
      }
      // The Worker persisted cross-session (shada) state — resolve any pending flush.
      if (msg.type === "shada_written") {
        shadaWrittenWaiters.splice(0).forEach((r) => r(msg));
        return;
      }
      // `:TSInstall <lang>` — the core asked us to install a grammar (web-tree-sitter lives
      // here, UI-side). Fetch/cache/register it, then report the outcome back so the core
      // echoes it. A repaint on success comes for free via the highlighter's onReady.
      if (msg.type === "ts_install") {
        const lang = String(msg.lang);
        const res = (ts && ts.install)
          ? await ts.install(lang)
          : { ok: false, msg: "syntax highlighter unavailable (tree-sitter vendor not built)" };
        // Report the canonical name the highlighter resolved (e.g. `c#` → `c_sharp`) so the
        // core's echo + `:TSInstallInfo` record match what's cached in OPFS.
        tsInstallResultOp(res.name || lang, res.ok, res.msg || "");
        return;
      }
      // A `"+`/`"*` yank/delete — write the text to the real clipboard (only the UI thread can
      // reach `navigator.clipboard`). Best-effort: a denied write is a no-op, not a crash.
      if (msg.type === "clipboard_write") {
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(msg.text).catch(() => {});
        return;
      }
      // A runtime `:connect nxvim://…` finished dialing — flash the outcome (the fs/watch seam
      // is now on the wire on success; on failure the editor stays on serverless OPFS).
      if (msg.type === "connected") {
        if (msg.ok) { daemonMode = true; flashStatus("connected to daemon", "#98c379"); }
        else flashStatus("connect failed: " + (msg.error || "unknown"), "#e06c75");
        return;
      }
      // Reply to an out-of-band image-preview byte fetch routed through the Worker (a daemon
      // path). Hand the bytes (or error) to the awaiting `fetchImageBytes` promise.
      if (msg.type === "image_read_result") {
        const r = imageReadWaiters.get(msg.reqId);
        if (r) {
          imageReadWaiters.delete(msg.reqId);
          r(msg.ok ? { ok: true, bytes: msg.bytes } : { ok: false, error: msg.error || "read failed" });
        }
        return;
      }
      if (msg.type === "fatal") {
        statusEl.style.opacity = "1";
        statusEl.style.color = "#e06c75";
        statusEl.textContent = "FATAL: " + msg.error;
        console.error("edit-host worker fatal:", msg.error);
        return;
      }
      if (msg.type === "config_error") {
        // A broken /init.lua is non-fatal — the editor still boots. Surface it so the
        // user can fix the config rather than wonder why it didn't apply.
        clearTimeout(statusHideTimer);
        statusEl.style.display = "";
        statusEl.style.opacity = "1";
        statusEl.style.color = "#e5c07b";
        statusEl.textContent = "init.lua error: " + msg.error;
        console.error("nxvim init.lua:", msg.error);
        return;
      }
      if (msg.type === "ready") {
        layout();
        if (useSAB) {
          ctrl = new Int32Array(new SharedArrayBuffer(16));
          const sab = new SharedArrayBuffer(1 << 16);
          data = new Uint8Array(sab);
          dataCap = data.length;
          worker.postMessage({ type: "init", ctrl: ctrl.buffer, data: sab, cols, rows: editorRows });
          markReady();
        } else {
          attachOp(cols, editorRows).then(markReady);
        }
        return;
      }
      if (msg.type === "redraw") {
        setFrame(msg.frame, msg.lines, msg.aux);
        // 5c: a single id reply. 5d: batched acks + exec_lua results.
        if (msg.id !== undefined) {
          const resolve = pendingMsg.get(msg.id);
          if (resolve) { pendingMsg.delete(msg.id); resolve({ frame: msg.frame, lines: msg.lines, result: msg.result }); }
        }
        for (const reqId of msg.acks || []) {
          const r = pendingAcks.get(reqId);
          if (r) { pendingAcks.delete(reqId); r({ frame: msg.frame, lines: msg.lines }); }
        }
        for (const [reqId, result] of msg.results || []) {
          const r = pendingResults.get(reqId);
          if (r) { pendingResults.delete(reqId); r({ frame: msg.frame, lines: msg.lines, result }); }
        }
      }
    };

    function markReady() {
      statusEl.textContent = `nxvim wasm edit-host — ${cols}×${editorRows + 1} — ${useSAB ? "SAB+timers" : "postMessage"}`;
      clearTimeout(statusHideTimer);
      statusHideTimer = setTimeout(() => { statusEl.style.display = "none"; }, 1500);
      focusInput();
      readyResolve();
    }

    // Adopt a freshly posted redraw frame: normalize the server map to the field
    // names the ported renderer expects, stash the buffer text for the highlighter,
    // then paint. The server map differs from the serverless `WebEditor` view_json in
    // two key names only — `mode_label` (top-level mode) and `cursors` (the secondary
    // multi-cursors) — so bridge those rather than fork the renderer.
    function setFrame(frame, lines, aux) {
      latest = { frame, lines: lines ?? latest.lines };
      if (!frame) { view = null; gridEl.innerHTML = ""; return; }
      frame.mode = frame.mode_label;
      for (const w of frame.windows || []) w.secondary_cursors = w.cursors || [];
      view = frame;
      if (lines != null) {
        bufferText = lines;
        // Remember the (just-shipped) focused buffer's text by file name, so a later
        // frame where it's NOT focused can still highlight it from here.
        const fw = (frame.windows || []).find((w) => w.focused);
        if (fw && !fw.terminal) textByFile.set(fw.file_name, lines);
      }
      // The visible *background* buffers' text (the windows that never rode `lines`
      // because they aren't focused — e.g. the file beneath a grabbing float). Without
      // this they'd have no text to highlight from until focused. `null` ⇒ keep cache.
      if (aux) for (const [name, text] of Object.entries(aux)) textByFile.set(name, text);
      // Keep the cache bounded to what's on screen: drop any file no window shows.
      const visible = new Set((frame.windows || []).map((w) => w.file_name));
      for (const k of textByFile.keys()) if (!visible.has(k)) textByFile.delete(k);
      syncHlTheme(frame);
      applyView();
    }

    // Bridge the active colorscheme's syntax palette into the JS highlighter. The
    // server ships `theme` (a `capture-name → style_id` map) + `theme_gen` (the
    // registry generation) on the wasm build; rebuild the highlighter's `capture →
    // CSS color` map only when the generation changes (a colorscheme load/switch),
    // resolving the palette ids against THIS frame's `styles`. Spans are capture
    // *names* colored at paint time, so the next render picks up the new colors.
    let lastThemeGen = -1;
    function syncHlTheme(frame) {
      // `theme_gen` is the wasm-build marker (absent on the server-styled `:connect`
      // path, which themes chrome via `render`'s `applyChrome` instead).
      if (frame.theme_gen == null || frame.theme_gen === lastThemeGen) return;
      lastThemeGen = frame.theme_gen;
      const styles = frame.styles || [];
      const map = {};
      for (const [name, id] of Object.entries(frame.theme || {})) {
        const fg = cssColor(styles[id]?.fg);
        if (fg) map[name] = fg;
      }
      setHlTheme(map);
      // `view` is already this frame (setFrame). Re-theme the chrome vars from the
      // colorscheme that just loaded/changed (One Dark defaults stay for absent groups).
      applyChrome();
    }

    // ============================================================================
    // Syntax highlighting (client-side web-tree-sitter, exactly as nxvim-web). The
    // highlighter loads grammars asynchronously; when the runtime or a grammar becomes
    // ready it asks for a repaint. Coalesce those into one frame.
    // ============================================================================
    let tsPending = false;
    function tsRefresh() {
      if (tsPending) return;
      tsPending = true;
      requestAnimationFrame(() => { tsPending = false; if (view) render(); });
    }

    // Per-line tree-sitter capture spans for one window's buffer, or null when there's
    // nothing to highlight (runtime not ready, terminal, unsupported file, grammar still
    // loading, or no cached text). Each visible window is highlighted from its OWN text —
    // the focused window's full contents arrive from the Worker (`bufferText`); other
    // visible windows (e.g. a code buffer beneath an open `:messages` panel) read the
    // text remembered in `textByFile`, so they keep their highlighting while unfocused.
    function spansForWindow(w) {
      if (!ts || !ts.isReady()) return null;
      if (w.terminal || w.term_colors) return null;
      const text = w.focused ? bufferText : textByFile.get(w.file_name);
      if (text == null) return null;
      // A markdown buffer (an LSP hover / signature doc float, or a `.md` file): the
      // markdown grammar isn't bundled and single-grammar parsing can't reach injected
      // code, so highlight its ```lang code fences with their own grammars instead — the
      // code in a hover is the part worth colouring.
      if (w.filetype === "markdown") return ts.spansForFencedMarkdown(text);
      const lang =
        ts.langForFiletype(w.filetype) || (w.unnamed ? null : ts.langForName(w.file_name));
      if (!lang) return null;
      return ts.spansForBuffer(lang, text);
    }

    // ============================================================================
    // The renderer — ported from nxvim-web/web/index.html. Reads the global `view`
    // (the redraw frame) and paints per-cell spans into #grid. serverStyled keys on a
    // resolved colorscheme palette; the wasm build emits an empty palette, so the
    // in-page highlighter path is taken (the palette path is kept dormant for a future
    // palette-bearing frame).
    // ============================================================================
    let serverStyled = false;

    // ---- smooth scrolling ----
    let scrollAnim = null; // in-flight slide, or null
    let scrollRAF = 0;
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

    function applyView() {
      const w = focusedWindow();
      const s = w?.scroll;
      if (s && s.duration_ms > 0) { armScroll(w, s); return; }
      if (scrollAnim && repaintsDestination(w)) return; // let the slide finish
      cancelScroll();
      render();
    }
    function repaintsDestination(w) {
      if (!w || !scrollAnim) return false;
      const a = scrollAnim;
      // The band is screen-row based: the destination viewport top / cursor buffer
      // lines are the band's `numbers` at its settle offsets (`to_row` /
      // `to_cursor_row`), which are 1-based like the window's.
      const nums = a.band.numbers;
      return w.numbers?.[0] === nums[Math.round(a.to_row)]
        && w.cursor_line === nums[Math.round(a.to_cursor_row)];
    }
    function armScroll(w, s) {
      cancelScroll();
      scrollAnim = {
        from_row: s.from_row, to_row: s.to_row,
        from_cursor_row: s.from_cursor_row, to_cursor_row: s.to_cursor_row,
        duration: s.duration_ms,
        band: bandWindow(w, s), start: performance.now(), strip: null,
      };
      render();
      scrollRAF = requestAnimationFrame(stepScroll);
    }
    function scrollProgress(a, now) {
      return Math.min(1, Math.max(0, (now - a.start) / a.duration));
    }
    function stepScroll(now) {
      const a = scrollAnim;
      if (!a) return;
      const t = scrollProgress(a, now);
      if (a.strip) a.strip.style.transform = `translate3d(0, ${stripOffset(a, easeOutCubic(t))}px, 0)`;
      if (t < 1) { scrollRAF = requestAnimationFrame(stepScroll); return; }
      scrollAnim = null;
      scrollRAF = 0;
      render();
    }
    function stripOffset(a, e) {
      // The slide is a fractional screen-row offset into the band; band `rows[0]` is
      // the anchor (offset 0), so translate the strip up by that many rows. Sub-pixel
      // (`* ch` on a fractional offset) gives the web its smooth scroll.
      const rowOff = a.from_row + (a.to_row - a.from_row) * e;
      return -rowOff * ch;
    }
    function bandWindow(w, s) {
      const n = s.lines.length;
      const blanks = Array.from({ length: n }, () => []);
      return Object.assign({}, w, {

      }

      // Extmark `virt_text` overlay / win_col: overwrite the glyphs at the
      // placement's columns in place (no shift, so the column model the cursor /
      // selection walk below relies on is preserved), honoring `hl_mode` at fg
      // fidelity (replace/combine keep the chunk colour; blend tints with the cell
      // underneath). Inline placements (pos 1, which shift the row) are emitted in the
      // walk below — the DOM flows, so emitting the chunk span before its anchor cell
      // pushes the following glyphs, cursor, and selection right with no column math.
      const vtext = (w.virt_text && w.virt_text[row]) || [];
      const inlineVirt = vtext.filter((p) => p[0] === 1);
      for (const [pos, col, mode, chunks] of vtext) {
        if (pos !== 2 && pos !== 4) continue;
        let a = col;
        for (const [text, id] of chunks) {
          const cc = virtChunkColor(id);
          const cb = virtChunkBg(id);
          for (const cp of text) {
            const color = mode === 2 ? blendHex(cells[a] ? cells[a].color : null, cc) : cc;
            if (a < cells.length) cells[a] = { ch: cp, color, bg: cb };
            else { while (cells.length < a) cells.push({ ch: " ", color: null }); cells.push({ ch: cp, color, bg: cb }); }
            a++;
          }
        }
      }

      const leftcol = w.leftcol || 0;
      // A picker (a menu carrying a prompt `query`) moves the cursor into its input box,
      // so the buffer cursor must hide while it's open — matching the native TUI/GUI
      // (`picker_open = menu.query.is_some()`). A queryless select / completion popup
      // keeps the buffer cursor where it is.
      const pickerOpen = !!(view.menu && view.menu.query != null);
      const isFocused = w.focused && !view.command_mode && !pickerOpen;
      const cursorCol = w.cursor_screen_col;
      const cursorRow = w.cursor_row;
      const sel = w.selection[row] || null;
      const search = w.search[row] || [];
      const inc = w.incsearch[row] || null;
      const secSel = w.secondary_selection[row] || [];
      const secCols = new Set((w.secondary_cursors || []).filter(([r]) => r === row).map(([, c]) => c));
      const inSpan = (sp, c) => c >= sp[0] && c < sp[1];
      const COLOR_OWNED = new Set(["cur-block", "cur-mc", "seccur", "search", "incsearch"]);
      // Display columns of the `^X` / `<xx>` control-char tokens the server already
      // substituted into `line`; colour them as `SpecialKey` so they read as
      // non-text (the native build overlays the same group via its highlight
      // spans). LightMagenta, matching the native fallback when no colorscheme
      // resolves the group.
      const special = w.special_key?.[row] || [];
      const SPECIAL_KEY = "#d787ff";
      // Server-sourced highlight overlay (extmark / `nx.decor` / LSP semantic tokens),
      // per screen row in display columns. The wasm build can't reproduce these JS-side,
      // so the server ships them (see `overlay_highlights_for`) and we paint them over the
      // JS treesitter colors here, at full style (fg/bg/bold/italic via the palette) so a
      // `nx.decor` mark looks the same as on native. Wins over the JS color, loses to the
      // control-char `SpecialKey` substitution (which isn't real content).
      const srvHl = w.highlights?.[row] || [];
      const srvCssAt = (c) => {
        for (const [s, e, group, id] of srvHl) {
          if (c >= s && c < e) {

            const fg = colorFor(group);
            return fg ? `color:${fg};` : "";
          }
        }
        return null;
      };
      // LSP / client-set diagnostic underline spans `[start_col, end_col, sev, id]` in
      // display columns. The server projects these on both builds (same merged store as
      // the gutter signs); paint a wavy squiggle in the severity colour over the cell,
      // combined with whatever fg the cell already has — mirrors `cellBaseCss` on the
      // server-styled path. Loses to cursor/selection (an "owned" cell), like the native
      // overlay below.
      const diagSpans = w.diagnostics?.[row] || [];
      const diagCssAt = (c) => {
        for (const [s, e, sev, id] of diagSpans) {
          if (c >= s && c < e) {
            const sp = (id != null && paletteStyle(id)?.sp) || severityColor(sev);
            return `text-decoration:underline wavy;text-decoration-color:${sp};text-underline-offset:2px;`;
          }
        }
        return "";
      };

      let run = "", runCls = "", runCss = "", out = "";
      const flush = () => {
        if (!run) return;
        const style = runCss ? ` style="${runCss}"` : "";
        out += `<span class="${runCls}"${style}>${escapeHtml(run)}</span>`;
        run = "";
      };
      for (let c = 0; c < cells.length; c++) {
        if (c < leftcol) continue;
        // Inline virt_text anchored at this column: flush the pending run and emit the
        // chunks before the glyph; DOM flow shifts the cell (and everything after,
        // including the cursor / selection) right by the inserted width.
        for (const p of inlineVirt) {
          if (p[1] === c) { flush(); out += virtChunksHtml(p[3]); }
        }
        let cls = "";
        if (search.some((s) => inSpan(s, c))) cls = "search";
        if (inc && inSpan(inc, c)) cls = "incsearch";
        if ((sel && inSpan(sel, c)) || secSel.some((s) => inSpan(s, c))) cls = "sel";
        if (secCols.has(c)) cls = "seccur";
        // The cursor lives only in the focused window — an unfocused split draws none,
        // matching the native TUI/GUI clients (and vim's single terminal cursor).
        if (isFocused && row === cursorRow && c === cursorCol) cls = cursorClass();
        // Cursor / selection / search own their colors via their CSS class; the
        // server overlay, control-char colour, and virt_text bg only show on a plain cell.
        const owned = COLOR_OWNED.has(cls);
        let css = "";
        if (!owned) {
          if (special.some((s) => inSpan(s, c))) {
            css = `color:${SPECIAL_KEY};` + (cells[c].bg ? `background:${cells[c].bg};` : "");
          } else {
            const sv = srvHl.length ? srvCssAt(c) : null;
            if (sv != null) css = sv;
            else css = (cells[c].color ? `color:${cells[c].color};` : "") + (cells[c].bg ? `background:${cells[c].bg};` : "");
          }
          // The diagnostic squiggle rides on top of the resolved fg (a text-decoration,
          // not a colour), so append it after the colour above.
          if (diagSpans.length) css += diagCssAt(c);
        }
        // A wide glyph or boxed symbol breaks the run and renders in its own fixed-width
        // box; a wide glyph's empty continuation cell (next column) then adds nothing.
        const isCursorCell = isFocused && row === cursorRow && c === cursorCol;
        if (cellNeedsBox(cells[c].ch)) { flush(); out += cellBoxSpan(cells[c].ch, cls, css, isCursorCell ? CURSOR_ID : null); continue; }
        // The cursor cell is emitted as its own id-tagged span so the off-screen IME
        // proxy can be parked over it (see positionImeProxy).
        if (isCursorCell) { flush(); out += `<span id="${CURSOR_ID}" class="${cls}">${escapeHtml(cells[c].ch)}</span>`; continue; }
        if (cls !== runCls || css !== runCss) { flush(); runCls = cls; runCss = css; }
        run += cells[c].ch;
      }
      flush();
      // Inline virt_text anchored at or past end-of-text (col beyond the last cell).
      for (const p of inlineVirt) {
        if (p[1] >= cells.length) out += virtChunksHtml(p[3]);
      }
      if (isFocused && row === cursorRow && cursorCol >= cells.length) {
        out += `<span id="${CURSOR_ID}" class="${cursorClass()}"> </span>`;
      }
      // Extmark end-of-line virtual text: a one-cell gap, then each placement's
      // chunks in order, painted in the empty space past the line.
      for (const [pos, col, mode, chunks] of vtext) {
        if (pos === 0) out += `<span> </span>` + virtChunksHtml(chunks);
      }
      // Right-aligned virtual text: flush the stacked chunks to the text area's
      // right edge, clamped to never overlap the painted text. Padding ignores any
      // inline-virt shift (not painted on this path yet) — an approximation.
      const ra = vtext.filter((p) => p[0] === 3).flatMap((p) => p[3]);
      if (ra.length && rect) {
        const textW = Math.max(0, rect.width - gutterW - (w.foldcolumn_width || 0) - (w.sign_width || 0));
        const total = ra.reduce((s, [t]) => s + [...t].length, 0);
        const paintedVisible = Math.max(0, cells.length - leftcol);
        const start = Math.max(paintedVisible + 1, textW - total);
        const pad = Math.max(0, start - paintedVisible);
        out += `<span>${" ".repeat(pad)}</span>` + virtChunksHtml(ra);
      }
      // Diagnostic inline virtual text `[text, sev, id]` — the trailing end-of-line
      // message (`virtual_text = true`). Projected on both builds; render it the same
      // way the server-styled path does (a one-space gap then the message).
      const diagVirt = w.diagnostics_virt?.[row];
      if (diagVirt) {
        const [text, sev, id] = diagVirt;
        const vcss = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
        out += `<span${vcss ? ` style="${vcss}"` : ""}> ${escapeHtml(text)}</span>`;
      }
      return html + out;
    }

    // The id parked on the focused cursor cell (editor or command line) each frame, so the
    // IME caret can be reported there — see `positionImeProxy`.
    const CURSOR_ID = "nx-cursor";
    // The last cursor-cell rect we reported to the IME, exposed for the verifier (it can't
    // observe the OS-drawn popup, so it checks we hand the right bounds to the browser).
    let lastImeRect = null;

    // Tell the OS where the IME caret is, so a CJK composition popup / the macOS accent menu
    // anchors to the drawn cursor instead of the editor's top-left. Two mechanisms:
    //   • Chrome (EditContext): report the cursor cell's bounds via `updateSelectionBounds`
    //     (and the editor region via `updateControlBounds`). The host element's own position
    //     is irrelevant; Chrome won't re-read a CSS-moved textarea's caret, so we must report
    //     bounds explicitly.
    //   • Firefox (no EditContext): park the hidden #kbd textarea over the cursor cell; the
    //     OS reads its caret there live.
    // The cursor cell carries `CURSOR_ID`; if none is on screen (no focus, or a mode that
    // draws no cursor) leave things as they were — composition can't happen without a cursor.
    function positionImeProxy() {
      const cur = document.getElementById(CURSOR_ID);
      if (!cur) return;
      const r = cur.getBoundingClientRect();
      lastImeRect = { left: r.left, top: r.top, width: r.width, height: r.height };
      if (editCtx) {
        editCtx.updateControlBounds(gridEl.getBoundingClientRect());
        editCtx.updateSelectionBounds(r);
        return;
      }
      // Firefox path: #kbd is `position: absolute` (no scroll → viewport coords), so the
      // rect maps straight to left/top. Size it to the cell so the caret lands at its top-left.
      kbdEl.style.left = r.left + "px";
      kbdEl.style.top = r.top + "px";
      kbdEl.style.width = Math.max(1, r.width) + "px";
      kbdEl.style.height = Math.max(1, r.height) + "px";
    }

    function cursorClass() {
      if (view.mode === "MULTICURSOR") return "cur-mc";
      if (view.mode === "INSERT") return "cur-bar";
      if (view.mode === "REPLACE" || view.pending_replace) return "cur-underline";
      return "cur-block";
    }

    // ---- extmark virtual text (`virt_text` / `virt_lines`) ----
    // A chunk's wire shape is `[text, style_id]`; the placement is `[pos, col,
    // hl_mode, chunks]` (pos 0=eol, 1=inline, 2=overlay, 3=right_align, 4=win_col).
    // The fg-only colour the server interned for a chunk's hl_group (palette index),
    // else "" (normal). Used by overlay/win_col (which set a cell's `color`).
    function virtChunkColor(id) {
      const s = id != null ? paletteStyle(id) : null;
      return s ? (cssColor(s.fg) || "") : "";
    }
    // The fg-only background a chunk's hl_group sets (for overlay/win_col cells, which
    // share the line's fg-only cell model). eol/right_align/virt_lines instead go
    // through virtChunksHtml → styleToCss, which already emits `background`.
    function virtChunkBg(id) {
      const s = id != null ? paletteStyle(id) : null;
      return s ? (cssColor(s.bg) || "") : "";
    }
    // A chunk run as styled spans (full style: fg + bold/italic) — for eol /
    // right_align / virt_lines, which paint past the text where there are no cells.
    function virtChunksHtml(chunks) {
      let out = "";
      for (const [text, id] of chunks) {
        const css = id != null ? styleToCss(paletteStyle(id)) : "";
        out += `<span${css ? ` style="${css}"` : ""}>${escapeHtml(text)}</span>`;
      }
      return out;
    }
    // Average two `#rrggbb` colours channel-wise (the `hl_mode = blend` overlay
    // tint); a non-hex on either side falls back to the chunk colour. Mirrors the
    // TUI's `blend_color` at fg fidelity.
    function blendHex(under, chunk) {
      const hex = (s) => (typeof s === "string" && /^#[0-9a-f]{6}$/i.test(s)) ? parseInt(s.slice(1), 16) : null;
      const a = hex(under), b = hex(chunk);
      if (a == null || b == null) return chunk;
      const mix = (sh) => ((((a >> sh) & 0xff) + ((b >> sh) & 0xff)) >> 1);
      return "#" + (((mix(16) << 16) | (mix(8) << 8) | mix(0)) >>> 0).toString(16).padStart(6, "0");
    }

    // ---- server-styled (palette) paint helpers — dormant on the wasm build ----
    // Palette colors arrive as `0xRRGGBB` integers (neovim's convention, the shared
    // `style_value` encoding) — the terminal vt100 colors take this path. Coerce to a CSS
    // color: a number → `#rrggbb`, a string passes through, null/undefined → null.
    function cssColor(c) {
      if (c == null) return null;
      if (typeof c === "number") return "#" + (c >>> 0).toString(16).padStart(6, "0");
      return c;
    }
    // `mode` splits the style for the two-layer status bar: "bg" → background only,
    // "fg" → colour + weight/slant/decorations only; omitted → the full style (every
    // other caller). Splitting lets the bar paint backgrounds and glyphs in separate
    // stacked layers so a glyph's ink is never overpainted by a neighbour's background.
    function styleToCss(s, mode) {
      if (!s) return "";
      let fg = cssColor(s.fg), bg = cssColor(s.bg);
      if (s.reverse) { const t = fg; fg = bg || "var(--bg)"; bg = t || "var(--fg)"; }
      let css = "";
      if (mode !== "bg") {
        if (fg) css += `color:${fg};`;
        if (s.bold) css += "font-weight:700;";
        if (s.italic) css += "font-style:italic;";
        if (s.strikethrough) css += "text-decoration:line-through;";
        else if (s.underline) css += "text-decoration:underline;";
        else if (s.undercurl) { const sp = cssColor(s.sp); css += `text-decoration:underline wavy;${sp ? `text-decoration-color:${sp};` : ""}`; }
      }
      if (mode !== "fg" && bg) css += `background:${bg};`;
      return css;
    }
    function paletteStyle(id) { return id == null ? null : (view.styles[id] || null); }
    // Resolve a chrome region (`float_border`, `normal_float`, …) to a style object,
    // accepting either the server's palette id (server-styled path) or an already-
    // resolved style object (JS-synthesized path). `null` when the theme leaves it
    // undefined — float rendering then keeps its built-in CSS look.
    function chromeStyle(key) {
      const v = view.chrome?.[key];
      if (v == null) return null;
      return typeof v === "number" ? paletteStyle(v) : v;
    }
    function chromeCss(style) { return style ? styleToCss(style) : ""; }
    // A window's `'winhighlight'` chrome override (`w.chrome`, a `key -> style_id`
    // map for the chrome groups it renames). Applied per window on its `.win` box —
    // independent of `serverStyled`, since the override styles are interned into
    // `view.styles` on the wasm build too (the server resolves `NormalSB` &c. even
    // when global chrome stays JS-synthesized). The box background fills its empty
    // cells, and the per-window CSS vars cascade to this window's rows/gutter/eob
    // only. A window with no `winhighlight` has no `chrome` map, so it inherits the
    // global look unchanged.
    function applyWinChrome(box, w) {
      const c = w.chrome;
      if (!c) return;
      const norm = paletteStyle(c.normal);
      if (norm) {
        const bg = cssColor(norm.bg), fg = cssColor(norm.fg);
        if (bg) box.style.background = bg;
        if (fg) box.style.color = fg;
      }
      const setVar = (name, id, key) => {
        const col = cssColor(paletteStyle(id)?.[key]);
        if (col) box.style.setProperty(name, col);
      };
      setVar("--cursorline", c.cursorline, "bg");
      setVar("--colorcolumn", c.colorcolumn, "bg");
      setVar("--gutter", c.line_nr, "fg");
      setVar("--gutter-cur", c.cursor_line_nr, "fg");
      setVar("--eob", c.end_of_buffer, "fg");
    }
    // Drive the chrome CSS variables (`:root`) from the active colorscheme's resolved
    // groups. Each chrome key arrives as a palette id (`view.chrome`), resolved here via
    // `chromeStyle()`; a var is overridden only when its group resolves, so a build with
    // no colorscheme keeps the built-in One Dark CSS defaults. Runs on the server-styled
    // `:connect` path (`render`) and, on the wasm build, whenever the colorscheme changes
    // (`syncHlTheme`) — neither flips `serverStyled`, so JS highlighting stays on.
    function applyChrome() {
      const root = document.documentElement.style;
      const setVar = (name, key, attr) => {
        const col = cssColor(chromeStyle(key)?.[attr]);
        if (col) root.setProperty(name, col);
      };
      setVar("--bg", "normal", "bg");
      setVar("--fg", "normal", "fg");
      setVar("--eob", "end_of_buffer", "fg");
      setVar("--gutter", "line_nr", "fg");
      setVar("--gutter-cur", "cursor_line_nr", "fg");
      setVar("--win-sep", "win_separator", "fg");
      setVar("--status-bg", "status_line", "bg");
      setVar("--status-fg", "status_line", "fg");
      setVar("--sel", "visual", "bg");
      setVar("--search", "search", "bg");
      setVar("--cursorline", "cursorline", "bg");
      setVar("--colorcolumn", "colorcolumn", "bg");
      setVar("--cursor", "cursor", "bg");
    }
    function cellBaseCss(col, hlSpans, diagSpans) {
      let css = "";
      for (const [s, e, group, id] of hlSpans) {
        if (col >= s && col < e) {
          if (id != null) css = styleToCss(paletteStyle(id));
          else { const fg = colorFor(group); if (fg) css = `color:${fg};`; }
          break;
        }
      }
      for (const [s, e, sev, id] of diagSpans) {
        if (col >= s && col < e) {
          const sp = (id != null && paletteStyle(id)?.sp) || severityColor(sev);
          css += `text-decoration:underline wavy;text-decoration-color:${sp};text-underline-offset:2px;`;
          break;
        }
      }
      return css;
    }
    function severityColor(sev) {
      return sev === 1 ? "#e06c75" : sev === 2 ? "#e5c07b" : sev === 4 ? "#56b6c2" : "#61afef";
    }
    function renderLineServer(w, row, gutterW, rect) {
      const line = w.lines[row] ?? "";
      const isFiller = w.numbers[row] === null;
      let html = (gutterW > 0 || w.sign_width > 0) ? renderGutterCell(w, row, gutterW) : "";
      if (isFiller) {
        const css = chromeCss(view.chrome?.end_of_buffer);
        return html + `<span class="eob"${css ? ` style="${css}"` : ""}>${escapeHtml(line)}</span>`;
      }
      const tabstop = w.tabstop || 8;
      const leftcol = w.leftcol || 0;
      const hints = w.inlay_hints?.[row] || [];
      const hlSpans = w.highlights?.[row] || [];
      const diagSpans = w.diagnostics?.[row] || [];
      const sel = w.selection?.[row] || null;
      const secSel = w.secondary_selection?.[row] || [];
      const search = w.search?.[row] || [];
      const inc = w.incsearch?.[row] || null;
      const secCols = new Set((w.secondary_cursors || []).filter(([r]) => r === row).map(([, c]) => c));
      const inSpan = (sp, c) => c >= sp[0] && c < sp[1];

      // One entry per display column (tabs expanded, wide glyphs followed by an empty
      // continuation column, combining marks glued to the preceding glyph) so each
      // index lines up with the server's wide=2 column model.
      const expanded = [];
      let c0 = 0;
      for (const cp of line) {
        if (cp === "\t") { const n = tabstop - (c0 % tabstop); for (let k = 0; k < n; k++) expanded.push(" "); c0 += n; }
        else {
          const wcw = charWidth(cp.codePointAt(0));
          if (wcw === 0 && expanded.length) { expanded[expanded.length - 1] += cp; }
          else { expanded.push(cp); if (wcw === 2) expanded.push(""); c0 += wcw || 1; }
        }
      }

      const cells = [];
      let hi = 0;
      const emitHints = (anchor) => {
        while (hi < hints.length && hints[hi][0] <= anchor) {
          const [hcol, text, id] = hints[hi++];
          if (hcol < leftcol) continue;
          const css = id != null ? styleToCss(paletteStyle(id)) : "";
          for (const cp of text) cells.push({ ch: cp, abs: -1, base: css });
        }
      };
      for (let c = 0; c < expanded.length; c++) {
        emitHints(c);
        if (c >= leftcol) cells.push({ ch: expanded[c], abs: c, base: cellBaseCss(c, hlSpans, diagSpans) });
      }
      emitHints(Infinity);

      // Hide the buffer cursor while a picker (a prompt-carrying menu) owns the input —
      // see the note in the plain renderLine above.
      const pickerOpen = !!(view.menu && view.menu.query != null);
      const isFocused = w.focused && !view.command_mode && !pickerOpen;
      const cursorRow = w.cursor_row;
      let inlayShift = 0;
      for (const [hcol, text] of hints) {
        if (hcol >= leftcol && hcol <= w.cursor_screen_col) inlayShift += [...text].length;
      }
      const cursorPainted = w.cursor_screen_col + inlayShift;

      const COLOR_OWNED = new Set(["cur-block", "cur-bar", "cur-underline", "cur-mc", "seccur", "search", "incsearch"]);
      let run = "", runCls = "", runStyle = "", out = "";
      const flush = () => {
        if (!run) return;
        out += `<span class="${runCls}"${runStyle ? ` style="${runStyle}"` : ""}>${escapeHtml(run)}</span>`;
        run = "";
      };
      let painted = leftcol;
      for (const cell of cells) {
        const a = cell.abs;
        let cls = "";
        if (a >= 0) {
          if (search.some((s) => inSpan(s, a))) cls = "search";
          if (inc && inSpan(inc, a)) cls = "incsearch";
          if ((sel && inSpan(sel, a)) || secSel.some((s) => inSpan(s, a))) cls = "sel";
          if (secCols.has(a)) cls = "seccur";
        } else {
          cls = "inlay";
        }
        // Cursor only in the focused window (see the other render path above).
        const isCursorCell = isFocused && cursorRow === row && painted === cursorPainted;
        if (isCursorCell) cls = cursorClass();
        const style = (a < 0) ? cell.base : (COLOR_OWNED.has(cls) ? "" : cell.base);
        // A wide glyph or boxed symbol renders in its own fixed-width box (see
        // cellBoxSpan); a wide glyph's empty continuation cell then adds nothing.
        if (cellNeedsBox(cell.ch)) { flush(); out += cellBoxSpan(cell.ch, cls, style, isCursorCell ? CURSOR_ID : null); painted += 1; continue; }
        // The cursor cell is id-tagged so the off-screen IME proxy can follow it.
        if (isCursorCell) { flush(); out += `<span id="${CURSOR_ID}" class="${cls}"${style ? ` style="${style}"` : ""}>${escapeHtml(cell.ch)}</span>`; painted += 1; continue; }
        if (cls !== runCls || style !== runStyle) { flush(); runCls = cls; runStyle = style; }
        run += cell.ch;
        painted += 1;
      }
      flush();
      if (isFocused && cursorRow === row && cursorPainted >= painted) {
        out += `<span id="${CURSOR_ID}" class="${cursorClass()}"> </span>`;
      }
      const virt = w.diagnostics_virt?.[row];
      if (virt) {
        const [text, sev, id] = virt;
        const vcss = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
        out += `<span${vcss ? ` style="${vcss}"` : ""}> ${escapeHtml(text)}</span>`;
      }
      return html + out;
    }

    function renderGutterCell(w, row, width) {
      let html = "";
      // Fold-marker gutter (vim's foldcolumn) at the very left, before signs and
      // numbers: the server ships a per-row marker string (`-`/`│`/`+`/blanks).
      const fcw = w.foldcolumn_width || 0;
      if (fcw > 0) {
        const marker = (w.foldcolumn && w.foldcolumn[row]) || "";
        html += `<span class="gutter">${escapeHtml(marker.padEnd(fcw))}</span>`;
      }
      // Sign column (LSP diagnostics + extmark signs). The server merges the signs and
      // ships the rendered column width in cells (`sign_width`, a multiple of 2 per the
      // `'signcolumn'` policy — 0 when no column is reserved) plus the per-row cell on
      // BOTH builds, so paint it independent of `serverStyled`. On the wasm build there's
      // no palette, so `id` is null and the severity colour is used.
      const sw = w.sign_width || 0;
      if (sw > 0) {
        const sign = w.diagnostics_signs?.[row];
        if (sign) {
          const [glyph, sev, id] = sign;
          const css = (id != null) ? styleToCss(paletteStyle(id)) : `color:${severityColor(sev)};`;
          html += `<span${css ? ` style="${css}"` : ""}>${escapeHtml((glyph + " ").slice(0, 2).padEnd(sw))}</span>`;

      // first row only); `numbers` still carries the line there.
      const n = w.continuation?.[row] ? null : w.numbers[row];
      const cur = w.cursor_line;

      if (n === null || n === undefined) cell = " ".repeat(width);
      else if (w.number && w.relativenumber && n === cur) { cell = String(n).padEnd(width); cls = "gutter-cur"; }
      else {
        let v;
        if (!w.relativenumber) v = n;
        else if (n === cur) v = 0;
        else v = Math.abs(n - cur);

    // Render a single-style run of text into the same boxed-cell model the content

    // every wide / Nerd-Font symbol (`cellNeedsBox`) draws in a fixed `cells*cw` box.
    // Without this a fallback font draws a Nerd glyph wider than its one server column
    // and drags the rest of the run right — in a status / tabline bar (sized to exactly
    // `width*cw`) that overflow is clipped, cropping the last few characters off the
    // right edge (the lualine-on-web crop). Boxing also fixes powerline-separator ink
    // placement, exactly as on the content lines / GUI.

    // painted separately, one layer below, so an over-wide glyph's ink can overhang.

      let bg = "", fg = "";

    function renderPmenu(pmenu, tablineRows) {
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      const rect = fw ? winRect(fw) : { x: 0, y: 0 };
      const o = regionOrigin(fw ? fw.region : "main", tablineRows);
      const x = o.x + rect.x + pmenu.col;
      const y = o.y + rect.y + pmenu.row;
      const rows = Math.max(1, Math.min(pmenu.height, pmenu.items.length));
      const first = Math.max(0, Math.min(pmenu.selected - rows + 1, pmenu.items.length - rows));
      const start = pmenu.selected >= rows ? first : 0;

      // item list sits one cell inside the ring.
      const { cx, cy } = popupChrome(x, y, pmenu.width, rows);
      const box = document.createElement("div");
      box.className = "pmenu";
      place(box, cx, cy, pmenu.width, rows);

        const idx = start + i;
        const [label, , detail] = pmenu.items[idx] || ["", 0, ""];
        const left = String(label);
        const right = detail ? String(detail) : "";
        const pad = Math.max(1, pmenu.width - left.length - right.length);
        const text = (left + " ".repeat(pad) + right).slice(0, pmenu.width).padEnd(pmenu.width);
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (idx === pmenu.selected ? " pmenu-sel" : "");

        // (past its border ring).

        const docBox = document.createElement("div");
        docBox.className = "pmenu-doc";

          rowEl.className = "row";

          docBox.appendChild(rowEl);
        }

      }
    }

    // The nx.ui.float content float: a bordered box of plain content lines (LSP
    // hover / signature help) — the list-less sibling of the menu. Server-placed
    // geometry (text-area-relative `row`/`col`), no list / selection / scrolling
    // (the server already windowed the lines to `height`).

    // mapping and the GUI's `draw_float_border`, so rounded corners actually look
    // rounded on every client.
    function floatBorderGlyphs(border) {
      switch (border) {
        case "rounded": return { tl: "╭", tr: "╮", bl: "╰", br: "╯", h: "─", v: "│" };
        case "double":  return { tl: "╔", tr: "╗", bl: "╚", br: "╝", h: "═", v: "║" };
        case "solid":   return { tl: "█", tr: "█", bl: "█", br: "█", h: "█", v: "█" };

      const s = document.createElement("span");

    }

    function renderContentFloat(float, tablineRows) {
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      const rect = fw ? winRect(fw) : { x: 0, y: 0 };
      // An `editor_relative` content float (any non-cursor placement — e.g. a "bottom"
      // which-key / keys-helper popup) is positioned in editor-absolute (windows-area)
      // cells, so it anchors at the grid origin, NOT the focused window's rect. Adding
      // the window rect would double-count the offset and a right-side split (a diff
      // pane) drags the popup off the right edge of the screen. A cursor-placed float
      // (LSP hover / signature help) stays window-relative, as before. Mirrors the
      // `editor_relative` handling in `renderMenu`.
      const er = float.editor_relative;
      const x = (er ? 0 : rect.x) + float.col;
      const y = (er ? tablineRows : tablineRows + rect.y) + float.row;
      const bordered = float.border && float.border !== "none";
      const inner = float.width; // content cell width (border adds a ring around it)
      // The shared chrome draws the bg + glyph border + title; the content box sits one
      // cell inside (or at the bare rect when borderless).
      // Theme from the colorscheme's float chrome when defined; else built-in CSS.
      const nf = chromeStyle("normal_float"), fb = chromeStyle("float_border"), ft = chromeStyle("float_title");
      let cx = x, cy = y;

        // Each line is a chunk run `[[text, style_id], …]`: paint each chunk in its
        // palette style (a styled which-key colours keys vs. descriptions and dims

        // background fills the row. A plain caller's single un-styled chunk has a
        // null id and renders in the default popup color.
        let used = 0;

          if (!shown) continue;
