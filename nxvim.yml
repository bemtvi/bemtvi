# selene standard library for nxvim's Lua prelude.
# Layers the globals nxvim injects on top of the base PUC Lua runtime so selene
# doesn't flag them as undefined / unscoped. `any: true` permits arbitrary field
# reads, writes, and calls (the `vim.*` API is open-ended).
#
# Base is `lua51` (the std selene ships reliably); the handful of 5.2+ stdlib
# functions nxvim's PUC Lua 5.4 prelude actually uses (`table.unpack`,
# `coroutine.isyieldable`) are declared under `globals` below, since selene's
# bundled `lua53` std is incomplete (no `coroutine.isyieldable`) and needs a
# build feature this distribution lacks.
# Referenced as `std = "lua51+nxvim"` from selene.toml — selene resolves the
# `nxvim` segment to this file (nxvim.yml, alongside selene.toml at the repo root).
base: lua51
name: nxvim
globals:
  # The editor API root. Open-ended: vim.keymap.set, vim.api.*, vim.fn.*, etc.,
  # plus assignment of new submodules (vim.treesitter = require("vim.treesitter")).
  vim:
    any: true
  # nxvim's own canonical config/plugin API (prelude/nx.lua); the bounded `vim.*`
  # whitelist is aliases onto it. Open-ended like `vim`.
  nx:
    any: true
  # LuaJIT's bit library. neovim ships it; the prelude polyfills it on PUC 5.1
  # (stdlib.lua) and plugins reach for `bit` / `bit32`.
  bit:
    any: true
  bit32:
    any: true
  # LuaJIT introspection global, referenced for runtime feature detection.
  jit:
    any: true
  # Lua 5.2+ moved `unpack` to `table.unpack`; nxvim runs PUC 5.4, so the prelude
  # calls `table.unpack` directly (the `table` field isn't in selene's lua51 std).
  table.unpack:
    any: true
  # 5.3+ `table.move`; vim.split's trimempty shift uses it. Same reasoning:
  # not in selene's lua51 std, provided by nxvim's PUC 5.4.
  table.move:
    any: true
  # 5.2+ coroutine introspection; `nx.await` uses it to detect an enclosing
  # nx.async coroutine. Not in selene's lua51 std, so declare it here.
  coroutine.isyieldable:
    args: []
  # 5.3+ `utf8` library (present in nxvim's PUC 5.4); `nx.markdown.to_view` uses
  # `utf8.offset` for char→byte column conversion. Open-ended like `bit`.
  utf8:
    any: true
