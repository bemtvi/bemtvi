[package]
name = "bemtvi-gpu"
description = "The bemtvi GUI client with no toolkit: the wgpu renderer, fonts, images, editor sessions and the RPC IO thread. A host's toolkit adapter shows the window and feeds input in."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
rmpv.workspace = true
tokio.workspace = true
wgpu.workspace = true
# The host's window, as the renderer takes it (see the root Cargo.toml).
raw-window-handle.workspace = true
glyphon.workspace = true
# Direct dep only to turn on cosmic-text's `monospace_fallback` feature (see the
# workspace dep note); glyphon still owns the actual text-render types we use.
cosmic-text.workspace = true
# Cell-width accounting for the wide-glyph / emoji renderer (render.rs): how many
# grid cells a cluster occupies, matching the server's column model.
unicode-width.workspace = true
# Grapheme-cluster segmentation for the same renderer: the off-grid test compares a
# whole cluster's shaped advance against its display width, so a base char + its VS16
# / combining marks (e.g. `❤️`) are weighed as one unit, not per glyph.
unicode-segmentation.workspace = true
# A font's character map, for the font list's per-character resolution (fontchain.rs).
ttf-parser.workspace = true
pollster.workspace = true
bemtvi-rpc.workspace = true
bemtvi-view.workspace = true
# The shared per-user directory policy (`bemtvi_core::stdpath`) — so the GUI's `~`
# expansion resolves the home the same way the server does, Windows included.
bemtvi-core.workspace = true
# Decoder for `'imagepreview'` windows: the GUI shares the local filesystem (like
# the TUI), so it decodes the image itself and uploads it as a wgpu texture (see
# src/images.rs). No ratatui-image here — the GUI paints pixels directly.
image.workspace = true
# The workspace dep is `default-features = false`, so re-enable `native`
# explicitly — the sessions use native-gated server items
# (default_runtime/default_shada/ClipboardProvider). Without this the crate only
# builds when bemtvi-server is also a build target (e.g. `cargo test --workspace`),
# which silently turns its default `native` on via feature unification.
bemtvi-server = { workspace = true, features = ["native"] }

[dev-dependencies]
# The shared black-box test harness: `tests/fallback_palette.rs` starts a real server
# and loads the `bemtvi` colorscheme, to check the GUI's built-in colours against it.
bemtvi-test-harness.workspace = true
