[package]
name = "bemtvi-test-harness"
description = "Shared black-box integration-test harness for bemtvi: spawns a real server over an in-process RPC pipe and drives it the way a UI client does."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `atexit` (remove this run's temp root) + `kill(pid, 0)` (is the owner of a
# leftover root still alive?) — see `temp_root` / `sweep_stale_temp_roots`.
libc.workspace = true
bemtvi-core.workspace = true
bemtvi-rpc.workspace = true
# `install::ensure_zig` — the pinned Zig `c_compiler` falls back to on Windows.
bemtvi-ts.workspace = true
# The harness uses `bemtvi_server::{run, ServerInit}`, both gated behind the
# server's `native` feature. The workspace pins `bemtvi-server` with
# `default-features = false` (so the wasm edit-host can opt out), which leaves
# `native` off when this crate is built in isolation (`cargo clippy -p
# bemtvi-test-harness`) — those imports then fail to resolve. Request `native`
# explicitly here: a no-op for the real consumer builds (feature unification
# already turns it on) that also lets the harness compile/lint standalone.
bemtvi-server = { workspace = true, features = ["native"] }
# `Url::from_file_path` (re-exported by lsp-types) for `file_uri`: the same
# serializer the editor's LSP layer uses, so a test-built URI matches the wire
# spelling on every platform (`file:///C:/...` on Windows).
lsp-types.workspace = true
rmpv.workspace = true
tokio.workspace = true
