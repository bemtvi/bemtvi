[package]
name = "nxvim-lua"
description = "Lua runtime and vim.* bindings for nxvim (Lua 5.1, LuaJIT-compatible)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exactly one Lua backend must be enabled (mlua's version features are mutually
# exclusive). `lua51` (vendored PUC Lua 5.1) is the default; `luajit` swaps in
# LuaJIT for benchmarking / closer neovim parity. They flow up unchanged through
# nxvim-server and the nxvim binary, so build the whole stack on LuaJIT with
# `--no-default-features --features luajit`.
default = ["lua51"]
lua51 = ["mlua/lua51"]
luajit = ["mlua/luajit"]

[dependencies]
anyhow.workspace = true
mlua.workspace = true
