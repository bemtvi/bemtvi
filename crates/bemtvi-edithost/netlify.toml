# Netlify configuration for the PYTHON-DEMO site (e.g. bemtvi-demo.netlify.app) — a SEPARATE
# Netlify site from the standard editor, built from this same repo. The standard editor is
# configured by the repo-root ../../netlify.toml; this file configures the demo.
#
# Why a netlify.toml here instead of dashboard build settings: the root netlify.toml's [build]
# command/publish apply to every site whose base directory is the repo root, and file-based
# settings can't be overridden from the UI (the dashboard greys them out). So the demo site must
# resolve a DIFFERENT netlify.toml — which Netlify does by searching the *base directory* before
# the root. Point this site's base directory at this crate and Netlify uses this file, not root.
#
# Dashboard setup for the demo site:
#   Base directory:    crates/bemtvi-edithost      <-- the key setting; makes Netlify read THIS file
#   Build command:     (leave blank — defined below)
#   Publish directory: (leave blank — defined below)
#
# Paths below are relative to the base directory (crates/bemtvi-edithost). The build scripts
# resolve their own absolute paths and cargo auto-discovers the workspace root, so running from
# this crate dir rather than the repo root is fine. The assembled _site-demo/ carries its own
# _headers (cross-origin isolation — required for both the editor's SAB and Pyodide's interrupt)
# and _redirects (/ → /web/), so no [[redirects]] is needed here.
[build]
  command = "bash netlify-build-demo.sh"
  publish = "_site-demo"

[build.environment]
  # Same pinned toolchain as the standard site (see ../../netlify.toml for the rationale).
  NODE_VERSION = "24"
  RUST_VERSION = "1.96.0"
  EMSDK_VERSION = "6.0.0"
