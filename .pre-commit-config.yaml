# Pre-commit hooks for nxvim.
#
# Enable once per clone:  pre-commit install
# Run manually on demand:  pre-commit run --all-files
# Bypass in an emergency:  git commit --no-verify
#
# Install the runner with one of:  pipx install pre-commit | brew install pre-commit
# The Lua hooks need stylua + selene on PATH:  brew install stylua selene
# (or `cargo install stylua selene`).
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust formatting (rustfmt)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint with clippy, treating warnings as errors
        # No `--all-features`: the `lua51` and `luajit` mlua backends are
        # mutually exclusive (mlua-sys `compile_error!`s if both are on), so
        # `--all-features` can't build. Lint the default backend (lua51); the
        # luajit build is covered separately via `--no-default-features
        # --features luajit` when needed.
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # --- First-party Lua (the nxvim prelude) -------------------------------
      # Scoped to crates/nxvim-lua/src/prelude/ only: the vendored neovim copies
      # under src/vendor/nvim/ and the examples/ are intentionally left alone.
      # Config: stylua.toml / selene.toml + the nxvim.yml selene std at the root.
      - id: stylua
        name: stylua
        description: Check Lua formatting (stylua)
        entry: stylua --check
        language: system
        types: [lua]
        files: ^crates/nxvim-lua/src/prelude/.*\.lua$

      - id: selene
        name: selene
        description: Lint Lua, failing on warnings (selene)
        entry: selene
        language: system
        types: [lua]
        files: ^crates/nxvim-lua/src/prelude/.*\.lua$
