[package]
name = "nxvim-core"
description = "Editor model and logic for nxvim (buffers, modes, motions, operators, rendering)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The real vim regexp engine (`nxvim-regex`, vendored C) behind
# `:set regexsyntax=vim`. Off by default: it pulls in a C build, so a pure-Rust
# consumer that needs `wasm32-unknown-unknown` (the `nxvim-web` client) gets a
# C-free core. Host builds enable it via `nxvim-server`'s dependency, so the
# whole workspace (and its tests) compiles it in through feature unification.
default = []
vim-regex = ["dep:nxvim-regex"]

[dependencies]
anyhow.workspace = true
ropey.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
nxvim-regex = { workspace = true, optional = true }
