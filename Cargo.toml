[workspace]
resolver = "2"
members = [
    "crates/nxvim",
    "crates/nxvim-core",
    "crates/nxvim-rpc",
    "crates/nxvim-server",
    "crates/nxvim-lua",
    "crates/nxvim-tui",
    "crates/nxvim-gui",
    "crates/nxvim-ts",
    "crates/nxvim-lsp",
    "crates/nxvim-view",
    "crates/nxvim-test-harness",
    "crates/nxvim-web-bridge",
]
# nxvim-web is the fully client-side WebAssembly build of the editor. It targets
# `wasm32-unknown-unknown` (built via `crates/nxvim-web/build.sh`), so it is NOT a
# workspace member: excluding it keeps it out of the host `cargo build/test/clippy
# --workspace` flow, which can't meaningfully compile or run a wasm cdylib. Being
# excluded, it pins its own dependencies rather than inheriting the workspace's.
exclude = ["crates/nxvim-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/davidrios/nxvim"
rust-version = "1.80"

[workspace.dependencies]
nxvim-core = { path = "crates/nxvim-core" }
nxvim-rpc = { path = "crates/nxvim-rpc" }
# default-features = false so the lua51/luajit backend toggle can be threaded
# through these crates (see the mlua note below). Building any of them as a
# workspace member still applies its own `default` feature (luajit).
nxvim-server = { path = "crates/nxvim-server", default-features = false }
nxvim-lua = { path = "crates/nxvim-lua", default-features = false }
nxvim-tui = { path = "crates/nxvim-tui" }
nxvim-gui = { path = "crates/nxvim-gui" }
nxvim-ts = { path = "crates/nxvim-ts" }
nxvim-lsp = { path = "crates/nxvim-lsp" }
nxvim-view = { path = "crates/nxvim-view" }
# Test-only harness. Inherits `default-features = false` so the lua51/luajit
# backend toggle can be threaded through the crate under test (same pattern as
# nxvim-server above); each consumer re-enables a backend via its own features.
nxvim-test-harness = { path = "crates/nxvim-test-harness", default-features = false }

# Direct dependencies are pinned to exact versions (`=x.y.z`) for reproducible
# builds. Pre-release lines (ropey 2.0-beta, mlua 0.12-rc) are intentionally
# avoided in favor of the latest stable releases.
#
# mlua's Lua-version features (`lua51` vs `luajit`) are mutually exclusive, so
# the version is NOT selected here — only `vendored` is. The version is chosen
# by `nxvim-lua`'s own `luajit` (default) / `lua51` features, threaded up
# through `nxvim-server` and the `nxvim` binary. Build on vendored PUC Lua with
# e.g. `cargo run -p nxvim --no-default-features --features lua51`.
anyhow = "=1.0.102"
ropey = "=2.0.0-beta.1"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
ratatui = "=0.30.0"
# Native GUI client stack (`nxvim-gui`). winit owns the window + input event loop,
# wgpu the GPU surface, and glyphon the text rendering (it re-exports cosmic-text,
# so the GUI reaches `FontSystem`/`Buffer`/`Attrs`/… through `glyphon::`). glyphon
# 0.9 builds against wgpu 25 — bump the two together. `pollster` blocks on wgpu's
# async device/adapter requests from the synchronous winit setup path.
winit = "=0.30.13"
wgpu = "=25.0.2"
glyphon = "=0.9.0"
pollster = "=0.4.0"
# Native system file dialog for the GUI's `:eo`/`:wn`/… pickers — all three
# desktop platforms, no GTK: NSOpenPanel on macOS, the Win32 `IFileDialog` on
# Windows, and the XDG desktop portal (over D-Bus) on Linux/BSD. `xdg-portal` (not
# the default `gtk3`) selects the portal backend and is a no-op on macOS/Windows;
# `default-features = false` also drops rfd's `wayland` feature, so the Linux build
# needs no system Wayland/GTK libraries (the dialog just isn't parented to the
# window on Wayland — it's still a normal top-level). The portal backend needs a
# running `xdg-desktop-portal` service at runtime, standard on modern desktops.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Cross-platform system-clipboard access for the GUI's Cmd+V paste (NSPasteboard /
# Win32 / X11+Wayland, all pure-Rust backends, no GTK), so unlike rfd it's a normal
# dependency. Text only — no image support.
arboard = { version = "=3.6.1", default-features = false }
# Build-dependency (Windows host only): embeds the app icon + version info into
# the nxvim-gui.exe via the Windows SDK's rc.exe. See crates/nxvim-gui/build.rs.
winresource = "=0.1.31"
tokio = { version = "=1.52.3", features = ["rt", "macros", "io-util", "io-std", "net", "sync", "time", "process"] }
# Cross-platform filesystem notification backing `vim.uv.fs_event` in the server's
# event-loop actor. `macos_kqueue` selects the kqueue backend on macOS instead of
# the default FSEvents one: FSEvents' `watch()` talks to the `fseventsd` daemon and
# can block for seconds before it returns, which — on the server's single-threaded
# runtime — would freeze the editor every time a watch is armed; kqueue arms with a
# plain syscall (sub-ms) and needs no daemon. Linux still uses inotify, Windows
# ReadDirectoryChangesW (both already non-blocking). nxvim watches only a handful of
# paths (e.g. lualine's `.git/HEAD`), so kqueue's one-fd-per-watch cost is moot.
notify = { version = "=8.2.0", features = ["macos_kqueue"] }
futures = "=0.3.32"
rmpv = "=1.3.1"
mlua = { version = "=0.11.6", features = ["vendored", "serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.2"
regex = "=1.12.3"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
tree-sitter = "=0.26.9"
streaming-iterator = "=0.1.9"
libloading = "=0.8.9"
# Dev-only: real grammars compiled into a test fixture (never linked into the
# editor — nxvim loads grammars dynamically at runtime). `tree-sitter-md` is a host
# grammar that injects (markdown fenced code blocks → the fence's language), so the
# injection tests can exercise cross-language + nested injections, not just
# rust-in-rust self-injection.
tree-sitter-rust = "=0.24.2"
tree-sitter-md = "=0.5.3"

# `:TSInstall` grammar fetch + compile (nxvim-ts `install` module). All in-process
# so a *prebuilt* nxvim needs no external curl/git/tar at runtime. `ureq` is the
# blocking HTTP client over its bundled rustls (`tls`); rustls builds `ring` at
# *build* time (a cc/perl compile, which whoever builds nxvim has) — the
# runtime-no-compiler goal is about the end user, so this is fine, and it avoids
# the manual TLS-connector wiring `native-tls` would need. GitHub source tarballs
# are `.tar.gz` (`flate2` + `tar`); the fetched Zig toolchain ships `.tar.xz`
# on macOS/Linux (`xz2`) and a `.zip` on Windows (`zip`, reusing `flate2` for
# deflate via its `deflate-flate2` feature so we don't pull a second inflate
# stack). `sha2` verifies the pinned Zig checksum before we execute it.
ureq = { version = "=2.12.0", default-features = false, features = ["tls"] }
tar = "=0.4.46"
flate2 = "=1.1.9"
xz2 = "=0.1.7"
zip = { version = "=4.2.0", default-features = false, features = ["deflate-flate2"] }
sha2 = "=0.10.9"

# LSP client stack — reached only through `nxvim-lsp` (Decision 1/2 of the LSP
# design). async-lsp owns the JSON-RPC `MainLoop`, framing, id correlation, and
# `$/cancelRequest`; lsp-types is the protocol type vocabulary.
#
# `lsp-types` is pinned to the exact version async-lsp 0.2.4 builds against
# (0.95.1, which still uses `url::Url`); a newer line would resolve to a *second*
# lsp-types and the types we construct wouldn't match async-lsp's API. Bump both
# together. `default-features = false` drops async-lsp's `client-monitor`/`stdio`
# (server-side helpers we don't use), keeping only the omni-trait client API and
# the tokio integration.
async-lsp = { version = "=0.2.4", default-features = false, features = ["omni-trait", "tokio"] }
lsp-types = "=0.95.1"
serde_json = "=1.0.150"
# `compat` bridges tokio's child-process pipes to the `futures` AsyncRead/Write
# that async-lsp's MainLoop drives.
tokio-util = { version = "=0.7.18", features = ["compat"] }

# Remote web-client bridge (`nxvim-web-bridge`) — the standalone binary that serves
# the WASM frontend and relays each browser's Socket.IO connection to a per-client
# `nxvim --server` child over its stdio. axum is the HTTP server; `socketioxide` the
# Socket.IO transport layer that rides on it (binary events both ways via `bytes`).
# `rust-embed` bakes the built `crates/nxvim-web/web/` tree into the release binary
# (and reads it from disk in debug); `mime_guess` picks each embedded asset's
# Content-Type.
axum = "=0.8.9"
socketioxide = "=0.18.3"
bytes = "=1.11.1"
rust-embed = "=8.11.0"
mime_guess = "=2.0.5"
# msgpack RPC frames cross the Socket.IO wire as base64 text events: the
# socket.io-client ↔ socketioxide binary-attachment path doesn't interoperate, but
# string events do. The bridge encodes/decodes at the socket boundary.
base64 = "=0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
