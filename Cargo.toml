[workspace]
resolver = "2"
members = [
    "crates/nxvim",
    "crates/nxvim-core",
    "crates/nxvim-rpc",
    "crates/nxvim-server",
    "crates/nxvim-lua",
    "crates/nxvim-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/davidrios/nxvim"
rust-version = "1.80"

[workspace.dependencies]
nxvim-core = { path = "crates/nxvim-core" }
nxvim-rpc = { path = "crates/nxvim-rpc" }
nxvim-server = { path = "crates/nxvim-server" }
nxvim-lua = { path = "crates/nxvim-lua" }
nxvim-tui = { path = "crates/nxvim-tui" }

anyhow = "1"
thiserror = "2"
ropey = "1.6"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
tokio = { version = "1", features = ["rt", "macros", "io-util", "sync", "time"] }
futures = "0.3"
rmpv = "1"
mlua = { version = "0.10", features = ["lua51", "vendored"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
