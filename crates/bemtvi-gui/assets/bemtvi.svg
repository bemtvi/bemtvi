<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- bemtvi native GUI client app icon: an "NX" monogram (N in a blue→cyan
       gradient, X in amber→orange) on a dark rounded square. NOTE: the artwork
       still spells the old name — it has not been redrawn for bemtvi. Source of truth;
       rasterized to PNG at package time (see .github/workflows/build.yml, the
       Linux GUI AppImage step). Reads cleanly down to 48px menu sizes. -->
  <defs>
    <linearGradient id="gn" x1="0" y1="76" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#2ac3de"/>
    </linearGradient>
    <linearGradient id="gx" x1="0" y1="76" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0af68"/><stop offset="1" stop-color="#d68c5a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="#1a1b26"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="56.5" fill="none" stroke="#2f334d" stroke-width="3"/>
  <g fill="none" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#gn)"><path d="M61 174 V82"/><path d="M61 82 L113 174"/><path d="M113 82 V174"/></g>
    <g stroke="url(#gx)"><path d="M147 82 L199 174"/><path d="M199 82 L147 174"/></g>
  </g>
</svg>
