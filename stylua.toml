# stylua formatting for bemtvi's first-party Lua: the prelude
# (crates/bemtvi-lua/src/prelude/) and the runnable demos under examples/, both
# enforced by the pre-commit hook. Matches the existing prelude style: 2-space
# indents, double-quote strings. `.styluaignore` keeps a bare `stylua .` off the
# vendored neovim copies (src/vendor/nvim/) and the two hand-formatted trees.
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
