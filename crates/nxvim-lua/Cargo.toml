[package]
name = "nxvim-lua"
description = "Lua runtime and vim.* bindings for nxvim (Lua 5.1, LuaJIT-compatible)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exactly one Lua backend must be enabled (mlua's version features are mutually
# exclusive). `luajit` is the default (closest neovim parity); `lua51` swaps in
# vendored PUC Lua 5.1. They flow up unchanged through nxvim-server and the nxvim
# binary, so build the whole stack on PUC Lua with
# `--no-default-features --features lua51`.
default = ["luajit"]
lua51 = ["mlua/lua51"]
luajit = ["mlua/luajit"]

[dependencies]
anyhow.workspace = true
mlua.workspace = true
# The treesitter crate, with its `vim.treesitter` Lua binding enabled. nxvim-lua
# owns the Lua VM, so it installs the binding (`nxvim_ts::lua::install`) and
# selects the shared mlua backend (`lua51`/`luajit`) the binding links against.
nxvim-ts = { workspace = true, features = ["lua"] }
# The real vim regexp engine backing `vim.fn.substitute` and `vim.regex` — vim's
# magic dialect including `\zs`/`\ze`, look-around and in-pattern back-references,
# which the previous RE2 translator could not represent.
nxvim-regex.workspace = true
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true
