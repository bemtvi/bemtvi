[package]
name = "bemtvi-gui"
description = "bemtvi's native GUI: the editor in a mitsuami window (bemtvi-mitsuami's view on bemtvi-gpu's client)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "bemtvi-gui"
path = "src/main.rs"


[dependencies]
anyhow.workspace = true
# Real CLI parsing (derive), matching the `bemtvi` (TUI) binary: `--help`/`--version`,
# unknown-flag rejection, and typed values come for free instead of hand-rolled scanning.
clap.workspace = true
tokio.workspace = true
# The client without a toolkit (sessions, the font config), and its mitsuami view, which
# is this window's whole content.
bemtvi-gpu.workspace = true
bemtvi-mitsuami.workspace = true
# The window and its run loop (see the root Cargo.toml).
mitsuami.workspace = true
# The process signals the binary answers (`bemtvi_view::signals`).
bemtvi-view.workspace = true
# The workspace dep is `default-features = false`, so re-enable `native`
# explicitly — main.rs uses native-gated server items (`ConfigSource` and the
# session's daemon dial). Without this the crate only builds when bemtvi-server is
# also a build target (e.g. `cargo test --workspace`), which silently turns its
# default `native` on via feature unification.
bemtvi-server = { workspace = true, features = ["native"] }

# Windows host only: embeds the app icon into bemtvi-gui.exe (see build.rs). Gated
# on the *host* (build scripts run on the host) — our CI builds Windows natively,
# so host == target == windows. Cross-compiling Windows from another host skips
# the embed rather than failing.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# `kill(2)` in the signal e2e test: the killed binary must still run its exit
# sequence (`tests/signal_exit.rs`).
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
