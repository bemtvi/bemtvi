description = "Vim regular expressions for nxvim: the real vim/neovim regexp engines (backtracking + NFA), vendored as C and wrapped in a safe Rust API"
# The vendored engine (csrc/nvim) is Vim-licensed with Apache-2.0 neovim
# modifications; see LICENSE.txt and README.md. The Rust wrapper and shim are
# Apache-2.0 like the rest of the workspace.
license = "Vim AND Apache-2.0"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
cc.workspace = true
