<!doctype html>
<!--
  nxvim — wasm edit-host (the in-browser editor, Phase 5/6).

  The editor core + Lua + OPFS filesystem run in a Web Worker (worker.mjs, the single
  `!Send` thread). THIS file is the renderer + input layer: it ferries keystrokes and
  mouse gestures to the Worker as vim key-notation / nvim_input_mouse, reads the `redraw`
  frame the Worker posts back (the server's own `View` projection), and paints it as
  HTML/CSS — the same DOM renderer the serverless `nxvim-web` build uses, adapted to the
  Worker's async transport. Syntax highlighting is layered client-side via web-tree-sitter
  (highlight.js), since the wasm build omits the native treesitter engine. Transport is a
  SharedArrayBuffer park (slice 5d) when the page is cross-origin isolated, else
  postMessage (slice 5c); both expose the same feed/mouse/execLua/attach ops + the
  `window.__nxvim` automation hook.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>nxvim — wasm edit-host</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --bg: #1e2127; --fg: #abb2bf; --gutter: #4b5263; --gutter-cur: #e5c07b;
    --sel: #3e4451; --search: #e5c07b; --status-bg: #2c313a; --status-fg: #9da5b4;
    --cursor: #61afef; --eob: #4b5263; --accent: #e5c07b;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #grid {
    position: absolute; inset: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    white-space: pre; color: var(--fg); background: var(--bg); overflow: hidden; outline: none;
  }
  #grid .row { position: absolute; left: 0; height: var(--ch); line-height: var(--ch); }
  .win { position: absolute; overflow: hidden; }
  .gutter { color: var(--gutter); }
  .gutter-cur { color: var(--gutter-cur); }
  .eob { color: var(--eob); }
  .sel { background: var(--sel); }
  .search { background: var(--search); color: #1e2127; }
  .incsearch { background: #ffd866; color: #1e2127; }
  .statusline { background: var(--status-bg); color: var(--status-fg); }
  .statusline.focused { color: #e6e6e6; }
  .sep { background: #181a1f; color: var(--gutter); position: absolute; }
  /* Cursor shapes. Block reverses the cell; bar/underline are thin overlays. */
  .cur-block { background: var(--cursor); color: var(--bg); }
  .cur-bar { box-shadow: inset 2px 0 0 0 var(--cursor); }
  .cur-underline { box-shadow: inset 0 -2px 0 0 var(--cursor); }
  .cur-hollow { box-shadow: inset 0 0 0 1px var(--cursor); }
  /* Multi-cursor: placed cursors are reverse-video; the active one is amber. */
  .seccur { background: #d7dae0; color: #1e2127; }
  .cur-mc { background: var(--accent); color: #1e2127; font-weight: 700; }
  .cmdline { position: absolute; left: 0; height: var(--ch); line-height: var(--ch); color: var(--fg); }
  .panel { position: absolute; left: 0; background: #21252b; }
  .panel-title { background: #2c313a; color: var(--accent); }
  .panel-cur { background: var(--sel); }
  .diag-underline { text-decoration: underline wavy; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .inlay { color: #5c6370; font-style: italic; }
  .pmenu { position: absolute; background: #21252b; border: 1px solid #3e4451; z-index: 10; white-space: pre; }
  .pmenu .row { position: static; height: var(--ch); line-height: var(--ch); }
  .pmenu-sel { background: var(--sel); color: #e6e6e6; }
  .pmenu-match { color: #e5c07b; font-weight: bold; }
  .pmenu-prompt { color: #abb2bf; }
  .pmenu-doc { position: absolute; background: #21252b; border: 1px solid #3e4451; z-index: 10; white-space: pre; color: var(--status-fg); }
  .pmenu-doc .row { position: static; height: var(--ch); line-height: var(--ch); }
  /* A tiny boot/transport indicator, hidden shortly after the first frame. */
  #status { position: fixed; right: 6px; bottom: 4px; font-size: 11px; opacity: .4;
            color: #5c6370; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
  <div id="grid" tabindex="0"></div>
  <div id="status">booting…</div>

  <script type="module">
    // Syntax highlighting is optional: highlight.js statically imports the
    // web-tree-sitter vendor assets (built by build.sh → npm run build:treesitter).
    // When those aren't present the import fails — degrade to plain (un-highlighted)
    // rendering rather than breaking the whole page.
    let createHighlighter = null, colorFor = () => null;
    try {
      ({ createHighlighter, colorFor } = await import("./highlight.js"));
    } catch (e) {
      console.warn("nxvim: syntax highlighting unavailable (tree-sitter vendor not built):", e);
    }

    const FONT_PX = 15, LINE = 1.4;
    const gridEl = document.getElementById("grid");
    const statusEl = document.getElementById("status");

    let view = null;          // the latest redraw frame (the server's View map)
    let bufferText = "";      // the focused buffer's full text, for the highlighter
    let ts = null;            // tree-sitter highlighter (loaded lazily by language)
    let cw = 9, ch = 21;
    let cols = 80, editorRows = 24; // editorRows = grid rows minus the command row

    // ============================================================================
    // Cell metrics + grid size. The core lays windows out in `editorRows` (the
    // windows area); the command/message line is THIS client's own extra row, so we
    // attach `editorRows` and paint the command line at row `editorRows`. (Matching
    // the TUI client and core's `relayout`, which excludes the command row.)
    // ============================================================================
    function measureCell() {
      const probe = document.createElement("span");
      probe.style.cssText = `position:absolute;visibility:hidden;font-family:${getComputedStyle(gridEl).fontFamily};font-size:${FONT_PX}px;`;
      probe.textContent = "M".repeat(100);
      gridEl.appendChild(probe);
      cw = probe.getBoundingClientRect().width / 100;
      probe.remove();
      ch = Math.round(FONT_PX * LINE);
      gridEl.style.fontSize = FONT_PX + "px";
      gridEl.style.setProperty("--ch", ch + "px");
    }
    function layout() {
      const rect = gridEl.getBoundingClientRect();
      cols = Math.max(20, Math.floor(rect.width / cw));
      const totalRows = Math.max(4, Math.floor(rect.height / ch));
      editorRows = totalRows - 1; // reserve the command row, like the TUI client
    }
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => (c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;"));
    }

    // ============================================================================
    // Worker transport. Two modes, picked by capability: SAB (slice 5d) when the
    // page is cross-origin isolated so timers can fire via the Worker's Atomics.wait
    // park, else postMessage (slice 5c). Both expose the same feed/mouse/execLua/
    // attach promises to the renderer + hook below.
    // ============================================================================
    // Daemon mode (Phase 6b): `?daemon=nxvim://HOST:PORT/TOKEN?cert=HASH` on the page URL
    // makes the edit-host open/save files over WebTransport against a remote `nxvim
    // --daemon --listen`, instead of the serverless OPFS sandbox. The URI is forwarded to
    // the Worker on its own script URL (so the Worker self-configures with no boot race);
    // no param = serverless OPFS (unchanged). Config + shada stay local either way.
    // The same connection can also be made *at runtime* with `:connect nxvim://…` (no page
    // param needed) — intercepted on `<CR>` like the file pickers below (`tryConnectIntercept`).
    const workerUrl = new URL("./worker.mjs", import.meta.url);
    const daemonUri = new URLSearchParams(location.search).get("daemon");
    if (daemonUri) workerUrl.searchParams.set("daemon", daemonUri);
    const worker = new Worker(workerUrl, { type: "module" });
    // Surface a worker that fails to *load* (a module-eval / import error). Without this a
    // broken worker is silent — the `ready` promise just never resolves and the editor
    // appears to hang. Log it loudly so it's diagnosable (e.g. in the Playwright verifiers).
    worker.onerror = (e) => console.error("edit-host worker load error:", e.message || e, e.filename || "", e.lineno || "");
    const useSAB = self.crossOriginIsolated && typeof SharedArrayBuffer !== "undefined";
    let latest = { frame: null, lines: "" };
    let readyResolve;
    const readyPromise = new Promise((res) => (readyResolve = res));

    // SAB channel (5d): ctrl = [SEQ, WRITE, READ, _]; data = byte ring of framed input.
    const SEQ = 0, WRITE = 1, READ = 2;
    let ctrl, data, dataCap;
    let nextReqId = 1;
    const pendingAcks = new Map();    // reqId → resolver (feed/mouse/attach)
    const pendingResults = new Map(); // reqId → resolver (exec_lua, resolves with result)
    const pendingMsg = new Map();     // postMessage fallback (5c) request map

    // Real local files opened via the native picker (`:eo`/`:wo`/…). Keyed by the editor
    // path — the picked file's name, which is exactly what `:e <name>` / `:w <name>` make
    // the buffer's path — so the Worker's off-tick read/write for that path is fulfilled
    // here against the granted FileSystemFileHandle (see worker.mjs's boundPaths routing).
    const fsHandles = new Map();
    const fsApiAvailable =
      typeof self.showOpenFilePicker === "function" && typeof self.showSaveFilePicker === "function";

    function wrU32(pos, v) {
      data[(pos) % dataCap] = v & 0xff;
      data[(pos + 1) % dataCap] = (v >>> 8) & 0xff;
      data[(pos + 2) % dataCap] = (v >>> 16) & 0xff;
      data[(pos + 3) % dataCap] = (v >>> 24) & 0xff;
    }
    // Write a framed message into the ring and wake the worker. Returns the reqId.
    function pushFrame(type, payload) {
      const reqId = nextReqId++ >>> 0;
      let wp = Atomics.load(ctrl, WRITE) >>> 0;
      data[wp % dataCap] = type;
      wrU32(wp + 1, reqId);
      wrU32(wp + 5, payload.length);
      for (let i = 0; i < payload.length; i++) data[(wp + 9 + i) % dataCap] = payload[i];
      Atomics.store(ctrl, WRITE, (wp + 9 + payload.length) >>> 0);
      Atomics.add(ctrl, SEQ, 1);
      Atomics.notify(ctrl, SEQ, 1);
      return reqId;
    }
    const enc = (s) => new TextEncoder().encode(s);

    // The transport-agnostic ops the renderer + hook call.
    function feedOp(notation) {
      if (useSAB) return new Promise((r) => pendingAcks.set(pushFrame(0, enc(notation)), r));
      return sendMsg("feed", { notation });
    }
    function execLuaOp(code) {
      if (useSAB) return new Promise((r) => pendingResults.set(pushFrame(1, enc(code)), r));
      return sendMsg("exec_lua", { code });
    }
    function attachOp(c, r) {
      if (useSAB) {
        const payload = new Uint8Array(8);
        new DataView(payload.buffer).setUint32(0, c, true);
        new DataView(payload.buffer).setUint32(4, r, true);
        return new Promise((res) => pendingAcks.set(pushFrame(2, payload), res));
      }
      return sendMsg("attach", { cols: c, rows: r });
    }
    // A mouse gesture (nvim_input_mouse strings + a 0-based global screen cell).
    function mouseOp(button, action, modifier, row, col) {
      if (useSAB) {
        const payload = enc(JSON.stringify({ b: button, a: action, m: modifier, r: row, c: col }));
        return new Promise((res) => pendingAcks.set(pushFrame(3, payload), res));
      }
      return sendMsg("input_mouse", { button, action, modifier, row, col });
    }
    function sendMsg(type, extra) {
      const id = nextReqId++;
      return new Promise((resolve) => {
        pendingMsg.set(id, resolve);
        worker.postMessage({ id, type, ...extra });
      });
    }
    // Tell the Worker a path resolves to a real-FS handle. It must reach the Worker before
    // the `:e`/`:w` that references it: a ring frame under SAB (ordered with the feeds in
    // the same channel), a message under 5c (FIFO with the feed messages). Fire-and-forget.
    function bindOp(path) {
      if (useSAB) pushFrame(4, enc(path));
      else worker.postMessage({ type: "bind", path });
    }
    // Ask the Worker to dial a daemon at runtime (`:connect nxvim://…`) and re-point the
    // off-tick fs/watch seam from OPFS onto the wire — a ring frame under SAB (ordered after
    // the `<Esc>` feed that dismissed the command line), a message under 5c. Fire-and-forget;
    // the Worker reports the outcome with a `connected` message (flashed below). Ring type 7
    // (type 6 is `:TSInstall`'s `tsInstallResultOp` — keep these distinct).
    function connectOp(uri) {
      if (useSAB) pushFrame(7, enc(uri));
      else worker.postMessage({ type: "connect", uri });
    }
    // Ask the Worker to persist cross-session (shada) state now, with the exit cursor — a
    // ring frame under SAB, a message under 5c. Resolves when the Worker reports the write
    // (the `shada_written` message). Used on tab-hide and by the automation hook.
    const shadaWrittenWaiters = [];
    function requestShadaFlush() {
      if (useSAB) pushFrame(5, new Uint8Array(0));
      else worker.postMessage({ type: "shada_flush" });
      return new Promise((res) => shadaWrittenWaiters.push(res));
    }
    // Report a `:TSInstall` outcome back to the Worker (so the core echoes + records it) — a
    // ring type-6 frame under SAB, a message under 5c, matching `bind`/`shada_flush`.
    function tsInstallResultOp(lang, ok, msg) {
      if (useSAB) pushFrame(6, enc(JSON.stringify({ lang, ok, msg })));
      else worker.postMessage({ type: "ts_install_result", lang, ok, msg });
    }
    // Push the OS clipboard's text into the Worker's `"+`/`"*` read mirror — a ring type-8
    // frame under SAB (ordered with the feeds, so it lands before a following `"+p`), a
    // message under 5c. Fire-and-forget.
    function clipboardPushOp(text) {
      if (useSAB) pushFrame(8, enc(text));
      else worker.postMessage({ type: "clipboard_push", text });
    }
    // Refresh the editor's `"+`/`"*` read mirror from `navigator.clipboard`. The editor's
    // synchronous register read can't await the (async, Window-only) clipboard, so we push its
    // contents *ahead* of a paste — on focus / tab-return / click, when the document is focused
    // and clipboard-read permission holds — so a `"+p` sees a copy made in another app. A copy
    // made *inside* nxvim needs no refresh: the yank already updated the mirror (and wrote out
    // to the OS clipboard). Best-effort: no permission / not focused leaves the mirror as-is.
    let clipboardRefreshing = false;
    async function refreshClipboard() {
      if (clipboardRefreshing || !navigator.clipboard?.readText) return;
      clipboardRefreshing = true;
      try { clipboardPushOp(await navigator.clipboard.readText()); }
      catch { /* permission denied / not focused / empty — keep the existing mirror */ }
      finally { clipboardRefreshing = false; }
    }

    let statusHideTimer = null;
    // Briefly show a transient message in the corner indicator (picker errors, etc.).
    function flashStatus(text, color = "#e5c07b") {
      clearTimeout(statusHideTimer);
      statusEl.style.display = "";
      statusEl.style.opacity = "1";
      statusEl.style.color = color;
      statusEl.textContent = text;
      statusHideTimer = setTimeout(() => { statusEl.style.display = "none"; }, 4000);
    }
    worker.onmessage = async (ev) => {
      const msg = ev.data;
      // Real-FS picker plumbing: the Worker routes a bound path's read/write here (its
      // handle is UI-side) and we fulfill it against the real file, then report back.
      if (msg.type === "fs_read") {
        const handle = fsHandles.get(msg.path);
        const res = handle
          ? await realFsRead(handle)
          : { kind: 3, text: `no file handle for ${msg.path}` };
        worker.postMessage({ type: "fs_read_result", buffer: msg.buffer, path: msg.path, kind: res.kind, text: res.text });
        return;
      }
      if (msg.type === "fs_write") {
        const handle = fsHandles.get(msg.path);
        const res = handle
          ? await realFsWrite(handle, msg.bytes)
          : { ok: false, error: `no file handle for ${msg.path}` };
        worker.postMessage({ type: "fs_write_result", seq: msg.seq, ok: res.ok, size: res.size || 0, error: res.error || "" });
        return;
      }
      // The Worker persisted cross-session (shada) state — resolve any pending flush.
      if (msg.type === "shada_written") {
        shadaWrittenWaiters.splice(0).forEach((r) => r(msg));
        return;
      }
      // `:TSInstall <lang>` — the core asked us to install a grammar (web-tree-sitter lives
      // here, UI-side). Fetch/cache/register it, then report the outcome back so the core
      // echoes it. A repaint on success comes for free via the highlighter's onReady.
      if (msg.type === "ts_install") {
        const lang = String(msg.lang);
        const res = (ts && ts.install)
          ? await ts.install(lang)
          : { ok: false, msg: "syntax highlighter unavailable (tree-sitter vendor not built)" };
        // Report the canonical name the highlighter resolved (e.g. `c#` → `c_sharp`) so the
        // core's echo + `:TSInstallInfo` record match what's cached in OPFS.
        tsInstallResultOp(res.name || lang, res.ok, res.msg || "");
        return;
      }
      // A `"+`/`"*` yank/delete — write the text to the real clipboard (only the UI thread can
      // reach `navigator.clipboard`). Best-effort: a denied write is a no-op, not a crash.
      if (msg.type === "clipboard_write") {
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(msg.text).catch(() => {});
        return;
      }
      // A runtime `:connect nxvim://…` finished dialing — flash the outcome (the fs/watch seam
      // is now on the wire on success; on failure the editor stays on serverless OPFS).
      if (msg.type === "connected") {
        if (msg.ok) flashStatus("connected to daemon", "#98c379");
        else flashStatus("connect failed: " + (msg.error || "unknown"), "#e06c75");
        return;
      }
      if (msg.type === "fatal") {
        statusEl.style.opacity = "1";
        statusEl.style.color = "#e06c75";
        statusEl.textContent = "FATAL: " + msg.error;
        console.error("edit-host worker fatal:", msg.error);
        return;
      }
      if (msg.type === "config_error") {
        // A broken /init.lua is non-fatal — the editor still boots. Surface it so the
        // user can fix the config rather than wonder why it didn't apply.
        clearTimeout(statusHideTimer);
        statusEl.style.display = "";
        statusEl.style.opacity = "1";
        statusEl.style.color = "#e5c07b";
        statusEl.textContent = "init.lua error: " + msg.error;
        console.error("nxvim init.lua:", msg.error);
        return;
      }
      if (msg.type === "ready") {
        layout();
        if (useSAB) {
          ctrl = new Int32Array(new SharedArrayBuffer(16));
          const sab = new SharedArrayBuffer(1 << 16);
          data = new Uint8Array(sab);
          dataCap = data.length;
          worker.postMessage({ type: "init", ctrl: ctrl.buffer, data: sab, cols, rows: editorRows });
          markReady();
        } else {
          attachOp(cols, editorRows).then(markReady);
        }
        return;
      }
      if (msg.type === "redraw") {
        setFrame(msg.frame, msg.lines);
        // 5c: a single id reply. 5d: batched acks + exec_lua results.
        if (msg.id !== undefined) {
          const resolve = pendingMsg.get(msg.id);
          if (resolve) { pendingMsg.delete(msg.id); resolve({ frame: msg.frame, lines: msg.lines, result: msg.result }); }
        }
        for (const reqId of msg.acks || []) {
          const r = pendingAcks.get(reqId);
          if (r) { pendingAcks.delete(reqId); r({ frame: msg.frame, lines: msg.lines }); }
        }
        for (const [reqId, result] of msg.results || []) {
          const r = pendingResults.get(reqId);
          if (r) { pendingResults.delete(reqId); r({ frame: msg.frame, lines: msg.lines, result }); }
        }
      }
    };

    function markReady() {
      statusEl.textContent = `nxvim wasm edit-host — ${cols}×${editorRows + 1} — ${useSAB ? "SAB+timers" : "postMessage"}`;
      clearTimeout(statusHideTimer);
      statusHideTimer = setTimeout(() => { statusEl.style.display = "none"; }, 1500);
      gridEl.focus();
      readyResolve();
    }

    // Adopt a freshly posted redraw frame: normalize the server map to the field
    // names the ported renderer expects, stash the buffer text for the highlighter,
    // then paint. The server map differs from the serverless `WebEditor` view_json in
    // two key names only — `mode_label` (top-level mode) and `cursors` (the secondary
    // multi-cursors) — so bridge those rather than fork the renderer.
    function setFrame(frame, lines) {
      latest = { frame, lines: lines ?? latest.lines };
      if (!frame) { view = null; gridEl.innerHTML = ""; return; }
      frame.mode = frame.mode_label;
      for (const w of frame.windows || []) w.secondary_cursors = w.cursors || [];
      view = frame;
      if (lines != null) bufferText = lines;
      applyView();
    }

    // ============================================================================
    // Syntax highlighting (client-side web-tree-sitter, exactly as nxvim-web). The
    // highlighter loads grammars asynchronously; when the runtime or a grammar becomes
    // ready it asks for a repaint. Coalesce those into one frame.
    // ============================================================================
    let tsPending = false;
    function tsRefresh() {
      if (tsPending) return;
      tsPending = true;
      requestAnimationFrame(() => { tsPending = false; if (view) render(); });
    }

    // Syntax-highlight context for this frame: the focused buffer's per-line capture
    // spans, plus the file it belongs to. Returns null when there's nothing to
    // highlight (runtime not ready, unsupported file, or grammar still loading). The
    // buffer text comes from the Worker (the focused buffer's full contents), not a
    // synchronous editor call. Other windows showing the SAME file reuse this.
    function highlightContext() {
      if (!ts || !ts.isReady()) return null;
      const fw = view.windows.find((w) => w.focused) || view.windows[0];
      if (!fw) return null;
      const lang =
        ts.langForFiletype(fw.filetype) || (fw.unnamed ? null : ts.langForName(fw.file_name));
      if (!lang) return null;
      const spans = ts.spansForBuffer(lang, bufferText);
      return spans ? { file: fw.file_name, spans } : null;
    }

    // ============================================================================
    // The renderer — ported from nxvim-web/web/index.html. Reads the global `view`
    // (the redraw frame) and paints per-cell spans into #grid. serverStyled keys on a
    // resolved colorscheme palette; the wasm build emits an empty palette, so the
    // in-page highlighter path is taken (the palette path is kept dormant for a future
    // palette-bearing frame).
    // ============================================================================
    let serverStyled = false;

    // ---- smooth scrolling ----
    let scrollAnim = null; // in-flight slide, or null
    let scrollRAF = 0;
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

    function applyView() {
      const w = focusedWindow();
      const s = w?.scroll;
      if (s && s.duration_ms > 0) { armScroll(w, s); return; }
      if (scrollAnim && repaintsDestination(w)) return; // let the slide finish
      cancelScroll();
      render();
    }
    function repaintsDestination(w) {
      if (!w || !scrollAnim) return false;
      const a = scrollAnim;
      return w.numbers?.[0] === Math.round(a.to_top) + 1
        && w.cursor_line === Math.round(a.to_cursor) + 1;
    }
    function armScroll(w, s) {
      cancelScroll();
      scrollAnim = {
        from_top: s.from_top, to_top: s.to_top,
        from_cursor: s.from_cursor, to_cursor: s.to_cursor,
        duration: s.duration_ms, base_line: s.base_line,
        band: bandWindow(w, s), start: performance.now(), strip: null,
      };
      render();
      scrollRAF = requestAnimationFrame(stepScroll);
    }
    function scrollProgress(a, now) {
      return Math.min(1, Math.max(0, (now - a.start) / a.duration));
    }
    function stepScroll(now) {
      const a = scrollAnim;
      if (!a) return;
      const t = scrollProgress(a, now);
      if (a.strip) a.strip.style.transform = `translate3d(0, ${stripOffset(a, easeOutCubic(t))}px, 0)`;
      if (t < 1) { scrollRAF = requestAnimationFrame(stepScroll); return; }
      scrollAnim = null;
      scrollRAF = 0;
      render();
    }
    function stripOffset(a, e) {
      const topF = a.from_top + (a.to_top - a.from_top) * e;
      return (a.base_line - topF) * ch;
    }
    function bandWindow(w, s) {
      const n = s.lines.length;
      const blanks = Array.from({ length: n }, () => []);
      return Object.assign({}, w, {

        const idx = start + i;
        const label = String(menu.items[idx] ?? "");
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (idx === menu.selected ? " pmenu-sel" : "");
        rowEl.style.width = menu.width * cw + "px";
        // Bold + accent the matched characters (the fuzzy match), per the server's
        // char-based spans; plain text when this picker/select has no spans.
        const spans = (menu.match_spans && menu.match_spans[idx]) || [];
        const chars = [...label].slice(0, menu.width);
        if (spans.length === 0) {
          rowEl.textContent = chars.join("").padEnd(menu.width);
        } else {
          chars.forEach((chr, ci) => {
            const matched = spans.some(([s, e]) => ci >= s && ci < e);
            if (matched) {
              const m = document.createElement("span");
              m.className = "pmenu-match";
              m.textContent = chr;
              rowEl.appendChild(m);
            } else {
              rowEl.appendChild(document.createTextNode(chr));
            }
          });
          const pad = menu.width - chars.length;
          if (pad > 0) rowEl.appendChild(document.createTextNode(" ".repeat(pad)));
        }
        box.appendChild(rowEl);
      }
      gridEl.appendChild(box);
    }

    // A synthesized status line (the wasm build emits no %-format statusline segments
    // for laststatus modes 1/2): MODE  filename [+]            line,col
    function renderStatus(box, w, atRow) {
      const name = w.unnamed ? "[No Name]" : (w.file_name || "[No Name]");
      const mod = w.modified ? " [+]" : "";
      const modeTag = view.mode ? view.mode + "  " : "";
      const left = `${modeTag}${name}${mod}`;
      const right = `${w.cursor_line},${w.cursor_col + 1}`;
      const width = winRect(w).width;
      const pad = Math.max(1, width - left.length - right.length - 1);
      const text = (" " + left + " ".repeat(pad) + right + " ").slice(0, width).padEnd(width);
      const el = document.createElement("div");
      el.className = "row statusline" + (w.focused ? " focused" : "");
      el.style.top = atRow * ch + "px";
      el.style.width = width * cw + "px";
      el.textContent = text;
      box.appendChild(el);
    }

    function renderSeparators(tablineRows) {
      for (const s of view.separators) {
        const o = regionOrigin(s.region, tablineRows);
        const el = document.createElement("div");
        el.className = "sep";
        if (s.vertical) {
          place(el, o.x + s.x, o.y + s.y, 1, s.length);
          el.textContent = Array(s.length).fill("│").join("\n");
          el.style.lineHeight = ch + "px";
        } else {
          place(el, o.x + s.x, o.y + s.y, s.length, 1);
          el.textContent = "─".repeat(s.length);
          el.style.lineHeight = ch + "px";
        }
        gridEl.appendChild(el);
      }
      // The border line between each open dock and the main area.
      const g = dockGeo(tablineRows);
      const sepLine = (x, y, wCells, hCells, glyph, vertical) => {
        const el = document.createElement("div");
        el.className = "sep";
        place(el, x, y, wCells, hCells);
        el.textContent = vertical ? Array(hCells).fill(glyph).join("\n") : glyph.repeat(wCells);
        el.style.lineHeight = ch + "px";
        gridEl.appendChild(el);
      };
      // Heavy box-drawing glyphs (━/┃) mark a permanent dock edge, distinct from
      // the light (─/│) borders between ordinary window splits drawn above.
      if (g.dt > 0) sepLine(0, g.dt, cols, 1, "━", false);
      if (g.db > 0) sepLine(0, g.midY + g.midH + g.globalStatusRows, cols, 1, "━", false);
      if (g.dl > 0) sepLine(g.dl, g.midY, 1, g.midH, "┃", true);
      if (g.dr > 0) sepLine(cols - g.dr - 1, g.midY, 1, g.midH, "┃", true);
    }
    function renderFloat(w, tablineRows, hl) {
      renderWindow(w, tablineRows, hl);
    }
    // Paint tabline cells (` ▸{count}{label}{+} `, the active cell marked) for a
    // `{ tabs, current }` at cell (x, y) spanning `width` cells, preceded by an
    // optional `title` label (the nx.dock dock title). Shared by the global (main)
    // tabline and each dock's own tabline.
    function renderTabCells(tabs, current, x, y, width, title) {
      const el = document.createElement("div");
      el.className = "row statusline";
      el.style.left = x * cw + "px";
      el.style.top = y * ch + "px";
      el.style.width = width * cw + "px";
      let s = title ? ` ${title} ` : "";
      tabs.forEach((t, i) => {
        const count = t.window_count > 1 ? t.window_count + " " : "";
        const mark = i === current ? "▸" : " ";
        s += ` ${mark}${count}${t.label}${t.modified ? "+" : ""} `;
      });
      el.textContent = s;
      gridEl.appendChild(el);
    }
    function renderTabline(y) {
      renderTabCells(view.tabline, view.current_tab, 0, y, cols, "");
    }
    // Each open dock paints its own tabline into its band's first row.
    function renderDockTablines(tablineRows) {
      const g = dockGeo(tablineRows);
      const bottomY = g.midY + g.midH + g.globalStatusRows + (g.bottomBand - g.db);
      const docks = [
        ["dock_top", 0, 0, cols],
        ["dock_bottom", 0, bottomY, cols],
        ["dock_left", 0, g.midY, g.dl],
        ["dock_right", cols - g.dr, g.midY, g.dr],
      ];
      for (const [region, x, y, width] of docks) {
        if (!dockTl(region, g)) continue;
        const rt = regionTabs(region);
        renderTabCells(rt.tabs, rt.current, x, y, width, rt.title || "");
      }
    }
    function renderPanel(panel, cmdRow) {
      const borderRow = cmdRow - (panel.height + 1);
      const titleEl = document.createElement("div");
      titleEl.className = "row panel-title";
      titleEl.style.top = borderRow * ch + "px";
      titleEl.style.width = cols * cw + "px";
      titleEl.textContent = `─ ${panel.title} ` + "─".repeat(Math.max(0, cols - panel.title.length - 6)) + "[X]─";
      gridEl.appendChild(titleEl);
      const curEnd = panel.cursor_row + Math.max(1, panel.cursor_span);
      for (let r = 0; r < panel.height; r++) {
        const rowEl = document.createElement("div");
        rowEl.className = "row" + (r >= panel.cursor_row && r < curEnd ? " panel-cur" : "");
        rowEl.style.top = (borderRow + 1 + r) * ch + "px";
        rowEl.style.width = cols * cw + "px";
        rowEl.textContent = panel.lines[r] ?? "";
        gridEl.appendChild(rowEl);
      }
    }
    function renderCommand(cmdRow) {
      const el = document.createElement("div");
      el.className = "cmdline";
      el.style.top = cmdRow * ch + "px";
      el.style.width = cols * cw + "px";
      if (view.command_mode) {
        const prompt = view.cmdline_prompt || view.cmdline_prefix;
        const text = prompt + view.cmdline;
        const curIdx = [...prompt].length + view.cmdline_cursor;
        const chars = [...text];
        let html = "";
        for (let i = 0; i < chars.length; i++) {
          html += i === curIdx ? `<span class="cur-block">${escapeHtml(chars[i])}</span>` : escapeHtml(chars[i]);
        }
        if (curIdx >= chars.length) html += `<span class="cur-block"> </span>`;
        el.innerHTML = html;
      } else {
        el.textContent = view.message || "";
      }
      gridEl.appendChild(el);
    }
    function focusedWindow() { return (view.windows || []).find((w) => w.focused) || view.windows?.[0]; }
    function promptStr(frame) {
      return frame.cmdline_prompt && frame.cmdline_prompt.length ? frame.cmdline_prompt : frame.cmdline_prefix || "";
    }

    // ============================================================================
    // Keyboard → vim key-notation. Unlike nxvim-web (which has the shared nxvim-view
    // encoder as a synchronous FFI call), the Worker tick only takes vim notation, so
    // we encode the browser event to notation here and feed it.
    // ============================================================================
    const SPECIAL = {
      Enter: "CR", Escape: "Esc", Backspace: "BS", Tab: "Tab", Delete: "Del",
      ArrowLeft: "Left", ArrowRight: "Right", ArrowUp: "Up", ArrowDown: "Down",
      Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown",
    };
    function keyToNotation(e) {
      const mods = [];
      if (e.ctrlKey) mods.push("C");
      if (e.altKey) mods.push("A");
      if (e.metaKey) mods.push("D");
      let base = SPECIAL[e.key];
      const isSpecial = !!base;
      if (!base) {
        // With a Ctrl/Alt modifier read e.code so the BASE letter survives composition.
        if ((e.ctrlKey || e.altKey) && /^Key[A-Z]$/.test(e.code)) {
          const m = e.code.slice(3);
          base = e.shiftKey ? m : m.toLowerCase();
        } else if ((e.ctrlKey || e.altKey) && /^Digit\d$/.test(e.code)) {
          base = e.code.slice(5);
        } else if (e.key === " ") base = "Space";
        else if (e.key.length === 1) base = e.key === "<" ? "lt" : e.key;
        else return null; // bare modifier / unhandled key
      }
      if (mods.length === 0) {
        if (isSpecial || base === "Space" || base === "lt") return `<${base}>`;
        return base;
      }
      return `<${mods.join("-")}-${base}>`;
    }

    // ============================================================================
    // Native file picker — the `:eo` / `:wo` / … family (mirrors nxvim-gui's rfd dialogs,
    // adapted to the browser's File System Access API). `<CR>` over one of these `:`
    // command lines opens the OS picker instead of running the command verbatim, then
    // drives the real open/save with the picked handle. The handle (not a path) is the
    // capability, so we register it under the file's name and `bind` that name; the
    // editor's off-tick read/write for the name then routes to the handle (worker.mjs).
    // ============================================================================

    // The base verb to run after the *open* picker, or null — ports nxvim-gui's
    // `open_dialog_verb`: the `…o` family + bare `:e`/`:edit` (an alias of `:eo`).
    function openDialogVerb(cmd) {
      switch (cmd) {
        case "e": case "ed": case "edi": case "edit": case "eo": return "e";
        case "spo": return "sp";
        case "vso": return "vs";
        case "tabeo": return "tabe";
        case "newo": return "new";
        case "vnewo": return "vnew";
        default: return null;
      }
    }
    // Whether `<CR>` should pop the *save* picker: `:wo` always, or a bare `:w`/`:write` on
    // an unnamed buffer (no file to write to). Ports nxvim-gui's `save_dialog_needed`.
    function saveDialogNeeded(cmd, unnamed) {
      if (cmd === "wo") return true;
      return unnamed && (cmd === "w" || cmd === "wr" || cmd === "wri" || cmd === "writ" || cmd === "write");
    }
    function focusedView() {
      const f = latest.frame;
      if (!f) return null;
      return (f.windows || []).find((w) => w.focused) || f.windows?.[0] || null;
    }
    function pickerUnavailable(what) {
      flashStatus(`${what}: this browser has no File System Access API (try Chrome/Edge)`, "#e06c75");
    }
    // Run an ex command by feeding `:<cmd><CR>` as key notation (the Worker tick takes
    // notation via nvim_input, not a direct nvim_command — so the `:` and `<CR>` are
    // required). A literal `<` in a filename would be read as notation, so escape it.
    function runExCommand(cmd) {
      return feedOp(`:${cmd.replace(/</g, "<lt>")}<CR>`);
    }

    // Decide *synchronously* (so the picker call stays inside the keystroke's user gesture)
    // whether `<CR>` over the current `:` command line should pop a file picker. Returns
    // true if it handled the `<CR>` (the caller then skips feeding it). Only `:`-prefixed.
    function tryFilePickerIntercept() {
      const f = latest.frame;
      if (!f || !f.command_mode) return false;
      const prefix = f.cmdline_prompt || f.cmdline_prefix || "";
      if (prefix !== ":") return false;
      const cmd = (f.cmdline || "").trim();
      const verb = openDialogVerb(cmd);
      if (verb) { startOpenPicker(verb); return true; }
      const fw = focusedView();
      if (saveDialogNeeded(cmd, fw ? fw.unnamed : true)) { startSavePicker(fw); return true; }
      return false;
    }

    // Decide *synchronously* whether `<CR>` over a `:connect nxvim://…` command line should
    // dial a daemon instead of running an ex-command (there is none — the editor core knows
    // nothing of `:connect`). The browser twin of nxvim-gui's client-side `:connect`
    // interception: the UI owns the daemon transport, so it handles the command here and asks
    // the Worker to re-point the off-tick fs/watch seam onto the wire (`connectOp`). Only the
    // daemon's own `nxvim://` scheme is accepted; anything else is rejected loudly (fail loud,
    // matching nxvim-gui rejecting a mistyped `nvim://`). Returns true if it handled the `<CR>`.
    function tryConnectIntercept() {
      const f = latest.frame;
      if (!f || !f.command_mode) return false;
      const prefix = f.cmdline_prompt || f.cmdline_prefix || "";
      if (prefix !== ":") return false;
      const parts = (f.cmdline || "").trim().split(/\s+/);
      if (parts[0] !== "connect" && parts[0] !== "Connect") return false;
      feedOp("<Esc>"); // dismiss the command line regardless of the argument's validity
      const arg = parts[1] || "";
      if (!arg.startsWith("nxvim://")) {
        flashStatus(":connect needs an nxvim:// daemon URI", "#e06c75");
        return true;
      }
      connectOp(arg);
      flashStatus("connecting to daemon…");
      return true;
    }

    // Pop the open picker, then `:<verb> <name>` the chosen file. `<Esc>` first so the
    // half-typed `:eo` command line clears even if the user cancels the picker.
    function startOpenPicker(verb) {
      feedOp("<Esc>");
      if (!fsApiAvailable) { pickerUnavailable("open"); return; }
      self.showOpenFilePicker({ multiple: false }).then(async ([handle]) => {
        // Request write access up front (within the picker's activation) so a later bare
        // `:w` to this handle needs no fresh gesture; read-only is fine if declined.
        try { await handle.requestPermission?.({ mode: "readwrite" }); } catch {}
        const path = handle.name;
        fsHandles.set(path, handle);
        bindOp(path);
        runExCommand(`${verb} ${path}`);
      }).catch((e) => { if (e?.name !== "AbortError") flashStatus("open failed: " + (e?.message || e), "#e06c75"); });
    }

    // Pop the save picker, then `:w <name>` the buffer to the chosen file. nxvim's
    // `:w <path>` both writes *and* renames the buffer to that path, so the buffer becomes
    // bound to the real file and future bare `:w`s write straight back to it.
    function startSavePicker(fw) {
      feedOp("<Esc>");
      if (!fsApiAvailable) { pickerUnavailable("save"); return; }
      const opts = {};
      if (fw && !fw.unnamed && fw.file_name) opts.suggestedName = fw.file_name.split("/").pop();
      self.showSaveFilePicker(opts).then((handle) => {
        const path = handle.name;
        fsHandles.set(path, handle);
        bindOp(path);
        runExCommand(`w ${path}`);
      }).catch((e) => { if (e?.name !== "AbortError") flashStatus("save failed: " + (e?.message || e), "#e06c75"); });
    }

    // Read a bound file's real bytes for the Worker (off-tick `:e`): { kind, text } where
    // kind 0 = file contents, 3 = error (per eh_fs_read_complete's contract).
    async function realFsRead(handle) {
      try {
        const file = await handle.getFile();
        return { kind: 0, text: await file.text() };
      } catch (e) { return { kind: 3, text: String(e?.message || e) }; }
    }
    // Write the Worker's snapshot bytes to a bound file (off-tick `:w`): { ok, size, error }.
    async function realFsWrite(handle, bytes) {
      try {
        if (handle.requestPermission) {
          const perm = await handle.requestPermission({ mode: "readwrite" });
          if (perm !== "granted") return { ok: false, error: "write permission denied" };
        }
        const w = await handle.createWritable();
        await w.write(bytes);
        await w.close();
        return { ok: true, size: bytes.byteLength };
      } catch (e) { return { ok: false, error: String(e?.message || e) }; }
    }

    gridEl.addEventListener("keydown", (e) => {
      if (e.key === "F5" || e.key === "F12") return;
      if (e.metaKey && !e.ctrlKey) return; // leave browser Cmd-shortcuts alone
      const n = keyToNotation(e);
      if (n == null) return;
      e.preventDefault();
      // `<CR>` over a `:connect nxvim://…` command line dials a daemon instead of feeding the
      // key (a client affordance — the editor core has no `:connect`).
      if (n === "<CR>" && tryConnectIntercept()) return;
      // `<CR>` over a `:eo`/`:wo`/… command line opens the native picker instead of feeding
      // the key (the picker must fire synchronously here to keep the user gesture).
      if (n === "<CR>" && tryFilePickerIntercept()) return;
      feedOp(n);
    });

    // ============================================================================
    // Mouse. Core owns the hit-test from a global screen cell to a window + buffer
    // position, multi-click word/line selection, drag-select, and wheel scroll — the
    // page only forwards the raw cell, exactly as the TUI/GUI forward nvim_input_mouse.
    // ============================================================================
    const BTN = { 0: "left", 1: "middle", 2: "right" };
    let dragBtn = null;
    // Cell of the last drag (seeded by the press), so within-cell pointer motion is
    // coalesced away: the core works in cells, and a same-cell drag right after a
    // press would spuriously enter Visual mode. The browser fires `mousemove` for
    // every sub-cell pixel (a click that wobbles, a touchpad tap-and-move), so
    // without this every casual click drops into VISUAL. Mirrors nxvim-gui's
    // `last_drag_cell` coalescing (see crates/nxvim-gui/src/lib.rs `mouse_drag`).
    let lastDragCell = null;
    function cellAt(e) {
      const r = gridEl.getBoundingClientRect();
      return {
        col: Math.max(0, Math.floor((e.clientX - r.left) / cw)),
        row: Math.max(0, Math.floor((e.clientY - r.top) / ch)),
      };
    }
    function mods(e) { return (e.ctrlKey ? "C" : "") + (e.shiftKey ? "S" : "") + (e.altKey ? "A" : ""); }

    // Whether the cell (row, col) is over a draggable separator — a window-split
    // divider, a status row above one, or a dock band edge — and which way it
    // resizes ("col"/"row"/null). Mirrors nxvim-view's `resize_handle_at` (and the
    // server's hit-test) on the client `view`, so a hover shows a resize cursor
    // without a round-trip. Reuses the same `dockGeo`/`regionOrigin` the renderer
    // uses to place the regions, run backwards from a cell.
    function resizeHandleAt(row, col) {
      if (!view || !view.windows) return null;
      const hasTabline = serverStyled
        ? (view.tabline_segments?.length || view.tabline.length)
        : view.tabline.length;
      const tablineRows = hasTabline ? 1 : 0;
      const g = dockGeo(tablineRows);
      const res = (n) => (n > 0 ? n + 1 : 0);
      // Dock band edges sit between a dock and the main area.
      const inMid = row >= g.midY && row < g.midY + g.midH;
      if (g.dl > 0 && inMid && col === g.dl) return "col";
      if (g.dr > 0 && inMid && col === cols - res(g.dr)) return "col";
      if (g.dt > 0 && col < cols && row === g.dt) return "row";
      if (g.db > 0 && col < cols && row === editorRows - res(g.db)) return "row";
      // Split separators (and the status row one cell above a horizontal one).
      for (const s of (view.separators || [])) {
        const o = regionOrigin(s.region, tablineRows);
        if (s.vertical) {
          if (col === o.x + s.x && row >= o.y + s.y && row < o.y + s.y + s.length) return "col";
        } else {
          const sy = o.y + s.y;
          const inX = col >= o.x + s.x && col < o.x + s.x + s.length;
          if (inX && (row === sy || row + 1 === sy)) return "row";
        }
      }
      return null;
    }
    // Set the grid's hover cursor from the cell under the pointer (left as-is while
    // a drag is in progress — that keeps the cursor it grabbed with).
    function updateResizeCursor(e) {
      const { row, col } = cellAt(e);
      const h = resizeHandleAt(row, col);
      gridEl.style.cursor = h === "col" ? "col-resize" : h === "row" ? "row-resize" : "";
    }

    // Drag-select autoscroll: re-send the held drag on a timer while it sits in the
    // top/bottom band, since the browser fires no mousemove while the pointer is still.
    const AUTOSCROLL_MS = 40;
    let autoscrollCell = null, autoscrollTimer = null;
    function inScrollZone(row) { return row <= 0 || row + 2 >= editorRows + 1; }
    function armAutoscroll(row, col) {
      if (dragBtn === "left" && inScrollZone(row)) {
        autoscrollCell = { row, col };
        if (!autoscrollTimer) autoscrollTimer = setInterval(autoscrollTick, AUTOSCROLL_MS);
      } else {
        disarmAutoscroll();
      }
    }
    function disarmAutoscroll() {
      if (autoscrollTimer) { clearInterval(autoscrollTimer); autoscrollTimer = null; }
      autoscrollCell = null;
    }
    function autoscrollTick() {
      if (!dragBtn || !autoscrollCell) { disarmAutoscroll(); return; }
      mouseOp("left", "drag", "", autoscrollCell.row, autoscrollCell.col);
    }

    gridEl.addEventListener("mousedown", (e) => {
      gridEl.focus();
      refreshClipboard(); // a click is a user gesture — a good moment to re-read the OS clipboard
      const button = BTN[e.button];
      if (!button) return;
      e.preventDefault();
      disarmAutoscroll();
      const { row, col } = cellAt(e);
      if (button === "left") { dragBtn = "left"; lastDragCell = { row, col }; }
      mouseOp(button, "press", mods(e), row, col);
    });
    gridEl.addEventListener("mousemove", (e) => {
      if (!dragBtn) { updateResizeCursor(e); return; }
      const { row, col } = cellAt(e);
      // Only a drag into a *new* cell is meaningful; within-cell jitter is noise and
      // must not emit a drag (which the core would read as the start of a selection).
      if (lastDragCell && lastDragCell.row === row && lastDragCell.col === col) return;
      lastDragCell = { row, col };
      mouseOp(dragBtn, "drag", mods(e), row, col);
      armAutoscroll(row, col);
    });
    window.addEventListener("mouseup", (e) => {
      if (!dragBtn) return;
      disarmAutoscroll();
      const { row, col } = cellAt(e);
      mouseOp(dragBtn, "release", mods(e), row, col);
      dragBtn = null;
      lastDragCell = null;
    });

    // Wheel → whole-line notches. The browser fires many sub-line wheel events per
    // physical scroll; accumulate the fractional remainder so a slow drag still scrolls
    // one row at a time and a flung wheel doesn't fly. Mirrors WebEditor::wheel /
    // nxvim-gui's drain_notches; emitted as nvim_input_mouse wheel gestures.
    let wheelAccumX = 0, wheelAccumY = 0;
    function drainNotches(amount, axis) {
      if (axis === "y") { wheelAccumY += amount; const w = Math.trunc(wheelAccumY); wheelAccumY -= w; return w; }
      wheelAccumX += amount; const w = Math.trunc(wheelAccumX); wheelAccumX -= w; return w;
    }
    gridEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const { row, col } = cellAt(e);
      const m = mods(e);
      let lx, ly;
      if (e.deltaMode === 1) { lx = e.deltaX; ly = e.deltaY; }                       // line units
      else if (e.deltaMode === 2) { lx = e.deltaX * Math.max(1, cols); ly = e.deltaY * Math.max(1, editorRows); } // page
      else { lx = e.deltaX / Math.max(1, cw); ly = e.deltaY / Math.max(1, ch); }     // pixels
      const MAX = 10;
      const vn = drainNotches(ly, "y");
      if (vn !== 0) { const a = vn > 0 ? "down" : "up"; for (let i = 0; i < Math.min(Math.abs(vn), MAX); i++) mouseOp("wheel", a, m, row, col); }
      const hn = drainNotches(lx, "x");
      if (hn !== 0) { const a = hn > 0 ? "right" : "left"; for (let i = 0; i < Math.min(Math.abs(hn), MAX); i++) mouseOp("wheel", a, m, row, col); }
    }, { passive: false });
    gridEl.addEventListener("contextmenu", (e) => e.preventDefault());

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { layout(); attachOp(cols, editorRows); }, 80);
    });

    // Persist cross-session (shada) state when the tab is hidden/closed. Best-effort: an
    // async OPFS write may not finish on a hard close, but the Worker's debounced checkpoint
    // already captured the bulk during editing — this mainly stamps the exit cursor (`'0`).
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") requestShadaFlush();
      else refreshClipboard(); // tab re-shown — pick up a copy made while we were away
    });
    // Refresh the `"+`/`"*` read mirror whenever the editor (re)gains focus — switching back
    // from another app/tab is the moment an external copy needs to become visible to `"+p`.
    window.addEventListener("focus", refreshClipboard);
    gridEl.addEventListener("focus", refreshClipboard);

    // ============================================================================
    // Boot: measure, create the highlighter, then let the Worker's "ready" attach.
    // ============================================================================
    measureCell();
    layout();
    ts = createHighlighter ? createHighlighter({ onReady: tsRefresh }) : null;

    // The automation hook (Playwright / verify.mjs). `feed`/`mouse`/`execLua`/`attach`
    // resolve once the Worker has ticked and the frame rendered; `lines`/`frame`/`cursor`
    // read the latest rendered state synchronously.
    window.__nxvim = {
      ready: readyPromise,
      sab: useSAB,
      feed: (notation) => feedOp(notation),
      type: (notation) => feedOp(notation),
      // Press Enter *through* the client-side interceptions (the keydown path), so a
      // `:connect nxvim://…` dials a daemon and a `:eo`/`:wo`/… command line pops the picker.
      // Plain `feed("<CR>")` bypasses both.
      pressEnter: () =>
        tryConnectIntercept()
          ? Promise.resolve({ intercepted: "connect" })
          : tryFilePickerIntercept()
            ? Promise.resolve({ intercepted: true })
            : feedOp("<CR>"),
      // Flush cross-session (shada) state to OPFS now (resolves when written) — the tab-hide
      // path, exposed for tests so they can persist + reload without racing the debounce.
      shadaFlush: () => requestShadaFlush(),
      // Re-read the OS clipboard into the `"+`/`"*` mirror now (resolves once pushed). The
      // focus/visibility/click triggers do this in normal use; exposed so a test can prime an
      // external copy deterministically before a `"+p`.
      clipboardRefresh: () => refreshClipboard(),
      mouse: (button, action, modifier, row, col) => mouseOp(button, action, modifier, row | 0, col | 0),
      // Cell size in CSS px, so a test can drive *real* DOM mouse events (the
      // mousedown/mousemove/mouseup path, not the `mouse` hook) at sub-cell precision.
      cellMetrics: () => ({ cw, ch }),
      execLua: (code) => execLuaOp(code),
      attach: (c, r) => attachOp(c, r),
      lines: () => latest.lines,
      frame: () => latest.frame,
      cursor: () => {
        const fw = (latest.frame?.windows || []).find((w) => w.focused);
        return fw ? { row: fw.cursor_row, col: fw.cursor_col, screenCol: fw.cursor_screen_col } : null;
      },
      mode: () => latest.frame?.mode_label ?? "",
      cmdline: () => (latest.frame?.command_mode ? promptStr(latest.frame) + latest.frame.cmdline : ""),
      message: () => latest.frame?.message ?? "",
    };
  </script>
</body>
</html>
