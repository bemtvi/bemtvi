[workspace]
resolver = "2"
members = [
    "crates/nxvim",
    "crates/nxvim-core",
    "crates/nxvim-rpc",
    "crates/nxvim-server",
    "crates/nxvim-lua",
    "crates/nxvim-tui",
    "crates/nxvim-gui",
    "crates/nxvim-ts",
    "crates/nxvim-lsp",
    "crates/nxvim-view",
    "crates/nxvim-regex",
    "crates/nxvim-test-harness",
]
# nxvim-edithost is the real wasm edit-host: the reusable synchronous `EditHost` tick
# (core + Lua) compiled to `wasm32-unknown-emscripten` behind a wasm `HostEffects`, run
# in a Web Worker (Phase 5), built via its own build.sh. It is NOT a workspace member:
# excluding it keeps it out of the host `cargo build/test/clippy --workspace` flow,
# which can't meaningfully compile or link a wasm + C-deps artifact; being excluded, it
# pins its own dependencies rather than inheriting the workspace's. (It superseded the
# throwaway nxvim-edithost-demo, deleted in slice 5e.)
exclude = ["crates/nxvim-edithost"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["David Rios <david.rios.gomes@gmail.com>"]
repository = "https://github.com/davidrios/nxvim"
rust-version = "1.80"

[workspace.dependencies]
nxvim-core = { path = "crates/nxvim-core" }
nxvim-rpc = { path = "crates/nxvim-rpc" }
# nxvim-server is `default-features = false` so the `native` feature is off by
# default (the wasm edit-host builds without it); native binaries re-enable it
# via `features = ["native"]`. (There is no Lua-backend toggle to thread — see
# the mlua note below; PUC lua54 is baked into the shared mlua dep.)
nxvim-server = { path = "crates/nxvim-server", default-features = false }
nxvim-lua = { path = "crates/nxvim-lua" }
nxvim-tui = { path = "crates/nxvim-tui" }
nxvim-gui = { path = "crates/nxvim-gui" }
nxvim-ts = { path = "crates/nxvim-ts" }
# `default-features = false` so the wasm build (`nxvim-server --no-default-features`)
# drops nxvim-lsp's `native` (tokio + async-lsp); native consumers turn it back on
# via `nxvim-server`'s `native` feature → `nxvim-lsp/native` (feature unification).
nxvim-lsp = { path = "crates/nxvim-lsp", default-features = false }
nxvim-view = { path = "crates/nxvim-view" }
nxvim-regex = { path = "crates/nxvim-regex" }
# Test-only harness (a single Lua backend, PUC lua54, baked in via mlua).
nxvim-test-harness = { path = "crates/nxvim-test-harness" }

# Direct dependencies are pinned to exact versions (`=x.y.z`) for reproducible
# builds. Stable releases are preferred; a pre-release line is pinned only where
# there is no stable equivalent yet (e.g. ropey, still on 2.0.0-beta).
#
# Lua backend: vendored PUC Lua 5.4, the single backend (LuaJIT was dropped —
# nxvim is PUC-Lua-only, matching the wasm build, which never supported LuaJIT).
# 5.4 brings real 64-bit integers, native bitwise operators, the `utf8` library,
# yieldable `pcall`, and a generational GC over the old 5.1 baseline. `lua54` is
# selected here so every crate that links mlua shares it; there is no backend
# toggle to thread anymore.
anyhow = "=1.0.103"
# CLI argument parsing for the `nxvim` binary (the only consumer): the `derive`
# feature gives a struct-driven parser that validates flags, errors on unknown
# options, and auto-generates `--help`/`--version`.
clap = { version = "=4.6.1", features = ["derive"] }
ropey = "=2.0.0-beta.1"
# Fuzzy matcher (nucleo-class) shared by every static-source widget consumer —
# completion, `nx.ui.select`, and static pickers. The matcher-only sub-crate:
# pure Rust, no async/IO, so it lives inside the synchronous `nxvim-core`. Pure
# Rust ⇒ compiles under emscripten for the wasm edit-host too.
nucleo-matcher = "=0.3.1"
# Charset transcoding (the WHATWG Encoding Standard, Firefox's library) backing
# per-buffer `'fileencoding'` and the convert-on-read/write seam. Pure Rust, no
# C, no async/IO ⇒ lives inside the synchronous `nxvim-core` and compiles under
# emscripten for the wasm edit-host. `simd-accel` is left OFF (it needs nightly);
# the default `alloc` build is stable and portable. See
# docs/plans/2026-06-14-encoding-and-invalid-utf8.md.
encoding_rs = "=0.8.35"
# URL query-string + component percent-encoding for `nx.http` (the `query`/`form` opts
# and `nx.http.encode_query` / `encode_uri_component`). The canonical `rust-url`
# (servo) crates — pure Rust, wasm-safe, and already in the tree via `url`/`ureq`, so
# no bespoke encoder. `form_urlencoded` builds `application/x-www-form-urlencoded`
# query/body strings; `percent-encoding` does single-component `encodeURIComponent`.
form_urlencoded = "=1.2.2"
percent-encoding = "=2.3.2"
# CommonMark + GFM parser backing the markdown renderer for read-only doc popups
# (LSP hover / completion docs / picker preview): a pull parser that emits an event
# stream `nxvim_core::markdown` walks into stripped display lines + highlight spans.
# `default-features = false` drops its `html`/`getopts` bits — we only want the
# parser. Pure Rust, no C, no async/IO ⇒ lives inside the synchronous `nxvim-core`
# and compiles under emscripten for the wasm edit-host.
pulldown-cmark = { version = "=0.13.4", default-features = false }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
ratatui = "=0.30.2"
# In-terminal image rendering for the TUI client's `'imagepreview'` (Phase 2): a
# ratatui widget over Kitty/Sixel/iTerm2 graphics protocols, with a unicode
# halfblocks fallback. `chafa` (the higher-quality halfblocks encoder) is left OFF
# — its default `chafa-dyn`/`chafa-static` features drag in a C lib via pkg-config,
# and the graphics protocols (the good path) are pure Rust and unaffected; so we
# disable defaults and re-add only `image-defaults` + `crossterm`. Needs ratatui
# >=0.30.1. `image` is the decoder (a direct dep so the client builds the
# `DynamicImage` the picker turns into a protocol); pinned to share one compiled
# copy with ratatui-image's `^0.25.6`.
ratatui-image = { version = "=11.0.6", default-features = false, features = [
    "image-defaults",
    "crossterm",
] }
image = "=0.25.10"
# Raw `poll(2)` for the TUI's does-this-terminal-answer-queries probe (see
# `nxvim-tui/src/images.rs::terminal_answers_status_query`): it must wait for a
# reply *without consuming stdin*, which `std::io` can't express. Already in the
# tree transitively; pinned to the resolved version.
libc = "=0.2.186"
# Native GUI client stack (`nxvim-gui`). winit owns the window + input event loop,
# wgpu the GPU surface, and glyphon the text rendering (it re-exports cosmic-text,
# so the GUI reaches `FontSystem`/`Buffer`/`Attrs`/… through `glyphon::`). glyphon
# 0.11 builds against wgpu 29 — bump the two together (glyphon 0.12 wants wgpu 30
# but is newer than our 2-week-old dependency floor). `pollster` blocks on wgpu's
# async device/adapter requests from the synchronous winit setup path.
winit = "=0.30.13"
wgpu = "=29.0.4"
glyphon = "=0.11.0"
# Pulled in directly (same instance glyphon uses) only to enable `monospace_fallback`:
# without it cosmic-text's `Buffer::set_monospace_width` is a silent no-op, so wide
# (CJK/emoji) glyphs keep their font-native advance — not snapped to two cells — and
# the text after them drifts off the cell grid. The feature lets the shaper scale each
# glyph to a whole number of cells. Version must match glyphon's `cosmic-text` (0.18).
cosmic-text = { version = "=0.18.2", features = ["monospace_fallback"] }
pollster = "=0.4.0"
# Native system file dialog for the GUI's `:eo`/`:wn`/… pickers — all three
# desktop platforms, no GTK: NSOpenPanel on macOS, the Win32 `IFileDialog` on
# Windows, and the XDG desktop portal (over D-Bus) on Linux/BSD. `xdg-portal` (not
# the default `gtk3`) selects the portal backend and is a no-op on macOS/Windows;
# `default-features = false` also drops rfd's `wayland` feature, so the Linux build
# needs no system Wayland/GTK libraries (the dialog just isn't parented to the
# window on Wayland — it's still a normal top-level). The portal backend needs a
# running `xdg-desktop-portal` service at runtime, standard on modern desktops.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
# Cross-platform system-clipboard access for the GUI's Cmd+V paste (NSPasteboard /
# Win32 / X11+Wayland, all pure-Rust backends, no GTK), so unlike rfd it's a normal
# dependency. Text only — no image support.
arboard = { version = "=3.6.1", default-features = false }
# Build-dependency (Windows host only): embeds the app icon + version info into
# the nxvim-gui.exe via the Windows SDK's rc.exe. See crates/nxvim-gui/build.rs.
winresource = "=0.1.31"
# Build-dependency of nxvim-regex: compiles the vendored vim/neovim regexp
# engine (csrc/) into the crate. Plain C99; also builds for
# wasm32-unknown-emscripten (the nxvim-edithost target).
cc = "=1.2.66"
tokio = { version = "=1.52.3", features = ["rt", "macros", "io-util", "io-std", "net", "sync", "time", "process"] }
# Cross-platform filesystem notification backing `vim.uv.fs_event` in the server's
# event-loop actor. `macos_kqueue` selects the kqueue backend on macOS instead of
# the default FSEvents one: FSEvents' `watch()` talks to the `fseventsd` daemon and
# can block for seconds before it returns, which — on the server's single-threaded
# runtime — would freeze the editor every time a watch is armed; kqueue arms with a
# plain syscall (sub-ms) and needs no daemon. Linux still uses inotify, Windows
# ReadDirectoryChangesW (both already non-blocking). nxvim watches only a handful of
# paths (e.g. lualine's `.git/HEAD`), so kqueue's one-fd-per-watch cost is moot.
notify = { version = "=8.2.0", features = ["macos_kqueue"] }
futures = "=0.3.32"
rmpv = "=1.3.1"
mlua = { version = "=0.12.0", features = ["vendored", "serde", "lua54"] }
serde = { version = "=1.0.228", features = ["derive"] }
# Persistence (shada). `redb` is the pure-Rust, ACID, single-file embedded store
# each daemon's per-instance shada file lives in; `rmp-serde` encodes the table
# values as msgpack. Both server-only (the wasm core never links them). See
# docs/plans/2026-06-11-shada-persistence.md.
redb = "=4.1.0"
rmp-serde = "=1.3.1"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
# The GUI's custom font fallback (`UserFallback`) implements cosmic-text's
# `Fallback` trait, whose `script_fallback` is keyed by `unicode_script::Script`.
# Pinned to the version cosmic-text resolves so the trait's `Script` type unifies.
unicode-script = "=0.5.8"
regex = "=1.12.4"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
tree-sitter = "=0.26.10"
streaming-iterator = "=0.1.9"
libloading = "=0.9.0"
# Dev-only: real grammars compiled into a test fixture (never linked into the
# editor — nxvim loads grammars dynamically at runtime). `tree-sitter-md` is a host
# grammar that injects (markdown fenced code blocks → the fence's language), so the
# injection tests can exercise cross-language + nested injections, not just
# rust-in-rust self-injection.
tree-sitter-rust = "=0.24.2"
tree-sitter-md = "=0.5.3"

# `:TSInstall` grammar fetch + compile (nxvim-ts `install` module). All in-process
# so a *prebuilt* nxvim needs no external curl/git/tar at runtime. `ureq` is the
# blocking HTTP client over its bundled rustls (`tls`); rustls builds `ring` at
# *build* time (a cc/perl compile, which whoever builds nxvim has) — the
# runtime-no-compiler goal is about the end user, so this is fine, and it avoids
# the manual TLS-connector wiring `native-tls` would need. GitHub source tarballs
# are `.tar.gz` (`flate2` + `tar`); the fetched Zig toolchain ships `.tar.xz`
# on macOS/Linux (`xz2`) and a `.zip` on Windows (`zip`, reusing `flate2` for
# deflate via its `deflate-flate2` feature so we don't pull a second inflate
# stack). `sha2` verifies the pinned Zig checksum before we execute it.
ureq = { version = "=2.12.0", default-features = false, features = ["tls"] }
# The `nx.http.mount` listener (`nxvim-server`'s `httpmount` module) — the INBOUND
# twin of `ureq` above, which is outbound-only. One editor-owned origin serves every
# plugin's mounted subroute (`/plugin/<name>/*`); see
# `docs/plans/2026-07-14-nx-http-mount.md`. `axum` rather than a hand-rolled HTTP/1.1
# parser because inbound framing (chunked bodies, keep-alive, header edge cases) is a
# well-known footgun class, and rather than bare `hyper` because `axum::serve` is the
# one thing we need from it. `default-features = false` + `http1`/`tokio` keeps the
# tree to hyper/tower/http-body-util: no multipart, no ws, no macros, no `tower-http`,
# and NO tokio `rt-multi-thread` (the server is a current-thread runtime — axum needs
# a running reactor, not a threaded one). Native-gated in `nxvim-server` exactly like
# `ureq`: a browser tab cannot bind a port, so the wasm build reaches the same mount
# contract through a Service Worker instead.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tar = "=0.4.46"
flate2 = "=1.1.9"
xz2 = "=0.1.7"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
sha2 = "=0.11.0"
# Hash digests for the `nx.hash.*` Lua utilities (alongside `sha2`, which doubles
# as the zig-checksum verifier above). All RustCrypto, pure Rust and wasm-safe;
# they share the `digest = 0.11` trait surface so one `Digest` import covers all.
sha1 = "=0.11.0"
md-5 = "=0.11.0"

# LSP client stack — reached only through `nxvim-lsp` (Decision 1/2 of the LSP
# design). async-lsp owns the JSON-RPC `MainLoop`, framing, id correlation, and
# `$/cancelRequest`; lsp-types is the protocol type vocabulary.
#
# `lsp-types` is pinned to the exact version async-lsp 0.2.4 builds against
# (0.95.1, which still uses `url::Url`); a newer line would resolve to a *second*
# lsp-types and the types we construct wouldn't match async-lsp's API. Bump both
# together. `default-features = false` drops async-lsp's `client-monitor`/`stdio`
# (server-side helpers we don't use), keeping only the omni-trait client API and
# the tokio integration.
async-lsp = { version = "=0.2.4", default-features = false, features = ["omni-trait", "tokio"] }
lsp-types = "=0.95.1"
serde_json = "=1.0.150"
# `compat` bridges tokio's child-process pipes to the `futures` AsyncRead/Write
# that async-lsp's MainLoop drives.
tokio-util = { version = "=0.7.18", features = ["compat"] }

# The native daemon transport (edit-host split): WebTransport/QUIC, so native and
# the future browser path share one stack (Open Decision #2). Default features keep
# the `ring` crypto backend (no aws-lc-rs / cmake) and `self-signed` (rcgen) for the
# dev cert the daemon mints + the client pins TOFU. `connect_daemon`/`run_daemon_io`
# take any AsyncRead/AsyncWrite, so a QUIC bidi stream's halves drop straight in.
wtransport = "=0.7.1"
# CSPRNG for the launch-minted daemon bearer token (the sole auth gate — an
# unauthenticated daemon listener is RCE by design, Open Decision #2). Already in the
# tree transitively (ring/quinn); pulled in directly for `getrandom::fill`.
getrandom = "=0.4.3"

# Debug/test builds are dominated by DWARF debug info, not code: a test binary's
# `.text` is ~3MB while its debug sections are ~430MB, and the workspace produces
# hundreds of statically-linked test binaries — so full debuginfo balloons `target/`
# to tens of GB. `line-tables-only` keeps file/line in panic backtraces (what we
# actually need when a test fails) but drops the type/variable DWARF that made up
# the bulk. `split-debuginfo = "unpacked"` keeps that remaining debuginfo in shared
# object files under deps/ instead of copying it into every binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
